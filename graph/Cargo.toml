[package]
name = "graph"
version = "0.1.0"
edition = "2024"
description = "Core of the database"
license = "MIT"
repository = "https://github.com/FalkorDB/falkordb-rs-next-gen"
readme = "../README.md"
keywords = ["graph", "database"]
categories = ["data-structures", "database"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[features]
# See root Cargo.toml feature of the same name. Pass-through so the runtime
# JIT-control choice in matrix.rs is selectable at build time, not from a
# process env var that could leak into a shipped binary.
prejit_harvest = []


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8"
atomic_refcell = "0.1.14"
chrono = "0.4.45"
crossfire = "3.1.16"
csv = "1.4.0"
itertools = "0.15.0"
json-escape = "0.3.1"
lru = "0.18.0"
num_enum = "0.7.6"
once_cell = "1.21.4"
parking_lot = "0.12.5"
phf = { version = "0.14", features = ["macros"] }
orx-tree = "2.2.0"
rand = "0.10.1"
regex = "1.12.3"
rquickjs = { version = "0.12", features = ["bindgen", "classes", "parallel"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
roaring = "0.11.4"
rustc-hash = "2"
simsimd = "6.5"
smallvec = "1.15.1"
thin-vec = "0.2.18"
thiserror = "2"
triomphe = "0.1.16"
