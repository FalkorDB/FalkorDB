[package]
name = "graph"
version = "0.1.0"
edition = "2024"
description = "Core of the database"
license = "SSPL-1.0"
repository = "https://github.com/FalkorDB/FalkorDB"
readme = "../README.md"
keywords = ["graph", "database"]
categories = ["data-structures", "database"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[features]
# See root Cargo.toml feature of the same name. Pass-through so the runtime
# JIT-control choice in matrix.rs is selectable at build time, not from a
# process env var that could leak into a shipped binary.
prejit_harvest = []

# Exposes the codec's forcing helpers, which exist only to be measured:
# `IdList::write_forced` writes a *nominated* encoding, which is the one thing
# the production API deliberately will not let a caller do — `encode` picks.
#
# `cfg(test)` cannot serve, because a bench is its own compilation unit and
# would lose them. The self dev-dependency below is what turns this on for
# tests and benches only, so `cargo bench` needs no extra flag and a release
# build never sees them.
test-util = []


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8"
arc-swap = "1"
atomic_refcell = "0.1.14"
chrono = "0.4.45"
crossfire = "3.1.19"
csv = "1.4.0"
itertools = "0.15.0"
json-escape = "0.3.1"
lru = "0.18.1"
num_enum = "0.7.6"
once_cell = "1.21.4"
parking_lot = "0.12.5"
phf = { version = "0.14", features = ["macros"] }
orx-tree = "2.2.0"
rand = "0.10.2"
regex = "1.13.0"
rquickjs = { version = "0.12", features = ["bindgen", "classes", "parallel"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
roaring = "0.11.4"
rustc-hash = "2"
simsimd = "6.5"
smallvec = "1.15.2"
thin-vec = "0.2.18"
thiserror = "2"
zstd = { version = "0.13.3", default-features = false, features = ["arrays", "legacy", "zdict_builder"] }
crc32fast = "1.4"
