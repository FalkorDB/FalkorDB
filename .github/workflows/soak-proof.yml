# TEMPORARY: perf-soak-port's proof evidence for the soak check (#3982), removed before
# the PR is marked ready. Runs soak_check.py through _perf-vm.yml (perf-gce-runner's
# branch until it is on main, #3979) on one VM: shard soak-b (s07-s12), 6.2.0 (candidate)
# vs 6.2.1 (baseline), which differ in s12's ingest plan (#3887 in 6.2.0, its fix #3889
# backported to 6.2.1). The VM-workflow check name differs only so the artifact is
# recognisable; the result.json says check "soak-b".
#
# The leg runs only for a push that itself changes the "Proof of:" line below (the `gate`
# job diffs the push's before and after): a `paths` filter would match the whole PR's
# diff, and `workflow_dispatch` works only for a file on the default branch. To prove a
# new commit, change that line deliberately, after telling the coordinator.
# Proof of: 40675d3dd (the port), 6.2.0 vs 6.2.1 on soak-b.

name: TEMPORARY soak proof

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: soak-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # No pipe into grep -q: with the default pipefail an early exit of
          # grep would make a match read as no match.
          run=false
          if [[ -n $BEFORE ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff -U0 "$BEFORE" "$AFTER" -- .github/workflows/soak-proof.yml > proof.diff
            if grep -q '^+# Proof of:' proof.diff; then run=true; fi
          fi
          echo "before=${BEFORE:-none} after=$AFTER run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  proof:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - check: soak-b-620-vs-621
            candidate: falkordb/falkordb-server@sha256:44eb4a6d48ef6f2b06aeefea46c5f4c17cd2310d3832135be18fd7fc8ba30923
            candidate_label: "6.2.0"
            candidate_commit: d8c329b777c177fc7343d959157d6acdf7398fa5
            baseline: falkordb/falkordb-server@sha256:a8fb264e6b90db5c1e6e3a42af5128efcc13590ce2ca8e65d870b456806f24de
            baseline_label: "6.2.1"
            baseline_commit: 617955cf660770f33e69fb9765e8b75df03636c1
    uses: FalkorDB/FalkorDB/.github/workflows/_perf-vm.yml@ci/perf-vm
    with:
      check: ${{ matrix.check }}
      command: uv run --no-project --python 3.12 --with-requirements tests/soak/requirements.txt python -I tests/soak/soak_check.py --check soak-b --scenarios s07,s08,s09,s10,s11,s12
      candidate_image: ${{ matrix.candidate }}
      baseline_image: ${{ matrix.baseline }}
      candidate_label: ${{ matrix.candidate_label }}
      baseline_label: ${{ matrix.baseline_label }}
      candidate_commit: ${{ matrix.candidate_commit }}
      baseline_commit: ${{ matrix.baseline_commit }}
      mode: nightly
      timeout_minutes: 135
      machine_type: n4-standard-16
    secrets: inherit
