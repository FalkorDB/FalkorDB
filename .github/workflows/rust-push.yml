name: Rust Push

on:
  push:
    # Mirror rust-pr.yml's filter so post-merge CI on version branches works
    # the same as on a trunk. Channel-pointer promotion (toolchain :latest,
    # :edge) is still gated to a TRUNK further down — see the `if:` on those
    # jobs. The version glob is `[0-9]*.[0-9]*` (glob, not regex; `*` is
    # multi-char).
    #
    # FalkorDB/FalkorDB, which carries this tree while the C engine keeps
    # `master`). Both promote the same channels, so the migration doesn't
    # silently stop publishing the rolling image. Gates below spell this as
    # github.ref == 'refs/heads/main'.
    branches:
      - "main"
      - "[0-9]*.[0-9]*"

permissions:
  # `deployments: write` + `contents: write` used to exist only so the benchmark
  # trend could publish to the gh-pages branch. That job is gone, and every
  # remaining job either declares its own permissions (find-pr, docker,
  # promote-edge) or needs read only.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  check-files:
    runs-on: ubuntu-latest
    outputs:
      file_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if specific file changed
        id: check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE "^(build/Dockerfile|build/build-server\.sh|build/libomp\.sh|build/graphblas/.*|native-deps/.*|deps/native-deps\.lock|deps/(GraphBLAS|LAGraph|RediSearch)|\.gitmodules|\.dockerignore|\.github/workflows/build-toolchain\.yml)$"; then
            echo "changed=true"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  # Promote the toolchain image the MERGE QUEUE built (falkordb-build:mg-<sha>)
  # to :latest by retagging the existing manifest — no rebuild, so what was
  # validated is byte-identically what becomes :latest.
  #
  # Keyed on the commit SHA, not a PR number. The queue tests the merge
  # candidate and that commit is what lands, so github.sha here is the same SHA
  # the queue built under. The old commit->PR lookup existed because squash
  # merges produced SHAs that were never built; the queue makes that false.
  # Gated on file_changed because the toolchain only gets a per-PR tag when
  # build/Dockerfile actually changed in that PR.
  docker:
    needs: check-files
    if: ${{ needs.check-files.outputs.file_changed == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote :mg-${{ github.sha }} → :latest
        env:
          CI_KEY: mg-${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ghcr.io/falkordb/falkordb-build:latest \
            "ghcr.io/falkordb/falkordb-build:${CI_KEY}"

  # Promote the runtime images the MERGE QUEUE built and tested
  # (rc-mg-<sha>-valkey and rc-mg-<sha>-redis) to the rolling tags on every
  # trunk merge: edge-rs-valkey and edge-rs-redis, with edge and edge-rs
  # pointing at Valkey. It is a retag of the same manifests, never a rebuild,
  # on both repositories and both registries; build/publish_tags.py lists the
  # tags, checks each source first, and checks every tag's digest after.
  #
  # Deliberately NOT the PR's own rc-pr-<N>-<server> images, even though
  # same-repo PRs still publish them. Those are built from the PR head; the
  # queue's are built from the merge candidate, which is what actually lands.
  # A fork PR has no rc-pr-<N>-<server> at all, so keying on it would simply
  # fail for forks.
  #
  # The C engine's rolling images are the `edge-c` family on `master`, and C
  # never published to GHCR, so there is no contention on either registry.
  # `latest` is untouched: it moves only on a release, via release-tag.yml.
  promote-edge:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the tag plan
        run: python3 build/test_publish_tags.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote rc-mg-${{ github.sha }}-<server> to the rolling tags
        run: python3 build/publish_tags.py edge --sha "$GITHUB_SHA" --execute

  # The tag check also checks latest*, which fails while a release is between
  # publishing its GitHub release and pushing its images. So wait for the
  # image job of any release-tag.yml run still going; if one is still going
  # after 30 minutes, fail here, naming it, rather than run the check.
  await-release:
    needs: promote-edge
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
    steps:
      - name: Wait for release images still being pushed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 30 * 60 ))
          while :; do
            busy=""
            # Queued runs count too: a release published from the UI is
            # public before its run starts. Assigned on its own line, so a
            # failed call fails the job instead of reading as "no release
            # running".
            runs=$(gh api "repos/${GH_REPO}/actions/workflows/release-tag.yml/runs?per_page=20" \
                     --jq '.workflow_runs[] | select(.status != "completed") | .id')
            for run in $runs; do
              # An image job not scheduled yet counts as still to come. A tag
              # on an older version branch runs that branch's release-tag.yml,
              # whose image job is a matrix: "image (falkordb)" and so on.
              states=$(gh api "repos/${GH_REPO}/actions/runs/${run}/jobs?per_page=100" --paginate \
                         --jq '.jobs[] | select(.name == "image" or (.name | startswith("image ("))) | .status')
              if [ -z "$states" ] || grep -qv '^completed$' <<<"$states"; then
                busy="$busy https://github.com/${GH_REPO}/actions/runs/${run}"
              fi
            done
            if [ -z "$busy" ]; then
              echo "No release is pushing images."
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::release-tag.yml is still pushing images after 30 minutes:${busy}. The tag check would fail on latest* until it finishes; re-run this workflow's failed jobs once it has."
              exit 1
            fi
            echo "waiting for release images:${busy}"
            sleep 30
          done

  check-tags:
    needs: await-release
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/check-published-tags.yml
    with:
      target: edge
    # Docker Hub login, against its anonymous pull rate limit.
    secrets: inherit

  flow-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate test matrix
        id: set-matrix
        run: |
          echo "test_files=$(jq -Rc '[., inputs] | map(select(length > 0))' flow_tests_done.txt)" >> $GITHUB_OUTPUT
  coverage:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:latest
    needs: docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "coverage"
          env-vars: "RUSTFLAGS"
      - name: Run code coverage
        run: |
          RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo build
          RUSTDOCFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo test -p graph
          # `cargo build` only produces libfalkordb.so's coverage map, which is
          # blind to code with no caller reachable from the cdylib (e.g.
          # graph/src/index/falkordb's cow_btree, not wired into the runtime
          # yet). Locate the `cargo test -p graph` unit-test binary too (cache
          # hit, same RUSTFLAGS as above, so this doesn't rebuild or re-run
          # anything) so llvm-cov can also credit coverage recorded by
          # test-only call paths, not just the shared library's. Cargo prints
          # "  Executable <target> (<path>)" to stderr for every test binary
          # it builds (one per test target; today that's just the lib's own
          # unit tests) — no jq/python needed to find it.
          TEST_OBJECTS=""
          for bin in $(RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo test -p graph --no-run 2>&1 | grep -w Executable | grep -oE 'target/debug/deps/[^)]+'); do
            TEST_OBJECTS="$TEST_OBJECTS -object $bin"
          done
          echo "Additional coverage objects: $TEST_OBJECTS"
          # Snapshot coverage here, before the e2e/TCK suites run below, so
          # cargo test's own profraw can be reported as its own Codecov flag
          # (unit-tests) instead of being indistinguishable from e2e coverage.
          llvm-profdata-23 merge --sparse `find . -name "*.profraw"` -o cov-unit.profdata
          llvm-cov-23 export --format=lcov --instr-profile cov-unit.profdata target/debug/libfalkordb.so $TEST_OBJECTS > codecov-unit.txt.all
          lcov --ignore-errors unused -r codecov-unit.txt.all -o codecov-unit.txt
          . /data/venv/bin/activate
          pytest tests/test_e2e.py tests/test_functions.py tests/test_mvcc.py tests/test_concurrency.py -vv
          TCK_DONE=tck_done.txt pytest tests/tck/test_tck.py -s
          llvm-profdata-23 merge --sparse `find . -name "*.profraw"` -o cov.profdata
          llvm-cov-23 export --format=lcov --instr-profile cov.profdata target/debug/libfalkordb.so $TEST_OBJECTS > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt
      # Coverage runs on Valkey, the harness default. tests/common.py starts the
      # server with --logfile redis-test.log.
      - name: Check the server this job ran (valkey)
        if: ${{ success() }}
        run: tests/assert_server_log.sh valkey redis-test.log
      - name: Upload unit test coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./codecov-unit.txt
          flags: unit-tests
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  build-coverage:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:latest
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "coverage"
          env-vars: "RUSTFLAGS"
      - name: Build with coverage
        run: |
          RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo build
      - name: Upload coverage binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-binary
          path: target/debug/libfalkordb.so
  coverage-flow:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:latest
    needs:
      - docker
      - flow-test-matrix
      - build-coverage
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.flow-test-matrix.result == 'success' && needs.build-coverage.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.flow-test-matrix.outputs.test_files) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download coverage binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-binary
          path: target/debug
      - run: chmod +x target/debug/libfalkordb.so
      - name: Run coverage - ${{ matrix.test_file }}
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          . /data/venv/bin/activate
          TEST="$TEST_FILE" FAIL_FAST=1 ./flow.sh
          llvm-profdata-23 merge --sparse `find . -name "*.profraw"` -o cov.profdata
          llvm-cov-23 export --format=lcov --instr-profile cov.profdata target/debug/libfalkordb.so > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt
      # Coverage runs on Valkey, flow.sh's default.
      - name: Check the server this job ran (valkey)
        if: ${{ success() }}
        run: tests/assert_server_log.sh valkey tests/flow/logs
      - name: Upload flow logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-flow-logs-${{ strategy.job-index }}
          path: |
            tests/flow/logs/
          if-no-files-found: ignore
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
