# Flame-graph profiling of this PR's FalkorDB engine, on demand.
#
# Trigger: add a per-size label `profile-small` | `profile-medium` |
# `profile-large` to a PR (its rc-pr image is profiled), or the `-arm` variants
# (same profile on a c4a-highcpu-16 Axion VM, published under `pr-<N>-arm`), or
# run manually from the Actions tab. Separate from the A/B/C throughput
# benchmark because perf sampling perturbs timing — this runner only profiles.
#
# Shape: one ephemeral self-hosted GCE VM (perf needs host access + native
# symbols; profile.sh loads OUR module into the image's redis-server and
# samples from the host). It publishes flamegraph.svg to gh-pages under
# benchmark/branch/pr-<N>/profile/<size>/ (the impact page links to it when it
# exists) and uploads the folded stacks + perf report as artifacts.
#
# Verified locally: the flame graph symbolizes the full engine + GraphBLAS
# path. Workload is 5% writes (WRITE_RATIO), matching the A/B benchmark, so the
# flame graph covers the write path too; override via the PROFILE_WRITE_RATIO
# repo variable.
name: Profile (flame graph)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Server image tag on ghcr.io/falkordb/falkordb-server to profile"
        required: false
        default: "edge-rs"
      dataset_size:
        description: "Workload dataset size"
        required: false
        default: "small"
        type: choice
        options: ["small", "medium", "large"]
      arch:
        description: "CPU architecture: x86 (n4-highcpu-16) or arm (c4a-highcpu-16 Axion)."
        required: false
        default: "x86"
        type: choice
        options: ["x86", "arm"]

permissions:
  contents: read

concurrency:
  # Split by arch so x86 and arm profiles for the same PR run in parallel
  # (same-arch runs still serialize). arch from the -arm label suffix / dispatch input.
  group: profile-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.inputs.arch == 'arm' || endsWith(github.event.label.name, '-arm')) && 'arm' || 'x86' }}
  cancel-in-progress: false

env:
  BENCHMARK_REPO: FalkorDB/benchmark
  BENCHMARK_REF: deca7752cbd8cdeb333493569472ede385d5b5db # v2.2

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        contains(fromJSON('["profile-small","profile-medium","profile-large","profile-small-arm","profile-medium-arm","profile-large-arm"]'), github.event.label.name) &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.d.outputs.image }}
      size: ${{ steps.d.outputs.size }}
      view: ${{ steps.d.outputs.view }}
      pr_number: ${{ steps.d.outputs.pr_number }}
      arch: ${{ steps.d.outputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts/benchmark
          persist-credentials: false
      - name: Derive image / size / view
        id: d
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_DATASET_SIZE: ${{ github.event.inputs.dataset_size }}
          INPUT_ARCH: ${{ github.event.inputs.arch }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            IMAGE="ghcr.io/falkordb/falkordb-server:${INPUT_IMAGE_TAG}"
            SIZE="${INPUT_DATASET_SIZE:-small}"
            ARCH="${INPUT_ARCH:-x86}"
            VIEW=$(.github/scripts/benchmark/view-slug.sh "$DISPATCH_REF_NAME")
            OUT_PR=""
          else
            IMAGE="ghcr.io/falkordb/falkordb-server:rc-pr-${PR_NUMBER}"
            # profile-<size>[-arm] label -> size + arch (profile-small-arm ->
            # small/arm). The prepare gate guarantees one of the six labels.
            REST="${LABEL_NAME#profile-}"          # e.g. small | small-arm
            if [ "${REST%-arm}" != "$REST" ]; then
              ARCH="arm"; SIZE="${REST%-arm}"
            else
              ARCH="x86"; SIZE="$REST"
            fi
            VIEW="pr-${PR_NUMBER}"
            OUT_PR="$PR_NUMBER"
          fi
          # arm publishes under its own -arm view (matches the benchmark).
          if [ "$ARCH" = "arm" ]; then VIEW="${VIEW}-arm"; fi
          {
            echo "image=${IMAGE}"
            echo "size=${SIZE}"
            echo "view=${VIEW}"
            echo "pr_number=${OUT_PR}"
            echo "arch=${ARCH}"
          } >> "$GITHUB_OUTPUT"
          echo "Derived: image=${IMAGE} size=${SIZE} view=${VIEW} pr=${OUT_PR} arch=${ARCH}"

  create-runner:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create GCE runner (${{ needs.prepare.outputs.size }}/${{ needs.prepare.outputs.arch }})
        uses: ./.github/actions/create-runner
        with:
          token: ${{ secrets.GH_SA_TOKEN }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          # arm → Axion (c4a) in the arm-capable zones; else the x86 N4 default.
          machine_zones: ${{ needs.prepare.outputs.arch == 'arm' && (vars.GCP_ZONES_ARM || vars.GCP_ZONES) || vars.GCP_ZONES }}
          machine_type: ${{ needs.prepare.outputs.arch == 'arm' && (vars.BENCHMARK_MACHINE_TYPE_ARM || 'c4a-highcpu-16') || (vars.BENCHMARK_MACHINE_TYPE || 'n4-highcpu-16') }}
          arm: ${{ needs.prepare.outputs.arch == 'arm' }}
          # debian-12-arm64 mirrors x86's gcloud-default Debian (arm64 variant).
          image_family: ${{ needs.prepare.outputs.arch == 'arm' && (vars.BENCHMARK_IMAGE_FAMILY_ARM || 'debian-12-arm64') || '' }}
          image_project: ${{ needs.prepare.outputs.arch == 'arm' && (vars.BENCHMARK_IMAGE_PROJECT_ARM || 'debian-cloud') || '' }}
          network: gh-runner
          runner_label: profile-${{ github.run_id }}-${{ github.run_number }}-${{ needs.prepare.outputs.size }}

  profile:
    needs: [prepare, create-runner]
    runs-on: profile-${{ github.run_id }}-${{ github.run_number }}-${{ needs.prepare.outputs.size }}
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      HOME: /root
    steps:
      - name: Install toolchain + perf + inferno deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config libssl-dev protobuf-compiler
          # perf: try the kernel-matched package, then generic fallbacks. The
          # exact one depends on the GCE image's kernel — the first that yields
          # a working `perf` wins.
          apt-get install -y --no-install-recommends "linux-perf" 2>/dev/null \
            || apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" 2>/dev/null \
            || apt-get install -y --no-install-recommends linux-tools-generic 2>/dev/null || true
          perf --version || { echo "::error::perf not available on this runner kernel ($(uname -r))"; exit 1; }
          # perf on our own root VM: allow kernel+user sampling.
          sysctl -w kernel.perf_event_paranoid=-1 || true
          sysctl -w kernel.kptr_restrict=0 || true

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout this repo (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout FalkorDB/benchmark@${{ env.BENCHMARK_REF }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark-tool
          persist-credentials: false

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: benchmark-tool

      - name: Install inferno (flame graph renderer)
        run: cargo install inferno

      - name: Profile (${{ needs.prepare.outputs.size }})
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          DATASET_SIZE: ${{ needs.prepare.outputs.size }}
          BENCHMARK_DIR: ${{ github.workspace }}/benchmark-tool
          OUT_DIR: ${{ runner.temp }}/profile-out
          QUERIES_COUNT: ${{ vars.BENCHMARK_QUERIES_COUNT || '20000' }}
          PARALLEL: ${{ vars.BENCHMARK_PARALLEL || '20' }}
          MPS: ${{ vars.BENCHMARK_MPS || '5000' }}
          # Profile the write path too: 5% writes, matching the A/B benchmark.
          WRITE_RATIO: ${{ vars.PROFILE_WRITE_RATIO || '0.05' }}
          # Exercise text+vector index query flows, matching the A/B benchmark.
          QUERY_PROFILE: ${{ vars.PROFILE_QUERY_PROFILE || 'fixture-dependent' }}
          # Cap the perf capture (seconds) so perf.data can't fill the runner disk.
          PROFILE_DURATION: ${{ vars.PROFILE_DURATION || '90' }}
        run: .github/scripts/benchmark/profile.sh

      - name: Upload profiling artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: profile-${{ needs.prepare.outputs.view }}-${{ needs.prepare.outputs.size }}
          path: |
            ${{ runner.temp }}/profile-out/flamegraph.svg
            ${{ runner.temp }}/profile-out/out.folded
            ${{ runner.temp }}/profile-out/perf-report.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish flame graph to gh-pages
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIEW: ${{ needs.prepare.outputs.view }}
          SIZE: ${{ needs.prepare.outputs.size }}
          OUT_DIR: ${{ runner.temp }}/profile-out
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          [ -f "$OUT_DIR/flamegraph.svg" ] || { echo "no flamegraph.svg — nothing to publish"; exit 0; }
          rel="benchmark/branch/${VIEW}/profile/${SIZE}"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$RUNNER_TMP/gh-pages"
          cd "$RUNNER_TMP/gh-pages"
          mkdir -p "$rel"
          cp "$OUT_DIR/flamegraph.svg" "$rel/flamegraph.svg"
          [ -f "$OUT_DIR/perf-report.txt" ] && cp "$OUT_DIR/perf-report.txt" "$rel/perf-report.txt"
          git add -A -- "$rel"
          "$GITHUB_WORKSPACE/.github/scripts/benchmark/gh-pages-push.sh" "profile: ${VIEW}/${SIZE} flame graph"
          echo "published: https://$(echo "${REPO%%/*}" | tr '[:upper:]' '[:lower:]').github.io/${REPO#*/}/${rel}/flamegraph.svg"

  cleanup-runner:
    needs: [prepare, profile]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          instance_label: profile-${{ github.run_id }}-${{ github.run_number }}-${{ needs.prepare.outputs.size }}
