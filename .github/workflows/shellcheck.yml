# Lint the benchmark helper scripts with shellcheck on every PR that touches
# them. Scoped to .github/scripts/benchmark so it never fails on unrelated
# pre-existing repo scripts (graphblas.sh, flow.sh, …). shellcheck ships
# preinstalled on the ubuntu-latest runner image.
name: Shellcheck

on:
  pull_request:
    paths:
      - ".github/scripts/benchmark/**"
      - ".github/workflows/shellcheck.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck .github/scripts/benchmark/*.sh
