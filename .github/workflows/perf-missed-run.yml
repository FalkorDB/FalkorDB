# The 05:00 UTC missed-night alarm: tests/perf/report/missed_run.py, described in
# tests/perf/report/README.md. `date` (workflow_dispatch) re-checks an earlier night.

name: perf missed-run alarm

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Night to check, YYYY-MM-DD in UTC (empty: today)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

# One group per run: no check (scheduled, re-run or hand-started) can displace
# another one that is waiting; the attempts of one run stay in one group.
concurrency:
  group: perf-missed-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  alarm:
    name: Nightly perf result exists
    if: ${{ github.repository == 'FalkorDB/FalkorDB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tests/perf/report
          persist-credentials: false
      - name: Look for the night's perf-nightly artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PERF_CHAT_WEBHOOK: ${{ secrets.PERF_CHAT_WEBHOOK }}
          NIGHT: ${{ inputs.date }}
        run: python3 -I tests/perf/report/missed_run.py ${NIGHT:+--date "$NIGHT"}
