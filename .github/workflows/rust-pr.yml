name: Rust PR

on:
  pull_request:
    # Fire on PRs to main AND to version branches (e.g. "6.0", "7.1"). Backport
    # PRs from batch-backport.yml target the version branch directly, so they
    # need the same RC build + flow gate as main PRs. rc-pr-<N> tags are
    # globally unique by PR number so there's no collision across base branches.
    # GHA branch filters are glob patterns, not regex — `*` matches a run of
    # chars, `[0-9]` is a digit class, so `[0-9]*.[0-9]*` matches `6.0`, `7.1`,
    # `10.5`, etc. (A literal `+` would NOT have matched anything.)
    branches:
      - "main"
      - "[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.1

permissions:
  contents: read

jobs:
  check-files:
    runs-on: ubuntu-latest
    outputs:
      file_changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Check if specific file changed
        id: check
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Pick the right diff target for "did the toolchain change":
        #   - PRs targeting main, or stacked feat/ branches that ultimately
        #     land on main → diff against origin/main's merge-base. Catches
        #     toolchain changes anywhere in the stack so the :pr-<N> tag is
        #     rebuilt for this PR (downstream jobs would otherwise fall back
        #     to :latest, which doesn't exist on GHCR until the stack lands).
        #   - PRs targeting a version branch (e.g. 6.0, 7.1, set by
        #     batch-backport.yml) → diff against that version branch's
        #     merge-base. :latest already exists on GHCR (the version branch
        #     was cut from a released main), so an immediate-base diff is
        #     correct and avoids spuriously rebuilding when main and the
        #     version branch diverge on the Dockerfile.
        run: |
          # actions/checkout above used fetch-depth: 0 so we have full history,
          # but only the PR's branch is fetched by default — pull the diff
          # target as a ref too so merge-base can find the actual divergence.
          if [[ "$BASE_REF" =~ ^[0-9]+\.[0-9]+$ ]]; then
            DIFF_TARGET="$BASE_REF"
          else
            DIFF_TARGET="main"
          fi
          git fetch --no-tags origin "$DIFF_TARGET"
          MERGE_BASE=$(git merge-base "origin/$DIFF_TARGET" "$HEAD_SHA")
          if git diff --name-only "$MERGE_BASE" "$HEAD_SHA" | grep -q "build/Dockerfile"; then
            echo "changed=true"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
  # When build/Dockerfile changes, rebuild the toolchain image at a PR-scoped
  # tag (ghcr.io/falkordb/falkordb-build:pr-<N>, multi-arch). Other jobs in
  # this workflow pick up the new toolchain via the `container:` references
  # and the build-rc-image's build_image input.
  docker:
    needs: check-files
    if: needs.check-files.outputs.file_changed == 'true'
    uses: ./.github/workflows/build-toolchain.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: pr-${{ github.event.pull_request.number }}
    # build-toolchain.yml only uses the auto-injected GITHUB_TOKEN; no
    # custom secrets to forward, so we don't need `secrets: inherit`.

  # Build the runtime image (rc-pr-<N>) once, push to GHCR. All flow / e2e test
  # jobs below pull this image as a services container instead of dynamically
  # loading a locally-built .so. When the toolchain was rebuilt this PR
  # (build/Dockerfile changed), the runtime build uses the PR's toolchain too —
  # so test feedback reflects the same image bytes main will publish on merge.
  build-rc-image:
    needs: [check-files, docker]
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: rc-pr-${{ github.event.pull_request.number }}
      commit_sha: ${{ github.event.pull_request.head.sha }}
      browser_tag: edge
      push_to_dockerhub: false
      is_latest: false
      build_image: ${{ needs.check-files.outputs.file_changed == 'true' && format('ghcr.io/falkordb/falkordb-build:pr-{0}', github.event.pull_request.number) || 'ghcr.io/falkordb/falkordb-build:latest' }}
    # push_to_dockerhub is hard-coded false for PR RC builds, so no Docker Hub
    # token is needed. The reusable workflow's GITHUB_TOKEN is auto-injected.

  # Build the ASAN-instrumented runtime image (amd64-only) alongside the
  # regular RC. Same toolchain plumbing — when the PR rebuilt the toolchain,
  # the sanitizer .so also uses the PR's toolchain.
  build-rc-asan-image:
    needs: [check-files, docker]
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sanitizer image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: build/runtime/Dockerfile.asan
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_IMAGE=${{ needs.check-files.outputs.file_changed == 'true' && format('ghcr.io/falkordb/falkordb-build:pr-{0}', github.event.pull_request.number) || 'ghcr.io/falkordb/falkordb-build:latest' }}
          tags: ghcr.io/falkordb/falkordb:rc-pr-${{ github.event.pull_request.number }}-asan
          cache-from: type=registry,ref=ghcr.io/falkordb/falkordb:buildcache-asan
          cache-to:   type=registry,ref=ghcr.io/falkordb/falkordb:buildcache-asan,mode=max

  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "clippy"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: |
          CXX=clang++-22 cargo clippy --all-targets
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
      # Mount the runner's docker socket so the "Capture service container
      # logs on failure" step below can run `docker ps`/`docker logs` against
      # the GHA service container. Without this the log-capture step is a
      # silent no-op (and could mask the upload-artifact step).
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    needs:
      - check-files
      - docker
      - build-rc-image
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.build-rc-image.result == 'success' }}
    permissions:
      contents: read
      packages: read
    services:
      falkordb:
        image: ghcr.io/falkordb/falkordb-server:rc-pr-${{ github.event.pull_request.number }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["6379:6379"]
    env:
      EXISTING_ENV: "1"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "release"
      # Cargo unit tests run against in-process code and don't touch redis.
      - name: Run cargo unit tests
        run: |
          cargo test --release -p graph
      - name: Run pytest tests against the RC image
        run: |
          . /data/venv/bin/activate
          pytest tests/test_e2e.py tests/test_functions.py tests/test_mvcc.py tests/test_concurrency.py -vv
      - name: Run TCK tests against the RC image
        run: |
          . /data/venv/bin/activate
          TCK_DONE=tck_done.txt pytest tests/tck/test_tck.py -s
      # Capture the GHA service container's stdout/stderr so a failing run
      # carries the redis lifecycle, module RedisModule_Log output, and any
      # ASAN/LSan reports off the runner. The service container is named
      # after its YAML key ("falkordb"); `docker logs` is run via the
      # /var/run/docker.sock the runner shares with the job container.
      - name: Capture service container logs on failure
        if: failure()
        run: |
          mkdir -p tests/flow/logs
          # Dump every container the runner can see — GHA service containers
          # are named after their YAML key but a workflow-run prefix can show
          # up too; iterating all containers is safer than matching by name.
          for cid in $(docker ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's|^/||')
            docker logs "$cid" > "tests/flow/logs/service-${name:-$cid}.log" 2>&1 || true
          done
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-service-logs
          path: tests/flow/logs/
          if-no-files-found: ignore
  flow-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      services_files: ${{ steps.set-matrix.outputs.services_files }}
      spawn_files: ${{ steps.set-matrix.outputs.spawn_files }}
      # Union of services_files + spawn_files for callers like coverage-flow
      # that don't go through docker and just need every test file.
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Generate test matrix
        id: set-matrix
        # tests/flow/test_matrix_split.py classifies each entry in
        # flow_tests_done.txt: files whose Env() invocations never pass
        # special flags (moduleArgs / useSlaves / enableDebugCommand /
        # oss-cluster / shardsCount) go to services_files (cheap shared
        # service); the rest go to spawn_files (private docker run per class).
        run: |
          python3 tests/flow/test_matrix_split.py >> $GITHUB_OUTPUT
  # Flow tests — services bucket. Files whose Env() invocations never pass
  # special flags (moduleArgs / useSlaves / enableDebugCommand / oss-cluster /
  # shardsCount) reuse a long-running GHA service container per matrix cell.
  # common.py's services mode (FALKORDB_USE_SERVICE=1) connects directly to
  # `falkordb:6379` and FLUSHALLs between Env() calls for class-level isolation.
  # No `docker run` per class → no docker socket mount needed for the test
  # itself; the on-failure capture step still uses the socket to dump service
  # logs, so we mount it for that.
  test-flow-services:
    name: ${{ matrix.sanitizer && 'asan-flow-svc' || 'flow-svc' }} ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    needs:
      - check-files
      - docker
      - flow-test-matrix
      - build-rc-image
      - build-rc-asan-image
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.flow-test-matrix.result == 'success' && needs.build-rc-image.result == 'success' && needs.build-rc-asan-image.result == 'success' }}
    permissions:
      contents: read
      packages: read
    services:
      falkordb:
        image: ${{ matrix.sanitizer && format('ghcr.io/falkordb/falkordb:rc-pr-{0}-asan', github.event.pull_request.number) || format('ghcr.io/falkordb/falkordb-server:rc-pr-{0}', github.event.pull_request.number) }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          # Empty FALKORDB_ARGS overrides the image's compiled-in default
          # (MAX_QUEUED_QUERIES 25 ...) so the service starts with the
          # module's true zero-config defaults; tests that need specific
          # config bring it via GRAPH.CONFIG SET.
          FALKORDB_ARGS: ""
          # enableDebugCommand=True is no longer a spawn trigger — files
          # routed to services can use DEBUG RELOAD / DEBUG SLEEP because
          # the shared service starts with --enable-debug-command yes.
          REDIS_ARGS: "--enable-debug-command yes"
      # Second service container reachable as `replica:6379` on the docker
      # network the runner manages. Tests with Env(useSlaves=True) reach
      # it through common.py services-mode (env.replica_host/port +
      # _attach_slave). --replicaof retries until master is up, so the
      # services come up in any order.
      replica:
        image: ${{ matrix.sanitizer && format('ghcr.io/falkordb/falkordb:rc-pr-{0}-asan', github.event.pull_request.number) || format('ghcr.io/falkordb/falkordb-server:rc-pr-{0}', github.event.pull_request.number) }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          FALKORDB_ARGS: ""
          REDIS_ARGS: "--replicaof falkordb 6379 --enable-debug-command yes"
    env:
      FALKORDB_TEST_IMAGE: ${{ matrix.sanitizer && format('ghcr.io/falkordb/falkordb:rc-pr-{0}-asan', github.event.pull_request.number) || format('ghcr.io/falkordb/falkordb-server:rc-pr-{0}', github.event.pull_request.number) }}
      FALKORDB_USE_SERVICE: "1"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_REPLICA_HOST: replica
      FALKORDB_REPLICA_PORT: "6379"
      SANITIZER: ${{ matrix.sanitizer && 'address' || '' }}
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.flow-test-matrix.outputs.services_files) }}
        sanitizer: [false, true]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Flow test - ${{ matrix.test_file }} (sanitizer=${{ matrix.sanitizer }})
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          . /data/venv/bin/activate
          TEST="$TEST_FILE" FAIL_FAST=1 RELEASE=1 ./flow.sh
      - name: Capture service container logs on failure
        if: failure()
        run: |
          mkdir -p tests/flow/logs
          for cid in $(docker ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's|^/||')
            docker logs "$cid" > "tests/flow/logs/service-${name:-$cid}.log" 2>&1 || true
          done
      - name: Upload flow logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-flow-svc-logs-${{ strategy.job-index }}
          path: |
            tests/flow/logs/
          if-no-files-found: ignore

  # Flow tests — spawn bucket. Files whose Env() invocations pass at least
  # one special flag (moduleArgs / useSlaves / enableDebugCommand / oss-cluster
  # / shardsCount) need per-class load-time config or topology. common.py
  # issues `docker run` for each Env() call via the bind-mounted socket.
  test-flow-spawn:
    name: ${{ matrix.sanitizer && 'asan-flow' || 'flow' }} ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    needs:
      - check-files
      - docker
      - flow-test-matrix
      - build-rc-image
      - build-rc-asan-image
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.flow-test-matrix.result == 'success' && needs.build-rc-image.result == 'success' && needs.build-rc-asan-image.result == 'success' }}
    permissions:
      contents: read
      packages: read
    env:
      FALKORDB_TEST_IMAGE: ${{ matrix.sanitizer && format('ghcr.io/falkordb/falkordb:rc-pr-{0}-asan', github.event.pull_request.number) || format('ghcr.io/falkordb/falkordb-server:rc-pr-{0}', github.event.pull_request.number) }}
      SANITIZER: ${{ matrix.sanitizer && 'address' || '' }}
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.flow-test-matrix.outputs.spawn_files) }}
        sanitizer: [false, true]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Log into GHCR so the in-container docker CLI can pull the RC image
      # the first time Env() spawns. Subsequent spawns hit the daemon's
      # local image cache.
      - name: Login to GHCR (for in-container docker pull)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-pull RC image
        env:
          IMAGE: ${{ env.FALKORDB_TEST_IMAGE }}
        run: docker pull "$IMAGE"

      - name: Run Flow test - ${{ matrix.test_file }} (sanitizer=${{ matrix.sanitizer }})
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          . /data/venv/bin/activate
          TEST="$TEST_FILE" FAIL_FAST=1 RELEASE=1 ./flow.sh
      - name: Upload flow logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-flow-spawn-logs-${{ strategy.job-index }}
          path: |
            tests/flow/logs/
          if-no-files-found: ignore
  coverage:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "coverage"
          env-vars: "RUSTFLAGS"
      - name: Run code coverage
        run: |
          RUSTFLAGS="-C instrument-coverage" cargo build
          RUSTFLAGS="-C instrument-coverage" cargo test -p graph
          . /data/venv/bin/activate
          pytest tests/test_e2e.py tests/test_functions.py tests/test_mvcc.py tests/test_concurrency.py -vv
          TCK_DONE=tck_done.txt pytest tests/tck/test_tck.py -s
          llvm-profdata-22 merge --sparse `find . -name "*.profraw"` -o cov.profdata
          llvm-cov-22 export --format=lcov --instr-profile cov.profdata target/debug/libfalkordb.so > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  build-coverage:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: rustup default stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "coverage"
          env-vars: "RUSTFLAGS"
      - name: Build with coverage
        run: |
          RUSTFLAGS="-C instrument-coverage" cargo build
      - name: Upload coverage binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-binary
          path: target/debug/libfalkordb.so
  coverage-flow:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    needs:
      - check-files
      - docker
      - flow-test-matrix
      - build-coverage
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.flow-test-matrix.result == 'success' && needs.build-coverage.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.flow-test-matrix.outputs.test_files) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Download coverage binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-binary
          path: target/debug
      - run: chmod +x target/debug/libfalkordb.so
      - name: Run coverage - ${{ matrix.test_file }}
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          . /data/venv/bin/activate
          TEST="$TEST_FILE" FAIL_FAST=1 ./flow.sh
          llvm-profdata-22 merge --sparse `find . -name "*.profraw"` -o cov.profdata
          llvm-cov-22 export --format=lcov --instr-profile cov.profdata target/debug/libfalkordb.so > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt
      - name: Upload flow logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-flow-logs-${{ strategy.job-index }}
          path: |
            tests/flow/logs/
          if-no-files-found: ignore
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  fuzz:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: rustup default nightly
      - run: rustup component add llvm-tools-preview
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}
      - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> $GITHUB_PATH
      - run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" --version ${{ env.CARGO_FUZZ_VERSION }} cargo-fuzz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fuzzing-corpus
          path: fuzz/corpus
        continue-on-error: true
      - name: Run fuzz tests
        run: |
          cargo build --features fuzz
          . /data/venv/bin/activate
          mkdir -p fuzz/corpus/fuzz_target_runtime/
          TCK_DONE=tck_done.txt pytest tests/tck/test_tck.py -s
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz build fuzz_target_runtime
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz run fuzz_target_runtime -- -max_total_time=300
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz cmin fuzz_target_runtime
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz coverage fuzz_target_runtime
          TOOLCHAIN_LLVM_COV=$(find $(rustc --print sysroot) -name "llvm-cov" -type f | head -1)
          echo "Using llvm-cov from: $TOOLCHAIN_LLVM_COV"
          "$TOOLCHAIN_LLVM_COV" --version
          "$TOOLCHAIN_LLVM_COV" export --format=lcov --instr-profile fuzz/coverage/fuzz_target_runtime/coverage.profdata target/x86_64-unknown-linux-gnu/coverage/x86_64-unknown-linux-gnu/release/fuzz_target_runtime > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: fuzz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: fuzzing-corpus
          path: fuzz/corpus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzzing-artifacts-fuzz_target_runtime-${{ github.sha }}
          path: fuzz/artifacts
      - name: Display fuzz artifacts if they exist
        if: failure()
        run: |
          if [ -d "fuzz/artifacts" ] && [ "$(ls -A fuzz/artifacts)" ]; then
            echo "Found fuzz artifacts, displaying content:"
            find fuzz/artifacts -type f -not -path "*/\.*" | while read file; do
              echo "=== Content of $file ==="
              cat "$file" || echo "Failed to cat file (might be binary content)"
              echo ""
              echo "========================="
            done
          else                                                              
            echo "No fuzz artifacts found or directory is empty"           
          fi                                                                
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
      # Mount docker.sock so the failure-path log-capture step can dump the
      # benchmark service container's stdout (same pattern as `test` above).
      options: --volume /var/run/docker.sock:/var/run/docker.sock
    needs:
      - check-files
      - docker
      - build-rc-image
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.build-rc-image.result == 'success' }}
    permissions:
      contents: write
      packages: read
    services:
      falkordb:
        image: ghcr.io/falkordb/falkordb-server:rc-pr-${{ github.event.pull_request.number }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["6379:6379"]
    env:
      EXISTING_ENV: "1"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - name: Run benchmark against the RC image
        run: |
          . /data/venv/bin/activate
          pytest tests/test_bench.py --benchmark-json output.json -vv
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba
        with:
          name: FalkorDB Benchmark
          tool: 'pytest'
          output-file-path: output.json
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          # Don't push to gh-pages branch in the PR
          auto-push: false
      - name: Capture service container logs on failure
        if: failure()
        run: |
          mkdir -p tests/flow/logs
          # Dump every container the runner can see — GHA service containers
          # are named after their YAML key but a workflow-run prefix can show
          # up too; iterating all containers is safer than matching by name.
          for cid in $(docker ps -aq); do
            name=$(docker inspect -f '{{.Name}}' "$cid" 2>/dev/null | sed 's|^/||')
            docker logs "$cid" > "tests/flow/logs/service-${name:-$cid}.log" 2>&1 || true
          done
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-service-logs
          path: tests/flow/logs/
          if-no-files-found: ignore
