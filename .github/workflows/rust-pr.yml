name: Rust PR

on:
  # No `branches:` filter. A pull request based on another feature branch — a
  # stack — does not match a trunk filter, so stacked PRs got no engine CI at
  # all. Nothing below needs a registry write, so there is no reason to
  # withhold it from them.
  pull_request:
  # The merge queue tests the merge candidate on a branch in THIS repo, so the
  # token is the base repo's and `packages: write` is available — including for
  # a pull request from a fork, with no pull_request_target anywhere.
  merge_group:

concurrency:
  # github.ref, not the PR number: under merge_group the PR-number expression is
  # empty, so every queue entry would collapse into one group and cancel its
  # predecessor — which then reports no conclusion and hangs the queue until
  # check_response_timeout_minutes. github.ref is documented and non-empty for
  # both events: refs/pull/<N>/merge for pull_request (stable across pushes to
  # the same PR, so superseded runs still cancel) and the queue ref for
  # merge_group (unique per entry).
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a queue entry: a cancelled run reports nothing at all.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2

permissions:
  contents: read

jobs:
  check-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      file_changed: ${{ steps.check.outputs.changed }}
      # One key for every per-run tag: `pr-<N>` on a pull request (byte-identical
      # to what this workflow produced before) and `mg-<sha>` in the queue. The
      # runtime images are `rc-<ci_key>`, the toolchain is `<ci_key>`.
      ci_key: ${{ steps.key.outputs.ci_key }}
      # Resolved once, read everywhere. This expression used to be repeated at
      # eleven call sites; a missed one fails closed in the ugliest way — a PR
      # that mostly works.
      toolchain_tag: ${{ steps.toolchain.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the CI key
        id: key
        env:
          EVENT: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "merge_group" ]; then
            echo "ci_key=mg-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ci_key=pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Check if specific file changed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # Pick the right diff target for "did the toolchain change":
        #   - merge_group → the queue commit's parent is the previous trunk tip,
        #     so HEAD~1..HEAD is exactly this entry's contribution.
        #     FalkorDB/FalkorDB) or a version branch (e.g. 6.0, 7.1, set by
        #     batch-backport.yml) → diff against that base's own merge-base.
        #   - Stacked branches that ultimately land on a trunk → diff against
        #     the trunk's merge-base, so a toolchain change anywhere in the
        #     stack rebuilds the tag for this PR.
        run: |
          set -euo pipefail
          PATTERN="^(build/Dockerfile|build/libomp\.sh|build/graphblas/.*|graphblas\.sh|redisearch\.sh|deps/RediSearch|\.gitmodules|\.dockerignore|\.github/workflows/build-toolchain\.yml)$"
          if [ "$EVENT" = "merge_group" ]; then
            RANGE="HEAD~1 HEAD"
          else
            # A PR onto main or onto a version branch diffs against its own
            # base. Anything else is a stacked branch that will land on main, so
            # diff against main's merge-base — that way a toolchain change
            # anywhere in the stack still rebuilds the tag for this PR.
            if [[ "$BASE_REF" =~ ^[0-9]+\.[0-9]+$ || "$BASE_REF" == "main" ]]; then
              DIFF_TARGET="$BASE_REF"
            else
              DIFF_TARGET="main"
            fi
            git fetch --no-tags origin "$DIFF_TARGET"
            MERGE_BASE=$(git merge-base "origin/$DIFF_TARGET" "$HEAD_SHA")
            RANGE="$MERGE_BASE $HEAD_SHA"
          fi
          # Materialise the diff first. Piping straight into `grep -q` under
          # `set -o pipefail` is a trap: grep exits on the first match, git diff
          # takes SIGPIPE, and the pipeline reports 141 — so a real toolchain
          # change reads as changed=false, non-deterministically, depending on
          # whether the diff filled the pipe buffer first.
          # shellcheck disable=SC2086
          git diff --name-only $RANGE > /tmp/changed-files.txt
          if grep -qE "$PATTERN" /tmp/changed-files.txt; then
            echo "changed=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "changed=false" | tee -a "$GITHUB_OUTPUT"
          fi

      # Infrastructure changes from a fork are refused rather than handled.
      # Rationale: of the fork PRs this repo has received that target a trunk,
      # none has ever touched build/ or .github/ — so the cost is theoretical,
      # while the alternative is real. Building a fork's Dockerfile needs
      # packages: write and writes a buildcache ref shared with main's own
      # toolchain builds; silently falling back to :latest instead produces
      # errors that look nothing like their cause. Refusing says what happened.
      - name: Refuse fork changes to build or CI infrastructure
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          BLOCKED=$(grep -E "^(build/|\.github/)" /tmp/changed-files.txt || true)
          if [ -n "$BLOCKED" ]; then
            echo "::error::This pull request changes build or CI infrastructure, which is not accepted from a fork."
            echo "::error::Paths: $(echo "$BLOCKED" | tr '\n' ' ')"
            echo "::error::These run with the base repository's credentials, so they are maintainer-owned."
            echo "::error::Ask a maintainer to land the infrastructure change separately, or to take over the branch."
            exit 1
          fi

      - name: Resolve the toolchain tag
        id: toolchain
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
          CI_KEY: ${{ steps.key.outputs.ci_key }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail
          # A fork cannot publish a toolchain image, so it runs in the public
          # :latest one. The refusal above means a fork that reaches this point
          # did not change the toolchain, so :latest is also correct.
          if [ "$CHANGED" = "true" ] && [ "$IS_FORK" != "true" ]; then
            echo "tag=ghcr.io/falkordb/falkordb-build:${CI_KEY}" | tee -a "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/falkordb/falkordb-build:latest" | tee -a "$GITHUB_OUTPUT"
          fi

  # When build/Dockerfile changes, rebuild the toolchain image at a PR-scoped
  # tag (ghcr.io/falkordb/falkordb-build:pr-<N>, multi-arch). Other jobs in
  # this workflow pick up the new toolchain via the `container:` references
  # and the build-rc-image's build_image input.
  docker:
    needs: check-files
    # Forks are excluded above, so file_changed is only ever true here for a
    # branch in this repo or a merge-queue entry — both of which can push.
    if: ${{ needs.check-files.outputs.file_changed == 'true' }}
    uses: ./.github/workflows/build-toolchain.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.check-files.outputs.ci_key }}
    # build-toolchain.yml only uses the auto-injected GITHUB_TOKEN; no
    # custom secrets to forward, so we don't need `secrets: inherit`.

  # Flow-test file split, shared by the image-free tier below and by the
  # RC pipeline. One definition; both callers read the same buckets.
  flow-test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services_files: ${{ steps.set-matrix.outputs.services_files }}
      spawn_files: ${{ steps.set-matrix.outputs.spawn_files }}
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate test matrix
        id: set-matrix
        run: |
          python3 tests/flow/test_matrix_split.py >> $GITHUB_OUTPUT

  # The CI suites. One definition; the vehicle is what changes between events.
  ci-pipeline:
    needs: [check-files, docker, flow-test-matrix]
    if: >-
      ${{ !cancelled()
          && (needs.docker.result == 'success' || needs.docker.result == 'skipped')
          && needs.flow-test-matrix.result == 'success' }}
    uses: ./.github/workflows/_ci-pipeline.yml
    permissions:
      contents: read
      packages: write
    with:
      ci_key: ${{ needs.check-files.outputs.ci_key }}
      commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      build_image: ${{ needs.check-files.outputs.toolchain_tag }}
      services_files: ${{ needs.flow-test-matrix.outputs.services_files }}
      spawn_files: ${{ needs.flow-test-matrix.outputs.spawn_files }}
      test_files: ${{ needs.flow-test-matrix.outputs.test_files }}
      # The image vehicle only in the queue, and only from a branch that can
      # push. A fork pull request runs the artifact vehicle and nothing else.
      use_image: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    secrets: inherit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ${{ needs.check-files.outputs.toolchain_tag }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "clippy"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: |
          CXX=clang++-22 cargo clippy --all-targets
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ${{ needs.check-files.outputs.toolchain_tag }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "coverage"
          env-vars: "RUSTFLAGS"
      - name: Run code coverage
        run: |
          RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo build
          RUSTDOCFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo test -p graph
          # `cargo build` only produces libfalkordb.so's coverage map, which is
          # blind to code with no caller reachable from the cdylib (e.g.
          # graph/src/index/falkordb's cow_btree, not wired into the runtime
          # yet). Locate the `cargo test -p graph` unit-test binary too (cache
          # hit, same RUSTFLAGS as above, so this doesn't rebuild or re-run
          # anything) so llvm-cov can also credit coverage recorded by
          # test-only call paths, not just the shared library's. Cargo prints
          # "  Executable <target> (<path>)" to stderr for every test binary
          # it builds (one per test target; today that's just the lib's own
          # unit tests) — no jq/python needed to find it.
          TEST_OBJECTS=""
          for bin in $(RUSTFLAGS="-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition" cargo test -p graph --no-run 2>&1 | grep -w Executable | grep -oE 'target/debug/deps/[^)]+'); do
            TEST_OBJECTS="$TEST_OBJECTS -object $bin"
          done
          echo "Additional coverage objects: $TEST_OBJECTS"
          # Snapshot coverage here, before the e2e/TCK suites run below, so
          # cargo test's own profraw can be reported as its own Codecov flag
          # (unit-tests) instead of being indistinguishable from e2e coverage.
          llvm-profdata-22 merge --sparse `find . -name "*.profraw"` -o cov-unit.profdata
          llvm-cov-22 export --format=lcov --instr-profile cov-unit.profdata target/debug/libfalkordb.so $TEST_OBJECTS > codecov-unit.txt.all
          lcov --ignore-errors unused -r codecov-unit.txt.all -o codecov-unit.txt
          . /data/venv/bin/activate
          pytest tests/test_e2e.py tests/test_functions.py tests/test_mvcc.py tests/test_concurrency.py -vv
          TCK_DONE=tck_done.txt pytest tests/tck/test_tck.py -s
          llvm-profdata-22 merge --sparse `find . -name "*.profraw"` -o cov.profdata
          llvm-cov-22 export --format=lcov --instr-profile cov.profdata target/debug/libfalkordb.so $TEST_OBJECTS > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt
      - name: Upload unit test coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./codecov-unit.txt
          flags: unit-tests
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e-tck
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ${{ needs.check-files.outputs.toolchain_tag }}
    needs:
      - check-files
      - docker
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup default nightly
      - run: rustup component add llvm-tools-preview
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ runner.tool_cache }}/cargo-fuzz
          key: cargo-fuzz-bin-${{ env.CARGO_FUZZ_VERSION }}
      - run: echo "${{ runner.tool_cache }}/cargo-fuzz/bin" >> $GITHUB_PATH
      - run: cargo install --root "${{ runner.tool_cache }}/cargo-fuzz" --version ${{ env.CARGO_FUZZ_VERSION }} cargo-fuzz
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fuzzing-corpus
          path: fuzz/corpus
        continue-on-error: true
      - name: Run fuzz tests
        run: |
          cargo build --features fuzz
          . /data/venv/bin/activate
          mkdir -p fuzz/corpus/fuzz_target_runtime/
          TCK_DONE=tck_done.txt pytest tests/tck/test_tck.py -s
          # cargo-fuzz sets its own RUSTFLAGS (sanitizer), which replaces the
          # .cargo/config.toml flags; repeat the duplicate-symbol allowance so
          # the embedded libredisearch_rs.a (its own std) links. cargo-fuzz
          # appends to an existing RUSTFLAGS env.
          export RUSTFLAGS="-C link-arg=-Wl,--allow-multiple-definition"
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz build fuzz_target_runtime
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz run fuzz_target_runtime -- -max_total_time=300
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz cmin fuzz_target_runtime
          CXX=clang++-22 CARGO_PROFILE_RELEASE_LTO=false cargo fuzz coverage fuzz_target_runtime
          TOOLCHAIN_LLVM_COV=$(find $(rustc --print sysroot) -name "llvm-cov" -type f | head -1)
          echo "Using llvm-cov from: $TOOLCHAIN_LLVM_COV"
          "$TOOLCHAIN_LLVM_COV" --version
          "$TOOLCHAIN_LLVM_COV" export --format=lcov --instr-profile fuzz/coverage/fuzz_target_runtime/coverage.profdata target/x86_64-unknown-linux-gnu/coverage/x86_64-unknown-linux-gnu/release/fuzz_target_runtime > codecov.txt.all
          lcov --ignore-errors unused -r codecov.txt.all -o codecov.txt

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: fuzz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: fuzzing-corpus
          path: fuzz/corpus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzzing-artifacts-fuzz_target_runtime-${{ github.sha }}
          path: fuzz/artifacts
      - name: Display fuzz artifacts if they exist
        if: failure()
        run: |
          if [ -d "fuzz/artifacts" ] && [ "$(ls -A fuzz/artifacts)" ]; then
            echo "Found fuzz artifacts, displaying content:"
            find fuzz/artifacts -type f -not -path "*/\.*" | while read file; do
              echo "=== Content of $file ==="
              cat "$file" || echo "Failed to cat file (might be binary content)"
              echo ""
              echo "========================="
            done
          else                                                              
            echo "No fuzz artifacts found or directory is empty"           
          fi                                                                

  # ── Image-free tier ────────────────────────────────────────────────────
  # Everything below builds libfalkordb.so in the toolchain container, ships
  # it as a job artifact, and tests against it. No image is built and nothing
  # is pushed to a registry, so these run on a read-only GITHUB_TOKEN — which
  # is what a pull_request from a fork gets. Shapes lifted from rust-push.yml.

  ci-gate:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - check-files
      - docker
      - flow-test-matrix
      - ci-pipeline
      - lint
      - coverage
      - fuzz
    steps:
      - name: Assert no dependency failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq .
          echo "$RESULTS" | jq -e 'to_entries
            | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
