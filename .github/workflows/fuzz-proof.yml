# TEMPORARY: perf-fuzz-scenario's proof evidence for PR #4007, removed before the PR is
# marked ready. Runs the fuzz check (`soak-fuzz`) through _perf-vm.yml (perf-gce-runner's
# branch until it is on main, #3979): main@4c1088949 against itself, nightly mode, one VM.
# The leg's VM-workflow check name differs only so its artifact is told apart; the
# result.json says check "fuzz".
#
# The leg runs only for a push that itself changes the "Proof of:" line below (the
# `gate` job diffs the push's before and after). A `paths` filter cannot do it: for
# pull_request it is matched against the whole PR's diff, which contains this file, and
# `workflow_dispatch` works only for a file on the default branch. To prove a new
# commit, change that line deliberately, after telling the coordinator.
# Proof of: main A/A through _perf-vm.yml, round 1.

name: TEMPORARY fuzz proof

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: fuzz-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # No pipe into grep -q: with the default pipefail an early exit of
          # grep would make a match read as no match.
          run=false
          if [[ -n $BEFORE ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff -U0 "$BEFORE" "$AFTER" -- .github/workflows/fuzz-proof.yml > proof.diff
            if grep -q '^+# Proof of:' proof.diff; then run=true; fi
          fi
          echo "before=${BEFORE:-none} after=$AFTER run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  proof:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - check: fuzz-aa-main
            candidate: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
            candidate_label: main@4c1088949
            candidate_commit: 4c1088949a5852e3949c05bfb3d92a603c4cd4ca
            baseline: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
            baseline_label: main@4c1088949
            baseline_commit: 4c1088949a5852e3949c05bfb3d92a603c4cd4ca
    uses: FalkorDB/FalkorDB/.github/workflows/_perf-vm.yml@ci/perf-vm
    with:
      check: ${{ matrix.check }}
      command: uv run --project tests/soak/fuzz soak-fuzz
      candidate_image: ${{ matrix.candidate }}
      baseline_image: ${{ matrix.baseline }}
      candidate_label: ${{ matrix.candidate_label }}
      baseline_label: ${{ matrix.baseline_label }}
      candidate_commit: ${{ matrix.candidate_commit }}
      baseline_commit: ${{ matrix.baseline_commit }}
      mode: nightly
      timeout_minutes: 90
      machine_type: n4-standard-16
    secrets: inherit
