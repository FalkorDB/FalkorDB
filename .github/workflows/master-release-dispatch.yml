# Keep the C engine's STABLE releases publishing after the default branch moved
# here.
#
# `release` is delivered ONLY from the repository's default branch. Now that the
# Rust tree is the default branch, master's release-image.yml / release-ramp.yml
# / browser-tests-trigger.yml never see a published release again — silently. A
# branch filter on master cannot fix it: GitHub reads the workflow from the
# default branch, so the compensation has to live here. This workflow drives
# master's existing `workflow_dispatch` entry points; none of C's release logic
# is rewritten.
#
# SCOPE: stable releases only. The rolling `edge` channel used to arrive here too
# (via `workflow_run` on Build), but master's own build.yml now hands off to
# release-image.yml directly after a successful build. That keeps C's edge
# channel inside C's own tree, removes a cross-branch dependency on the busiest
# path, and leaves this workflow responsible only for the one event that cannot
# be heard from a non-default branch.
#
# ⚠️ `release` is REPO-WIDE and VERSION-BLIND — it fires here for the Rust
# engine's releases as well as C's. The major-version gate in the derive step
# below is what keeps a Rust release from being published out of C's pipeline.
#
# GITHUB_TOKEN is sufficient: per GitHub's docs `workflow_dispatch` and
# `repository_dispatch` are the explicit exceptions that "always create workflow
# runs" even when triggered by GITHUB_TOKEN. No PAT needed.
#
# See issue #2255.

name: master release dispatch

on:
  # `release` is the ONLY event here that structurally has to be compensated from
  # the default branch: nothing on `master` can hear it once master stops being
  # default. The rolling `edge` channel deliberately does NOT go through this
  # workflow — master's own build.yml hands off to release-image.yml directly
  # after a successful build, keeping C's edge channel inside C's own tree with
  # no cross-branch dependency (see the master-side change of #2255).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish on master (e.g. edge, v5.2.0)"
        required: true
      commit_sha:
        description: "Commit SHA on master to publish"
        required: true
      notify_downstream:
        description: "Also trigger FalkorDB Cloud + testflight (release semantics)"
        type: boolean
        default: false
      mark_latest:
        description: "Also move the :latest tags (release semantics)"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: master-release-dispatch-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  dispatch:
    # Only meaningful where a `master` branch exists. Guards against this file
    # being merged into a repo without one.
    if: ${{ github.repository == 'FalkorDB/FalkorDB' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.derive.outputs.skip }}
    steps:
      - name: Derive tag, commit and downstream policy
        id: derive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REL_TAG: ${{ github.event.release.tag_name }}
          REL_TARGET: ${{ github.event.release.target_commitish }}
          IN_TAG: ${{ inputs.tag }}
          IN_SHA: ${{ inputs.commit_sha }}
          IN_NOTIFY: ${{ inputs.notify_downstream }}
          IN_LATEST: ${{ inputs.mark_latest }}
        run: |
          set -euo pipefail

          SKIP=false
          # Should the :latest tags move? Only a real release should.
          # release-image.yml sets IS_LATEST=1 for the `release` event ONLY, so a
          # dispatched run publishes the version tags but leaves :latest frozen —
          # hence the explicit mark_latest input.
          # NOTE: C sets it for ANY release, so a 4.18 patch moves :latest even
          # when 4.20 is newer. Reproduced as-is rather than "fixed" here.
          LATEST=false
          # Which ref release-image/release-ramp are dispatched on. Their copies
          # on the version branches already expose workflow_dispatch, so a
          # release can be published by its own release line's pipeline.
          REF="master"

          case "$EVENT" in
            release)
              TAG="$REL_TAG"
              # `release` is a REPO-WIDE, version-blind event, and after the
              # migration it is delivered from THIS (default) branch for every
              # release — including the Rust engine's. Route by major version:
              # the C engine owns <= 5.x, the Rust engine >= 6.0 and publishes
              # itself via release-tag.yml. Without this gate a Rust release
              # would be dispatched into C's pipeline and published from C
              # source under a 6.x version number.
              MAJOR="$(printf '%s' "${TAG#v}" | cut -d. -f1)"
              if ! printf '%s' "$MAJOR" | grep -qE '^[0-9]+$'; then
                echo "::error::release tag '${TAG}' has no numeric major version"
                exit 1
              fi
              if [ "$MAJOR" -ge 6 ]; then
                echo "::notice::release ${TAG} is a Rust-engine release (major ${MAJOR} >= 6); the Rust pipeline owns it, not C's — skipping"
                SKIP=true
              fi
              # github.sha here is the DEFAULT branch's SHA, not the release
              # commit, so resolve the tag explicitly.
              SHA=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha')
              # Releases are cut from version branches (verified: v4.20.1 ->
              # "4.20", v4.18.11 -> "4.18"), so publish from that release line's
              # own pipeline. target_commitish can also be a SHA, which is not a
              # valid dispatch ref — fall back to master when it is not a branch.
              if [ -n "$REL_TARGET" ] && \
                 gh api "repos/${GH_REPO}/branches/${REL_TARGET}" --jq .name >/dev/null 2>&1; then
                REF="$REL_TARGET"
              else
                echo "::notice::release target '${REL_TARGET:-}' is not a branch; dispatching on master"
              fi
              # Matches today's `release` behaviour: both downstream jobs run and
              # :latest moves.
              NOTIFY=true
              LATEST=true
              ;;
            workflow_dispatch)
              TAG="$IN_TAG"
              SHA="$IN_SHA"
              NOTIFY="${IN_NOTIFY:-false}"
              LATEST="${IN_LATEST:-false}"
              ;;
            *)
              echo "::error::unsupported event $EVENT"; exit 1 ;;
          esac

          if [ -z "${TAG:-}" ] || [ -z "${SHA:-}" ]; then
            echo "::error::could not derive tag ('${TAG:-}') and commit ('${SHA:-}')"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "notify=$NOTIFY"
            echo "latest=$LATEST"
            echo "ref=$REF"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG sha=$SHA notify=$NOTIFY latest=$LATEST ref=$REF skip=$SKIP (event=$EVENT)"

      - name: Dispatch release-image.yml
        if: ${{ steps.derive.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.derive.outputs.tag }}
          SHA: ${{ steps.derive.outputs.sha }}
          NOTIFY: ${{ steps.derive.outputs.notify }}
          LATEST: ${{ steps.derive.outputs.latest }}
          REF: ${{ steps.derive.outputs.ref }}
        run: |
          set -euo pipefail
          # mark_latest carries the release semantics that the `release` event
          # used to imply on its own: release-image.yml sets IS_LATEST=1 only for
          # that event, so a dispatch would publish the version tags but leave
          # :latest frozen. Requires the mark_latest input added in the master-side
          # change of #2255 — branches cut before it (4.18, 4.20) need that
          # backported before a release can be dispatched on their ref.
          gh workflow run release-image.yml --ref "$REF" \
            -f tag="$TAG" \
            -f commit_sha="$SHA" \
            -f run_falkordb_cloud_update="$NOTIFY" \
            -f run_testflight_workflow="$NOTIFY" \
            -f mark_latest="$LATEST"
          echo "dispatched release-image.yml on $REF (tag=$TAG notify=$NOTIFY latest=$LATEST)"

      # RAMP packaging only ever applied to v-prefixed version branches, and its
      # own job condition requires a v-prefixed tag. Keep that shape.
      - name: Dispatch release-ramp.yml
        if: ${{ steps.derive.outputs.skip != 'true' && startsWith(steps.derive.outputs.tag, 'v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.derive.outputs.tag }}
          SHA: ${{ steps.derive.outputs.sha }}
          REF: ${{ steps.derive.outputs.ref }}
        run: |
          set -euo pipefail
          gh workflow run release-ramp.yml --ref "$REF" \
            -f tag="$TAG" -f commit_sha="$SHA"
          echo "dispatched release-ramp.yml on $REF (tag=$TAG)"

      # Only on a real release, matching its `release:`-only trigger today.
      # NOTE: master's browser-tests-trigger.yml reads
      # github.event.release.tag_name, which is empty under workflow_dispatch.
      # Today that job only echoes the tag, so the sole effect is a blank line in
      # its log. If it grows real behaviour it needs a `tag` input on master.
      - name: Dispatch browser-tests-trigger.yml (on master)
        if: ${{ steps.derive.outputs.skip != 'true' && github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run browser-tests-trigger.yml --ref master
          echo "dispatched browser-tests-trigger.yml"
