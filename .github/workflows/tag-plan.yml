name: Tag plan

# Tests build/publish_tags.py, whose tests pin the tags every publish pushes,
# and rehearses its --execute path against local registries, without pushing
# anything to GHCR or Docker Hub.
#
# Runs on pull requests that change the script or a workflow that publishes
# with it, and on demand.

on:
  pull_request:
    paths:
      - build/publish_tags.py
      - build/test_publish_tags.py
      - .github/workflows/_build-artifacts.yml
      - .github/workflows/release-image.yml
      - .github/workflows/release-tag.yml
      - .github/workflows/rust-push.yml
      - .github/workflows/tag-plan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the tag plan
        run: python3 build/test_publish_tags.py

  # Runs the real --execute path, as rust-push.yml and release-tag.yml would,
  # against two local registries standing in for GHCR and Docker Hub: podman,
  # skopeo and imagetools as this runner ships them, and archives from buildx's
  # type=docker exporter, the format _build-artifacts.yml writes. The images
  # are alpine plus the server label, built without a RUN step.
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      ghcr:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
      hub:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5001:5000"]
    env:
      PUBLISH_TAGS_REHEARSAL_REGISTRIES: localhost:5000/falkordb localhost:5001/falkordb
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Let podman reach the local registries over HTTP
        run: |
          sudo mkdir -p /etc/containers/registries.conf.d
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' \
            | sudo tee /etc/containers/registries.conf.d/rehearsal.conf

      - name: Build per-OS archives and the queue's images
        run: |
          set -euo pipefail
          # $SERVER is the Dockerfile's ARG, written literally.
          # shellcheck disable=SC2016
          printf '%s\n' 'FROM alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc' \
            'ARG SERVER' 'LABEL com.falkordb.server.name=$SERVER' > "$RUNNER_TEMP/Dockerfile"
          # One directory per build cell, as release-tag.yml downloads them.
          for image in alpine:valkey amazonlinux2023:valkey rhel9:redis amazonlinux2023:redis; do
            os=${image%%:*}; server=${image#*:}
            for arch in x64 arm64v8; do
              case "$arch" in x64) platform=linux/amd64 ;; arm64v8) platform=linux/arm64 ;; esac
              dir="$RUNNER_TEMP/images/image-falkordb-server-${os}-${arch}"
              mkdir -p "$dir"
              docker buildx build "$RUNNER_TEMP" --file "$RUNNER_TEMP/Dockerfile" \
                --platform "$platform" --provenance=false --build-arg "SERVER=${server}" \
                --tag "falkordb-server:${os}-${server}-${arch}" \
                --output "type=docker,dest=${dir}/falkordb-server-${os}-${server}-${arch}.tar"
            done
          done
          # Stand-ins for the merge queue's rc-mg-<sha>-<server> indexes.
          for repo in falkordb falkordb-server; do
            for server in valkey redis; do
              podman manifest create "localhost/seed-${repo}-${server}"
              for arch in x64 arm64v8; do
                podman manifest add "localhost/seed-${repo}-${server}" \
                  "docker-archive:$RUNNER_TEMP/images/image-falkordb-server-amazonlinux2023-${arch}/falkordb-server-amazonlinux2023-${server}-${arch}.tar"
              done
              podman manifest push --all --format oci "localhost/seed-${repo}-${server}" \
                "docker://localhost:5000/falkordb/${repo}:rc-mg-${SHA}-${server}"
            done
          done

      - name: Rehearse a release (release-tag.yml's image and publish-images jobs)
        run: |
          set -euo pipefail
          # publish_tags.py reads the GitHub releases through gh. A shim
          # answers with a fixed list in which 6.1.0 is the highest published
          # release, so the latest*-moving path runs every time and the live
          # repository's releases (or a gh outage) can't change the outcome.
          mkdir -p "$RUNNER_TEMP/shim"
          printf '%s\n' '#!/bin/sh' \
            "echo '{\"tag_name\":\"v6.0.4\",\"draft\":false,\"prerelease\":false}'" \
            "echo '{\"tag_name\":\"v6.1.0\",\"draft\":false,\"prerelease\":false}'" > "$RUNNER_TEMP/shim/gh"
          chmod +x "$RUNNER_TEMP/shim/gh"
          export PATH="$RUNNER_TEMP/shim:$PATH"
          python3 build/publish_tags.py release --version 6.1.0 --sha "$SHA" --execute
          python3 build/publish_tags.py per-os --version 6.1.0 --images "$RUNNER_TEMP/images" --execute

      - name: Rehearse an edge promotion (rust-push.yml's promote-edge job)
        run: python3 build/publish_tags.py edge --sha "$SHA" --execute
