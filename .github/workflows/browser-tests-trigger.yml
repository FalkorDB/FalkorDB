name: browser tests trigger on new tag release

on:
  release:
    types: [published]
  # `release` is delivered only from the repository's DEFAULT branch. Once the
  # default branch moves to `main` (Rust engine), a release cut from `master`
  # will no longer fire this workflow. `workflow_dispatch` lets a release
  # listener on the default branch re-fire it against `master`
  # (`gh workflow run browser-tests-trigger.yml --ref master`). See issue #2255.
  workflow_dispatch:

jobs:
  post-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Print Tag
        run: |
          echo "Release published!"
          echo "Latest release tag: ${{ github.event.release.tag_name }}"