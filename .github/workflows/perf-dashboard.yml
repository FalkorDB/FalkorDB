# The perf dashboard (#4005), built after each nightly, never part of it.
#
# perf-nightly.yml is a reusable workflow (the release gate calls it with read-only
# permissions), so it cannot hold a job that writes. This workflow runs when a nightly
# completes: it stores that run's files at data/<date>-<run id>/ on the gh-pages branch
# with `bench nightly store` (nightly.json, run.json, and per check its result.json, the
# runner's record and the files the check lists as artifacts; perf-comment.yml lays out a
# /perf run with the same command), rebuilds the site from every stored run with
# `bench nightly dashboard`, and deploys it with the Pages actions. A GITHUB_TOKEN push
# does not start a Pages build, so the deploy is explicit; the repository's
# Settings -> Pages -> Source is "GitHub Actions". The gh-pages branch is the archive.
#
# Only the runs that report to Chat are stored: a scheduled night, or a dispatch that
# named no image of its own (perf-plan's dispatch.json). A gate call, which runs as the
# caller's event, never triggers this workflow. It runs from the default branch.
# Nothing here can change a night's verdict: the night has finished.

name: Perf dashboard

on:
  workflow_run:
    workflows: ["Perf nightly"]
    types: [completed]

permissions: {}

# One publish at a time, repository-wide, so two pushes never race. GitHub keeps one
# waiting; a third cancels it (re-running that run's night stores it later).
concurrency:
  group: perf-dashboard
  cancel-in-progress: false

jobs:
  publish:
    # The night's own result is not the dashboard's business: a red night is stored too.
    # A run that never produced nightly.json (cancelled early) fails the download below.
    if: >-
      ${{ (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
      && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # Push to the gh-pages branch.
      contents: write
      # The triggering run's artifacts.
      actions: read
      # Deploy the site.
      pages: write
      id-token: write
    env:
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The default branch's bench code, with the full history so a red night's page lists
      # the commits since the last green one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.29"

      - name: Download the night's artifacts
        id: download
        run: |
          set -euo pipefail
          run=$RUNNER_TEMP/run
          mkdir -p "$run"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$run" --name perf-plan --name perf-nightly
          # A dispatch is stored only when its dispatch.json says, as the boolean false, that
          # it named no image. A missing or unreadable record (an older branch's run, a run
          # whose upload failed) is no such statement: not stored.
          if [[ $RUN_EVENT == workflow_dispatch ]] \
              && ! jq -e '.image_overrides == false' "$run/perf-plan/dispatch.json" > /dev/null 2>&1; then
            echo "run $RUN_ID did not record that it used no image overrides: not stored"
            echo "store=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "store=true" >> "$GITHUB_OUTPUT"

      - name: Store the run on gh-pages and rebuild the dashboard
        if: steps.download.outputs.store == 'true'
        env:
          TRIGGER: ${{ github.event.workflow_run.event == 'schedule' && 'nightly' || 'manual' }}
        run: |
          set -Eeuo pipefail
          night=$RUNNER_TEMP/run/perf-nightly/nightly.json

          site=$RUNNER_TEMP/site
          remote=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git init -q "$site"
          cd "$site"
          if git -c http.extraheader="$auth" fetch -q --depth=1 "$remote" gh-pages; then
            git checkout -q -B gh-pages FETCH_HEAD
          else
            # The first run starts the branch. Any other fetch failure ends at the push
            # below: it is never forced, so it cannot replace a branch it did not see.
            git checkout -q --orphan gh-pages
          fi

          # Every perf-result-<check> the run left, laid out at data/<date>-<run id>/. A re-run
          # of the night replaces what its first attempt stored, but never with a check missing
          # that the stored run has (the command exits 1 and nothing is pushed).
          folder=$(cd "$GITHUB_WORKSPACE" && uv run --project bench --frozen bench nightly store \
            --nightly "$night" --run-id "$RUN_ID" --data "$site/data" --trigger "$TRIGGER" --scope main)
          dest=data/$folder
          (cd "$GITHUB_WORKSPACE" && uv run --project bench --frozen bench nightly dashboard --data "$site/data" --out "$site")
          git add -A
          # A re-run of this workflow stores the same files: nothing to commit.
          git diff --cached --quiet || git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "perf run $folder ($TRIGGER)"
          git -c http.extraheader="$auth" push -q "$remote" HEAD:gh-pages
          echo "stored $dest on gh-pages"
          # Only the site goes to Pages, not the archive's git metadata.
          mkdir -p "$RUNNER_TEMP/pages"
          cp -R "$site/." "$RUNNER_TEMP/pages/"
          rm -rf "$RUNNER_TEMP/pages/.git"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.download.outputs.store == 'true'
        with:
          path: ${{ runner.temp }}/pages

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        if: steps.download.outputs.store == 'true'
