# CodeQL for the C engine (this branch).
#
# Runs with build-mode: none (extraction without compiling) instead of the
# `make build` + self-hosted GCE runner this workflow used prior to CodeQL
# scanning C/C++ without a build going GA (see
# https://github.blog/changelog/2025-10-14-codeql-scanning-rust-and-c-c-without-builds-is-now-generally-available/).
# The runner existed only to give `make build` enough CPU/RAM, and its
# `n4-highcpu-8` machine type is prone to zonal stockouts
# (ZONE_RESOURCE_POOL_EXHAUSTED_WITH_DETAILS) that failed this job outright
# with no code issue involved. All of FalkorDB's own sources plus its bundled
# deps (vendored directly, e.g. deps/GraphBLAS, or via git submodule) are
# already present after checkout, so no compiled build is needed to extract
# them. See .github/codeql/codeql-config.yml for the one thing that *did*
# depend on a build: the GraphBLAS PreJIT kernels are compiled from a
# prebuilt cache rather than generated fresh, so they were already visible to
# CodeQL and already needed excluding.
name: "CodeQL"

on:
  push:
    branches:
      - master
      - "[0-9]+.[0-9]+"
  pull_request:
    # The branches below must be a subset of the branches above
    branches:
      - master
      - "[0-9]+.[0-9]+"
  schedule:
    - cron: "33 5 * * 1"
  # `schedule` is delivered only from the repository's DEFAULT branch. Once the
  # default branch moves to `main` (Rust engine) this cron stops firing from
  # `master`, and no branch filter here can change that — GitHub reads the
  # scheduled workflow from the default branch. `workflow_dispatch` lets a
  # scheduled dispatcher on the default branch re-fire this scan against
  # `master` (`gh workflow run codeql-analysis.yml --ref master`), so the weekly
  # analysis survives the migration. See issue #2255.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true
      - run: |
          git config --global --add safe.directory '*'
          git submodule update --init --recursive

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
