# TEMPORARY: perf-ldbc's proof evidence for PR #2559, removed before the PR is
# marked ready. Runs `bench ldbc check` through _perf-vm.yml (perf-gce-runner's
# branch until it is on main, #3979) on the proof pairs, one VM at a time.
# Each leg's VM-workflow check name differs only so the three artifacts do not
# collide; every result.json says check "ldbc".
#
# The legs run only for a push that itself changes the "Proof of:" line
# below (the `gate` job diffs the push's before and after). A `paths` filter
# cannot do it: for pull_request it is matched against the whole PR's diff,
# which contains this file, and `workflow_dispatch` works only for a file on
# the default branch. To prove a new commit, change that line deliberately,
# after telling the coordinator.
# Proof of: review round 4.

name: TEMPORARY ldbc proof

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ldbc-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # No pipe into grep -q: with the default pipefail an early exit of
          # grep would make a match read as no match.
          run=false
          if [[ -n $BEFORE ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff -U0 "$BEFORE" "$AFTER" -- .github/workflows/ldbc-proof.yml > proof.diff
            if grep -q '^+# Proof of:' proof.diff; then run=true; fi
          fi
          echo "before=${BEFORE:-none} after=$AFTER run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  proof:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - check: ldbc-aa-main
            candidate: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
            candidate_label: main@4c1088949
            candidate_commit: 4c1088949a5852e3949c05bfb3d92a603c4cd4ca
            baseline: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
            baseline_label: main@4c1088949
            baseline_commit: 4c1088949a5852e3949c05bfb3d92a603c4cd4ca
          - check: ldbc-aa-c
            candidate: falkordb/falkordb-server@sha256:4e651dac5dbabf3169d91af06db4be13ee7679ffc392f14bac5fa730349b5dbf
            candidate_label: C v4.22.4
            candidate_commit: 958fbead7d6e08d50d48d4776f0f310ea1dfb9a4
            baseline: falkordb/falkordb-server@sha256:4e651dac5dbabf3169d91af06db4be13ee7679ffc392f14bac5fa730349b5dbf
            baseline_label: C v4.22.4
            baseline_commit: 958fbead7d6e08d50d48d4776f0f310ea1dfb9a4
          - check: ldbc-604-vs-620
            candidate: falkordb/falkordb-server@sha256:698a6e748b42699c1f63af01f8902652b764582e363731de56c7d566c322c209
            candidate_label: "6.0.4"
            candidate_commit: 6ca3adc9d0418f76c5a15f820552e0603a65e553
            baseline: falkordb/falkordb-server@sha256:44eb4a6d48ef6f2b06aeefea46c5f4c17cd2310d3832135be18fd7fc8ba30923
            baseline_label: "6.2.0"
            baseline_commit: d8c329b777c177fc7343d959157d6acdf7398fa5
    uses: FalkorDB/FalkorDB/.github/workflows/_perf-vm.yml@ci/perf-vm
    with:
      check: ${{ matrix.check }}
      command: uv run --project bench bench ldbc check
      candidate_image: ${{ matrix.candidate }}
      baseline_image: ${{ matrix.baseline }}
      candidate_label: ${{ matrix.candidate_label }}
      baseline_label: ${{ matrix.baseline_label }}
      candidate_commit: ${{ matrix.candidate_commit }}
      baseline_commit: ${{ matrix.baseline_commit }}
      mode: nightly
      timeout_minutes: 45
      machine_type: n4-standard-16
    secrets: inherit
