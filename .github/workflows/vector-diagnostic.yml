# One-shot vector-index diagnostic. Runs the REAL FalkorDB/benchmark tool's
# fixture-dependent load ON THE GCE hardware (n4 / Intel AVX-512 and c4a / Axion
# SVE2) against the C `edge` and Rust `edge-rs` images, and — while the tool's
# pooled readiness check runs — polls a FRESH single connection's vector KNN
# probe every few seconds.
#
# The whole point: the exact fixture passes via redis-cli AND via the real tool
# on macOS, but the tool fails only on GCE against `edge`. This isolates the last
# question: while the tool's pooled connection reports vector_hits=0, does a
# fresh connection see the vectors?
#   fresh probe > 0  → vectors ARE ingested; the tool's connection can't see them
#                      → a C-engine cross-connection visibility issue.
#   fresh probe = 0  → vectors never became searchable → async ingestion failure.
#
# Trigger: add the `vecdiag` label to a PR (same-repo branches only), or run
# manually once this is on the default branch.
name: Vector index diagnostic (GCE)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      arches:
        description: "Which arches to test"
        required: false
        default: "both"
        type: choice
        options: ["both", "x86", "arm"]

permissions:
  contents: read

concurrency:
  group: vecdiag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  BENCHMARK_REPO: FalkorDB/benchmark
  BENCHMARK_REF: deca7752cbd8cdeb333493569472ede385d5b5db # v2.2

jobs:
  setup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'vecdiag' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.d.outputs.arches }}
    steps:
      - id: d
        env:
          SEL: ${{ github.event.inputs.arches }}
        run: |
          set -euo pipefail
          case "${SEL:-both}" in
            x86) echo 'arches=["x86"]' >> "$GITHUB_OUTPUT" ;;
            arm) echo 'arches=["arm"]' >> "$GITHUB_OUTPUT" ;;
            *)   echo 'arches=["x86","arm"]' >> "$GITHUB_OUTPUT" ;;
          esac

  create-runners:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create GCE runner (${{ matrix.arch }})
        uses: ./.github/actions/create-runner
        with:
          token: ${{ secrets.GH_SA_TOKEN }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          machine_zones: ${{ matrix.arch == 'arm' && (vars.GCP_ZONES_ARM || vars.GCP_ZONES) || vars.GCP_ZONES }}
          machine_type: ${{ matrix.arch == 'arm' && (vars.BENCHMARK_MACHINE_TYPE_ARM || 'c4a-highcpu-16') || (vars.BENCHMARK_MACHINE_TYPE || 'n4-highcpu-16') }}
          arm: ${{ matrix.arch == 'arm' }}
          image_family: ${{ matrix.arch == 'arm' && (vars.BENCHMARK_IMAGE_FAMILY_ARM || 'debian-12-arm64') || '' }}
          image_project: ${{ matrix.arch == 'arm' && (vars.BENCHMARK_IMAGE_PROJECT_ARM || 'debian-cloud') || '' }}
          network: gh-runner
          runner_label: vecdiag-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.arch }}

  diagnose:
    needs: [setup, create-runners]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: vecdiag-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.arch }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HOME: /root
    steps:
      - name: Install toolchain deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config libssl-dev protobuf-compiler
      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Checkout FalkorDB/benchmark@${{ env.BENCHMARK_REF }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark-tool
          persist-credentials: false
      - name: Build tool + run REAL fixture load, poll fresh-conn probe (${{ matrix.arch }})
        run: |
          # No set -e: keep going through diagnostics even on a query error.
          set -uo pipefail
          ARCH="${{ matrix.arch }}"
          echo "::group::Host CPU (arch=$ARCH)"
          uname -m; echo "nproc=$(nproc)"
          grep -m1 -Ei '^flags|^Features' /proc/cpuinfo | tr ' ' '\n' \
            | grep -iE 'avx512|^sve$|sve2|asimd' | sort -u | tr '\n' ' '; echo
          echo "::endgroup::"

          echo "::group::Build benchmark tool"
          cd "$GITHUB_WORKSPACE/benchmark-tool"
          grep -q '^\[workspace\]' Cargo.toml || printf '\n[workspace]\n' >> Cargo.toml
          cargo build --release --bin benchmark
          echo "::endgroup::"

          # Bisect run-variant.sh's knobs against the C `edge` image: run the real
          # fixture-dependent load under different container/env configs, each on
          # a fresh container, polling a FRESH connection's vector probe each 5s.
          #   XFLAGS = extra `docker run` flags; TMO = FALKOR_QUERY_TIMEOUT_MS
          #   (empty => unset); CFG=1 => run-variant.sh's CONFIG SET + wipe.
          IMG="docker.io/falkordb/falkordb-server:edge"
          docker pull "$IMG" >/dev/null 2>&1 || docker pull "$IMG"
          NPROC=$(nproc)
          run_config() {
            DESC="$1"; XFLAGS="$2"; TMO="$3"; CFG="$4"
            NAME="vc-$(echo "$DESC" | tr ' /:.' '_____')"; PORT=16399
            echo "::group::### CONFIG [$DESC]  docker='$XFLAGS'  FALKOR_QUERY_TIMEOUT_MS='${TMO:-unset}'  cfg=$CFG"
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            # shellcheck disable=SC2086
            docker run -d --name "$NAME" $XFLAGS -p "${PORT}:6379" "$IMG" >/dev/null
            for _ in $(seq 1 40); do docker exec "$NAME" redis-cli PING 2>/dev/null | grep -q PONG && break; sleep 1; done
            if [ "$CFG" = 1 ]; then
              docker exec "$NAME" redis-cli CONFIG SET save "" >/dev/null 2>&1 || true
              docker exec "$NAME" redis-cli CONFIG SET stop-writes-on-bgsave-error no >/dev/null 2>&1 || true
              docker exec "$NAME" redis-cli GRAPH.DELETE falkor >/dev/null 2>&1 || true
              docker exec "$NAME" redis-cli DEL falkor >/dev/null 2>&1 || true
            fi
            ( for i in $(seq 1 60); do
                p=$(docker exec "$NAME" redis-cli GRAPH.QUERY falkor "CALL db.idx.vector.queryNodes('User','embedding',1, vecf32([0.1,0.2,0.3])) YIELD node RETURN count(node)" 2>/dev/null | grep -oE '\(integer\) [0-9]+' | grep -oE '[0-9]+$')
                echo "  [poll $i] FRESH-conn vector_probe=${p:-NA}"; sleep 5
              done ) &
            POLLPID=$!
            if [ -n "$TMO" ]; then export FALKOR_QUERY_TIMEOUT_MS="$TMO"; else unset FALKOR_QUERY_TIMEOUT_MS || true; fi
            rc=0
            ./target/release/benchmark load --vendor falkor --size small \
              --endpoint "falkor://127.0.0.1:${PORT}" -b 5000 --query-profile fixture-dependent \
              > "/tmp/load_${NAME}.log" 2>&1 || rc=$?
            kill "$POLLPID" 2>/dev/null || true
            echo ">>> [$DESC] LOAD exit: $rc  (non-zero => REPRODUCED)"
            grep -iE 'post-phase fixtures (ready|not)|vector_hits=|Timed out waiting|ready after' "/tmp/load_${NAME}.log" | tail -4
            echo -n "  FINAL fresh vector_probe: "; docker exec "$NAME" redis-cli GRAPH.QUERY falkor "CALL db.idx.vector.queryNodes('User','embedding',1, vecf32([0.1,0.2,0.3])) YIELD node RETURN count(node)" 2>&1 | grep -oE '\(integer\) [0-9]+' | head -1
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            echo "::endgroup::"
          }

          #            desc            docker flags                     timeout  cfg
          run_config "bare-control"    ""                               ""       0
          run_config "timeout-5s"      ""                               "5000"   0
          run_config "mem-24g"         "--memory=24g"                   ""       0
          run_config "full-replica"    "--cpus=${NPROC} --memory=24g"   "5000"   1
          echo "vecdiag(bisect) done for arch=$ARCH"

  cleanup-runners:
    needs: [setup, diagnose]
    if: ${{ always() && needs.setup.result == 'success' }}
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          instance_label: vecdiag-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.arch }}
