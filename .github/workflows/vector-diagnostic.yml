# One-shot vector-index diagnostic. Reproduces the benchmark's fixture-dependent
# vector-index setup at the tool's real scale (~10k nodes, ~103 embeddings) ON
# THE REAL GCE hardware (n4 / Intel AVX-512 and c4a / Axion SVE) and dumps
# `db.indexes()` — for BOTH the C `edge` engine and the Rust `edge-rs` engine on
# the SAME VM.
#
# Why C-vs-Rust on the same box: both engines link the SAME VecSim (same spaces/
# SIMD kernels), yet C's KNN probe returns 0 while Rust returns hits on identical
# hardware — so the bug is NOT VecSim/SIMD, it's how the C engine drives VecSim's
# tiered/async vector ingestion. The decisive field is `numDocuments`: if C shows
# 0 while Rust shows ~103 on the same VM, it's a C-side ingestion issue (a
# background-writer race on the 16-vCPU VM), not the search kernel.
#
# Trigger: add the `vecdiag` label to a PR (same-repo branches only), or run
# manually once this is on the default branch. Runs on both arches by default.
name: Vector index diagnostic (GCE)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      arches:
        description: "Which arches to test"
        required: false
        default: "both"
        type: choice
        options: ["both", "x86", "arm"]

permissions:
  contents: read

concurrency:
  group: vecdiag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'vecdiag' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.d.outputs.arches }}
    steps:
      - id: d
        env:
          SEL: ${{ github.event.inputs.arches }}
        run: |
          set -euo pipefail
          case "${SEL:-both}" in
            x86) echo 'arches=["x86"]' >> "$GITHUB_OUTPUT" ;;
            arm) echo 'arches=["arm"]' >> "$GITHUB_OUTPUT" ;;
            *)   echo 'arches=["x86","arm"]' >> "$GITHUB_OUTPUT" ;;
          esac

  create-runners:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create GCE runner (${{ matrix.arch }})
        uses: ./.github/actions/create-runner
        with:
          token: ${{ secrets.GH_SA_TOKEN }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          machine_zones: ${{ matrix.arch == 'arm' && (vars.GCP_ZONES_ARM || vars.GCP_ZONES) || vars.GCP_ZONES }}
          machine_type: ${{ matrix.arch == 'arm' && (vars.BENCHMARK_MACHINE_TYPE_ARM || 'c4a-highcpu-16') || (vars.BENCHMARK_MACHINE_TYPE || 'n4-highcpu-16') }}
          arm: ${{ matrix.arch == 'arm' }}
          image_family: ${{ matrix.arch == 'arm' && (vars.BENCHMARK_IMAGE_FAMILY_ARM || 'debian-12-arm64') || '' }}
          image_project: ${{ matrix.arch == 'arm' && (vars.BENCHMARK_IMAGE_PROJECT_ARM || 'debian-cloud') || '' }}
          network: gh-runner
          runner_label: vecdiag-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.arch }}

  diagnose:
    needs: [setup, create-runners]
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: vecdiag-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.arch }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Probe vector index — C vs Rust (${{ matrix.arch }})
        run: |
          # No `set -e`: run every diagnostic query even if one errors.
          set -uo pipefail
          ARCH="${{ matrix.arch }}"

          echo "::group::Host CPU features (arch=$ARCH)"
          uname -m
          grep -m1 -Ei '^flags|^Features' /proc/cpuinfo | tr ' ' '\n' \
            | grep -iE 'avx512|^sve$|sve2|asimd|neon' | sort -u | tr '\n' ' '; echo
          echo "nproc=$(nproc)"
          echo "::endgroup::"

          # Run the fixture-dependent setup at the tool's real scale against one
          # image and dump db.indexes().
          probe_image() {
            IMG="$1"; NAME="vecdiag-$(echo "$IMG" | tr '/:.' '___')"; PORT=16399
            echo "::group::### $IMG  (arch=$ARCH)"
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            docker pull "$IMG" >/dev/null 2>&1 || docker pull "$IMG"
            docker run -d --name "$NAME" -p "${PORT}:6379" "$IMG" >/dev/null
            for _ in $(seq 1 60); do
              docker exec "$NAME" redis-cli PING 2>/dev/null | grep -q PONG && break; sleep 1
            done
            docker exec "$NAME" redis-cli PING
            Q() { docker exec "$NAME" redis-cli GRAPH.QUERY vg "$1"; }
            # FULL benchmark fixture: real Pokec-scale graph (10k Users + ~120k
            # Friend edges) + the id index + bench_capacity backfill + node/rel
            # full-text indexes + vector index, THEN the seeds — matching the
            # tool's fixture-dependent load, so the vector ingestion runs amid
            # the same concurrent edge-indexing/backfill work.
            echo "[$(date +%T)] load 10k User nodes"
            Q "UNWIND range(0, 9999) AS i CREATE (:User {id:i, age:(i % 80) + 15})" >/dev/null
            Q "CREATE INDEX FOR (u:User) ON (u.id)" >/dev/null
            sleep 3
            echo "[$(date +%T)] create ~120k Friend edges"
            Q "UNWIND range(0,9999) AS i UNWIND range(1,12) AS k MATCH (a:User {id:i}), (b:User {id:(i*7 + k*13) % 10000}) WHERE a <> b CREATE (a)-[:Friend]->(b)" >/dev/null
            echo '--- Friend edge count ---'; Q "MATCH ()-[e:Friend]->() RETURN count(e)"
            echo "[$(date +%T)] bench_capacity backfill over all Friend edges"
            Q "MATCH (n:User)-[e:Friend]->(m:User) SET e.bench_capacity = coalesce(e.bench_capacity, 1 + ((n.id*31 + m.id*17) % 20))" >/dev/null
            echo "[$(date +%T)] create node/rel full-text + vector indexes, then seed"
            Q "CREATE FULLTEXT INDEX FOR (l:User) ON (l.ft_text)" >/dev/null
            Q "CREATE FULLTEXT INDEX FOR ()-[l:Friend]->() ON (l.ft_text)" >/dev/null
            Q "CREATE VECTOR INDEX FOR (l:User) ON (l.embedding) OPTIONS {dimension:3, similarityFunction:'cosine'}" >/dev/null
            Q "MATCH (u:User) WHERE u.id % 97 = 0 SET u.ft_text = 'fixture_alice user_' + toString(u.id), u.embedding = vecf32([toFloat((u.id % 10)+1)/10.0, toFloat(((u.id+3)%10)+1)/10.0, toFloat(((u.id+6)%10)+1)/10.0])" >/dev/null
            Q "MATCH (s:User)-[r:Friend]->(d:User) WHERE s.id % 97 = 0 SET r.ft_text = 'fixture_blue edge_' + toString(s.id) + '_' + toString(d.id)" >/dev/null
            echo "[$(date +%T)] probe"
            echo '--- embedding property count (expect ~103) ---'
            Q "MATCH (u:User) WHERE u.embedding IS NOT NULL RETURN count(u)"
            echo '--- VECTOR probe count(node) — the failing check ---'
            Q "CALL db.idx.vector.queryNodes('User','embedding',1, vecf32([0.1,0.2,0.3])) YIELD node, score RETURN count(node)"
            echo '--- FULLTEXT node probe count — control ---'
            Q "CALL db.idx.fulltext.queryNodes('User','fixture_alice') YIELD node RETURN count(node)"
            echo '--- FULLTEXT rel probe count — control ---'
            Q "CALL db.idx.fulltext.queryRelationships('Friend','fixture_blue') YIELD edge RETURN count(edge)"
            echo '--- db.indexes() — KEY: numDocuments / indexingFailures / status ---'
            Q "CALL db.indexes()"
            echo '--- retry VECTOR probe after 10s (async-build check) ---'
            sleep 10
            Q "CALL db.idx.vector.queryNodes('User','embedding',1, vecf32([0.1,0.2,0.3])) YIELD node, score RETURN count(node)"
            echo '--- db.indexes() again (did numDocuments change?) ---'
            Q "CALL db.indexes()"
            echo '--- server log tail ---'
            docker logs "$NAME" 2>&1 | tail -30
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            echo "::endgroup::"
          }

          # Same VecSim, same VM: C engine (fails?) vs Rust engine (control).
          probe_image "docker.io/falkordb/falkordb-server:edge"
          probe_image "ghcr.io/falkordb/falkordb-server:edge-rs"
          echo "vecdiag done for arch=$ARCH"

  cleanup-runners:
    needs: [setup, diagnose]
    if: ${{ always() && needs.setup.result == 'success' }}
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.arches) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          instance_label: vecdiag-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.arch }}
