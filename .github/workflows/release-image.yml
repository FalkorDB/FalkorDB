name: Release image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (no v prefix). If it matches X.Y.Z it must equal Cargo.toml version."
        required: true
      commit_sha:
        description: "Commit SHA to build"
        required: true
      mark_latest:
        description: "Also tag :latest (moves the latest pointer — use with care)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
      is_latest: ${{ steps.derive.outputs.is_latest }}
      browser_tag: ${{ steps.derive.outputs.browser_tag }}
      commit_sha: ${{ steps.derive.outputs.commit_sha }}
      push_to_dockerhub: ${{ steps.derive.outputs.push_to_dockerhub }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}

      - name: Derive tag, latest flag, browser tag, commit SHA
        id: derive
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push)
              # edge-rs distinguishes the Rust port's edge channel from the
              # C port's :edge on the same falkordb/falkordb Docker Hub repo
              # (once we start pushing to Docker Hub from this pipeline).
              TAG="edge-rs"
              IS_LATEST=false
              BROWSER_TAG="edge"
              COMMIT_SHA="${{ github.sha }}"
              PUSH_HUB=false
              ;;
            release)
              TAG_RAW="${{ github.event.release.tag_name }}"
              TAG="${TAG_RAW#v}"
              IS_LATEST=true
              BROWSER_TAG="latest"
              COMMIT_SHA="${{ github.sha }}"
              PUSH_HUB=true
              ;;
            workflow_dispatch)
              TAG="${{ inputs.tag }}"
              IS_LATEST="${{ inputs.mark_latest }}"
              BROWSER_TAG="latest"
              COMMIT_SHA="${{ inputs.commit_sha }}"
              # Manual dispatch publishes to Docker Hub too — that's the "promote" escape hatch.
              PUSH_HUB=true
              ;;
            *)
              echo "::error::unsupported event ${{ github.event_name }}"
              exit 1
              ;;
          esac

          # Validate Cargo.toml against any semver-shaped tag (always on release;
          # on dispatch only when the tag looks like X.Y.Z, so operators can still
          # dispatch ad-hoc tags like 'edge-test' without enforcement).
          VALIDATE=0
          if [ "${{ github.event_name }}" = "release" ]; then
            VALIDATE=1
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
               echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VALIDATE=1
          fi
          if [ "$VALIDATE" = "1" ]; then
            CARGO_VERSION=$(cargo metadata --no-deps --format-version=1 \
              | jq -r '.packages[] | select(.name=="falkordb-rs") | .version')
            if [ "$CARGO_VERSION" != "$TAG" ]; then
              echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG)"
              exit 1
            fi
          fi

          {
            echo "tag=${TAG}"
            echo "is_latest=${IS_LATEST}"
            echo "browser_tag=${BROWSER_TAG}"
            echo "commit_sha=${COMMIT_SHA}"
            echo "push_to_dockerhub=${PUSH_HUB}"
          } >> "$GITHUB_OUTPUT"
          echo "Derived: tag=${TAG} is_latest=${IS_LATEST} browser_tag=${BROWSER_TAG} commit_sha=${COMMIT_SHA} push_hub=${PUSH_HUB}"

  build:
    needs: prepare
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      commit_sha: ${{ needs.prepare.outputs.commit_sha }}
      browser_tag: ${{ needs.prepare.outputs.browser_tag }}
      push_to_dockerhub: ${{ fromJSON(needs.prepare.outputs.push_to_dockerhub) }}
      is_latest: ${{ fromJSON(needs.prepare.outputs.is_latest) }}
    secrets: inherit
