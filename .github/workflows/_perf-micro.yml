# The nightly perf micro check, `micro-hw` (epic #3974), called by
# perf-nightly.yml with two falkordb-server images pinned by digest. `preflight`
# checks the inputs and builds (or finds) the measurement image; `hardware` runs
# `bench hw` on a GCE C4 through _perf-vm.yml (`pmu: true`), which uploads
# artifact `perf-result-micro-hw`. What it measures and its gates: bench/README.md.
#
# _perf-vm.yml runs the check's command from the CALLING commit, so a caller on
# a branch without `bench hw` gets an error result until this is on main.
name: Perf micro check

on:
  workflow_call:
    inputs:
      candidate_image:
        description: falkordb-server image, name[:tag]@sha256:<64 hex>
        type: string
        required: true
      baseline_image:
        description: falkordb-server image, name[:tag]@sha256:<64 hex>
        type: string
        required: true
      mode:
        description: queue | nightly | long (one parameter set today)
        type: string
        required: true
      candidate_label:
        type: string
        required: false
        default: ""
      baseline_label:
        type: string
        required: false
        default: ""
      candidate_commit:
        type: string
        required: false
        default: ""
      baseline_commit:
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  # The measurement image is built FROM the C engine's image: it ships redis,
  # redis-benchmark and jemalloc. bench/Dockerfile says why.
  C_IMAGE: docker.io/falkordb/falkordb-server:edge-c

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # write: a cache miss builds and pushes the measurement image.
      packages: write
    outputs:
      bench_image: ${{ steps.bake.outputs.image }}
    steps:
      # The images must be pinned (contract rule 1). Failing here skips the
      # hardware job, and the caller's merge step reports the missing result.
      - name: Check the inputs
        env:
          CANDIDATE: ${{ inputs.candidate_image }}
          BASELINE: ${{ inputs.baseline_image }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          ok=1
          for ref in "$CANDIDATE" "$BASELINE"; do
            if ! [[ "$ref" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$ref is not pinned by a full sha256 digest"
              ok=0
            fi
          done
          case "$MODE" in
            queue|nightly|long) ;;
            *) echo "::error::mode '$MODE' is not queue, nightly or long"; ok=0 ;;
          esac
          [ "$ok" = 1 ]

      # bench/Dockerfile comes from the commit this workflow file was read
      # from, not the caller's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Content-addressed: the tag is a hash of the C image's index digest and
      # every file the build reads, so it is built once and found after that.
      # Built FROM that digest rather than the tag, so the base cannot move
      # between the key and the build; handed on by digest, so the VM pulls
      # exactly this image even if two cache misses race to push the tag.
      - name: Bake the measurement image
        id: bake
        run: |
          set -euo pipefail
          base=$(docker buildx imagetools inspect "$C_IMAGE" --format '{{.Manifest.Digest}}')
          [[ "$base" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not resolve $C_IMAGE ($base)"; exit 1; }
          key=$( { printf '%s' "$base"; cat bench/pyproject.toml bench/uv.lock bench/Dockerfile; } \
                 | sha256sum | cut -c1-16 )
          image="ghcr.io/falkordb/falkordb-bench:$key"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "cache hit: $image"
          else
            echo "building $image"
            docker build --build-arg "C_IMAGE=${C_IMAGE%:*}@$base" -t "$image" -f bench/Dockerfile .
            docker push "$image"
          fi
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not resolve $image ($digest)"; exit 1; }
          echo "image=${image%:*}@$digest" | tee -a "$GITHUB_OUTPUT"

  # By branch until #3988 is on main; then `./.github/workflows/_perf-vm.yml`,
  # once a cross-branch call shows `./` resolving to this file's commit.
  hardware:
    needs: preflight
    permissions:
      contents: read
      packages: read
    uses: FalkorDB/FalkorDB/.github/workflows/_perf-vm.yml@ci/perf-vm
    with:
      check: micro-hw
      command: uv run --project bench bench hw --bench-image ${{ needs.preflight.outputs.bench_image }}
      candidate_image: ${{ inputs.candidate_image }}
      baseline_image: ${{ inputs.baseline_image }}
      mode: ${{ inputs.mode }}
      timeout_minutes: 90
      pmu: true
      machine_type: c4-standard-8
      fallback_machine_type: c4-standard-16
      candidate_label: ${{ inputs.candidate_label }}
      baseline_label: ${{ inputs.baseline_label }}
      candidate_commit: ${{ inputs.candidate_commit }}
      baseline_commit: ${{ inputs.baseline_commit }}
    secrets: inherit
