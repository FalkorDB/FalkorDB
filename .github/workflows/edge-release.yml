# The rolling `edge` prerelease: the module files of `main`'s newest commit,
# for anything that downloads releases/download/<tag>/<asset> (falkordblite,
# falkordblite-ts, falkordb-bin-py) to follow main the way the `edge` images do
# (rust-push.yml's promote-edge).
#
# Nothing is rebuilt. falkordb-macos-arm64v8.so is the merge queue's build of
# the commit (_build-macos.yml, from rust-pr.yml), and falkordb-x64.so and
# falkordb-arm64v8.so are copied out of the queue's rc-mg-<sha>-valkey image.
# The release is a prerelease and never marked latest, so it moves none of the
# release channels (build/publish_tags.py skips prereleases).
#
# Its own workflow, never cancelled: rust-push.yml cancels its previous run on
# every push, and an upload cut short would leave `edge` with files missing or
# from two commits. A run whose commit is no longer main's head does nothing;
# the run for the newer commit follows. The files go up before the tag and the
# notes move, so the tag never names a commit whose files are not there yet.

name: Edge release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: edge-release
  cancel-in-progress: false

jobs:
  edge-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the edge release and its tag
      actions: read # the queue run's artifact
      packages: read # the queue's image on GHCR
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip a commit main has moved past
        id: head
        run: |
          set -euo pipefail
          HEAD=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$HEAD" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $HEAD now; its own run publishes edge."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect the module files
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          # Not `--status success`: combined with --commit it returns nothing.
          RUN=$(gh run list --workflow rust-pr.yml --event merge_group --commit "$GITHUB_SHA" \
            --limit 20 --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId // empty')
          if [ -z "$RUN" ]; then
            echo "::error::no successful merge-queue run of Rust PR for $GITHUB_SHA"; exit 1
          fi
          gh run download "$RUN" --name falkordb-macos-arm64v8.so --dir dist
          ( cd dist && sha256sum -c falkordb-macos-arm64v8.so.sha256 )
          IMAGE="ghcr.io/falkordb/falkordb-server:rc-mg-${GITHUB_SHA}-valkey"
          for CELL in x64:linux/amd64:x86-64 arm64v8:linux/arm64:aarch64; do
            IFS=: read -r SUFFIX PLATFORM MACHINE <<<"$CELL"
            docker pull --quiet --platform "$PLATFORM" "$IMAGE"
            CID=$(docker create --platform "$PLATFORM" "$IMAGE")
            docker cp "$CID:/var/lib/falkordb/bin/falkordb.so" "dist/falkordb-${SUFFIX}.so"
            docker rm "$CID" >/dev/null
            KIND=$(file -b "dist/falkordb-${SUFFIX}.so")
            if [[ "$KIND" != *"$MACHINE"* ]]; then
              echo "::error::falkordb-${SUFFIX}.so from $IMAGE ($PLATFORM) is: $KIND"; exit 1
            fi
            ( cd dist && sha256sum "falkordb-${SUFFIX}.so" > "falkordb-${SUFFIX}.so.sha256" )
          done
          ( cd dist && sha256sum falkordb-*.so > SHA256SUMS && cat SHA256SUMS )
          echo "RUN=$RUN" >> "$GITHUB_ENV"

      - name: Publish to the edge prerelease
        if: steps.head.outputs.current == 'true'
        run: |
          set -euo pipefail
          # The first time, the tag and the release are created here, at this
          # commit. Afterwards the files are replaced first, then the tag and
          # the notes move to this commit.
          if ! gh api "repos/$GH_REPO/git/ref/tags/edge" >/dev/null 2>&1; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/edge -f sha="$GITHUB_SHA" >/dev/null
          fi
          if ! gh release view edge >/dev/null 2>&1; then
            gh release create edge --verify-tag --prerelease --latest=false --title edge --notes "Rolling build of main."
          fi
          gh release upload edge dist/falkordb-*.so dist/falkordb-*.so.sha256 dist/SHA256SUMS --clobber
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/edge" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          NOTES="Rolling build of \`main\` at ${GITHUB_SHA}, replaced on every merge. Not a release.

          falkordb-macos-arm64v8.so is the merge queue's build of this commit (run ${RUN}); falkordb-x64.so and falkordb-arm64v8.so come from ghcr.io/falkordb/falkordb-server:rc-mg-${GITHUB_SHA}-valkey."
          gh release edit edge --prerelease --latest=false --notes "$NOTES"
          echo "edge now carries ${GITHUB_SHA}"
