# Per-query benchmark + query-set coverage, on demand.
#
# Runs `bench/` — the per-query harness (317 queries) — for this PR, its base
# and the production C engine, and reports per-query deltas plus how much of
# the `graph` crate the query set covers.
#
# Trigger: add the `benchmark-cov` label to a PR. Only on the `labeled` event,
# never on later pushes while the label happens to sit there. To re-run, remove
# and re-add the label. Skipped for fork PRs (read-only GITHUB_TOKEN, cannot
# comment) and for PRs that do not target `main-rs`.
#
# ## Everything measured is a prebuilt image
#
# Nothing here compiles the engine. The three modules come from images that
# other workflows already published:
#
#   pr    ghcr.io/falkordb/falkordb-server:rc-pr-<N>   (rust-pr.yml)
#   base  falkordb/falkordb-server:edge-rs             (rust-push.yml, main-rs)
#   c     falkordb/falkordb-server:edge                (the C engine)
#
# The cost: `edge-rs` is the tip of `main-rs` when it was last built, not this
# PR's merge base, so the base side can be off by whatever landed in between.
# That is stated in the posted comment. Building both sides from source instead
# is exact and costs ~10 minutes of compile per side — worth it for a
# borderline row, which is what the local recipe in the bench skill is for.
#
# ## One environment, every module
#
# All measurement runs inside the C engine's image, whichever module is being
# measured. A module copied out of an image needs that image's library
# environment (an earlier attempt that copied modules onto the bare runner
# failed with "server did not start"), and only the C image carries
# `redis-benchmark` — the Rust images ship redis-server and redis-cli but not
# it. Verified: the C image is Debian 13, redis 8.6.3 with jemalloc, and loads
# the C module and both Rust modules. Same redis, same allocator, three
# modules, no cross-environment difference to explain away.
#
# ## Why every side is its own job
#
# The first version did all of this in two jobs, serially: 4 callgrind passes
# back to back, then 2 full-set runs back to back, 32 minutes wall-clock. The
# sides are independent, so they are now a matrix — 3 measure jobs, 4 callgrind
# jobs and coverage all run at once and `report` fans them in. Each job's CSV
# is an artifact, so one side failing costs that side's column and nothing else.
#
# ## Why not macOS, and why not wall-clock
#
# A hosted macOS runner produced neither metric: `proc_pid_rusage` reported 0
# instructions (it is a VM), and Homebrew's redis is built against libc malloc
# rather than jemalloc, so the allocation columns were empty too — 19 minutes
# for "No comparable rows", at the 10x macOS billing rate. Linux hosted runners
# have no PMU either, but stock redis there *is* jemalloc-built, so allocated
# bytes is a real deterministic signal, and callgrind counts instructions in
# software regardless of the host.
#
# Wall-clock is never substituted for instructions. A time-based stand-in would
# turn the gate into a noise detector while still looking like a measurement.
name: Benchmark + coverage

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  packages: read

concurrency:
  group: benchmark-cov-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  C_IMAGE: docker.io/falkordb/falkordb-server:edge
  BASE_IMAGE: docker.io/falkordb/falkordb-server:edge-rs
  PR_IMAGE: ghcr.io/falkordb/falkordb-server:rc-pr-${{ github.event.pull_request.number }}
  TOOLCHAIN: ghcr.io/falkordb/falkordb-build:latest
  MODULE_PATH: /var/lib/falkordb/bin/falkordb.so

jobs:
  # Fail fast and cheaply. Seven jobs are about to pull these tags; if the PR
  # image is not published yet (rust-pr.yml still running, or it never ran for
  # this PR) they would each fail several minutes in with a bare docker error.
  preflight:
    if: >-
      github.event.label.name == 'benchmark-cov' &&
      github.event.pull_request.base.ref == 'main-rs' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api -X POST "repos/$REPO/issues/$PR/reactions" -f content="eyes" || true

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without this the run silently measures whatever `rc-pr-<N>` happens to
      # point at. Observed: a labelled run measured an image built two commits
      # earlier because rust-pr.yml was still building the current head — the
      # tag existed, so nothing complained, and the comment attributed someone
      # else's code to this PR. The tag carries no digest or commit label, so
      # freshness has to come from the Actions API: find rust-pr.yml's run for
      # this exact head SHA and wait for its build-rc-image jobs.
      - name: Wait for the PR image to be built from this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 45 * 60 ))
          while :; do
            RUN=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
                    --jq '[.workflow_runs[] | select(.path == ".github/workflows/rust-pr.yml")]
                          | sort_by(.run_number) | last | .id // empty')
            if [ -n "$RUN" ]; then
              # `build-rc-image` calls a reusable workflow, so its jobs surface
              # as "build-rc-image / build (...)" — match on the prefix.
              STATES=$(gh api "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" --paginate \
                         --jq '[.jobs[] | select(.name | startswith("build-rc-image"))
                                | .conclusion // "pending"] | join(",")')
              case "$STATES" in
                "")            echo "run $RUN has not scheduled build-rc-image yet" ;;
                *pending*)     echo "build-rc-image still running: $STATES" ;;
                *failure*|*cancelled*|*timed_out*)
                  echo "::error::build-rc-image did not succeed for $HEAD_SHA ($STATES). The rc-pr image would be stale; fix that build and re-apply the label."
                  exit 1 ;;
                *)
                  echo "build-rc-image complete for $HEAD_SHA ($STATES)"
                  break ;;
              esac
            else
              echo "no rust-pr.yml run for $HEAD_SHA yet"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::timed out waiting for rust-pr.yml to publish an image for $HEAD_SHA."
              exit 1
            fi
            sleep 30
          done

      - name: Resolve the three images
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > provenance.json
          import json, os, subprocess

          out = {}
          for side, image in (("pr", os.environ["PR_IMAGE"]),
                              ("base", os.environ["BASE_IMAGE"]),
                              ("c", os.environ["C_IMAGE"])):
              r = subprocess.run(["docker", "manifest", "inspect", "-v", image],
                                 capture_output=True, text=True)
              if r.returncode != 0:
                  hint = ""
                  if side == "pr":
                      hint = (" — rust-pr.yml publishes it; wait for that workflow "
                              "to finish, then re-apply the label")
                  raise SystemExit(f"::error::{image} could not be resolved{hint}\n"
                                   f"{r.stderr.strip()[:400]}")
              # A multi-arch tag returns a list, a single-arch one an object.
              d = json.loads(r.stdout)
              d = d[0] if isinstance(d, list) else d
              out[side] = {"image": image, "digest": d.get("Descriptor", {}).get("digest")}
          out["_head_sha"] = os.environ.get("HEAD_SHA", "")
          print(json.dumps(out, indent=2))
          PY
          cat provenance.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: provenance.json
          retention-days: 7

  # Full 317-query set, one runner per side, all three at once. ~7 min each;
  # they were 14.5 min back to back before.
  measure:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [pr, base, c]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: matrix.side == 'pr'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the ${{ matrix.side }} module
        id: mod
        run: |
          set -euo pipefail
          case "${{ matrix.side }}" in
            pr)   SRC="$PR_IMAGE" ;;
            base) SRC="$BASE_IMAGE" ;;
            c)    SRC="$C_IMAGE" ;;
          esac
          docker pull -q "$SRC"
          cid=$(docker create "$SRC")
          docker cp "$cid:$MODULE_PATH" ./module.so
          docker rm -f "$cid" >/dev/null
          ls -l module.so

      - name: Measure
        run: |
          set -euo pipefail
          # --c-compat for the C side: it skips the setup commands and queries
          # the C engine does not implement (UDFs are Rust-only) instead of
          # aborting the run.
          # Spelled as an `if` rather than `[ ] && VAR=...`: the latter is fine
          # under `set -e` today but reads like the classic footgun, and this
          # step is the one nobody wants to debug from a CI log.
          COMPAT=""
          if [ "${{ matrix.side }}" = c ]; then COMPAT="--c-compat"; fi
          docker run --rm -v "$PWD:/w" -w /w --entrypoint bash "$C_IMAGE" -c "
            set -e
            # The image hooks DPkg::Pre-Install-Pkgs to a dpkg-preconfigure
            # binary it does not contain, so every apt call prints
            # '/usr/sbin/dpkg-preconfigure: not found' and carries on.
            # DEBIAN_FRONTEND does not suppress it (it is a hook, not a
            # frontend); removing the hook file does.
            rm -f /etc/apt/apt.conf.d/70debconf
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 >/dev/null
            python3 bench/run_bench.py $COMPAT --module /w/module.so \
              --out /w/full-${{ matrix.side }}.csv
          " 2>&1 | tee "measure-${{ matrix.side }}.log" | tail -30
          grep -c SKIPPED "measure-${{ matrix.side }}.log" \
            | sed 's/^/queries the engine skipped: /' || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: measure-${{ matrix.side }}
          path: |
            full-${{ matrix.side }}.csv
            measure-${{ matrix.side }}.log
          retention-days: 7

  # Deterministic instruction counts. `c` is measured twice: its
  # reproducibility has to be demonstrated before the PR/C column means
  # anything, and the second pass is what demonstrates it — the report
  # collapses the column to a range when the two disagree.
  callgrind:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Two real dimensions, 4x4 = 16 jobs. Deliberately NOT `include:` to pair
      # side with source — an include entry that names no matrix key is applied
      # to every combination, so the four of them would overwrite each other
      # rather than fan out. `c2` maps to the `c` module in the step below.
      #
      # 93 queries at ~14.5s each is ~22 min of measurement per side. Sharded 4
      # ways that is ~5.5 min of wall-clock, which is what the full-set
      # `measure` job costs anyway — so the subset got 12x wider for free.
      matrix:
        side: [pr, base, c, c2]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `c2` is a second, independent pass over the same C module — not a second
      # image — so only `pr` needs the private registry.
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        if: matrix.side == 'pr'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the ${{ matrix.side }} module
        run: |
          set -euo pipefail
          case "${{ matrix.side }}" in
            pr)     SRC="$PR_IMAGE" ;;
            base)   SRC="$BASE_IMAGE" ;;
            c|c2)   SRC="$C_IMAGE" ;;
          esac
          docker pull -q "$SRC"
          cid=$(docker create "$SRC")
          docker cp "$cid:$MODULE_PATH" ./module.so
          docker rm -f "$cid" >/dev/null

      - name: Count instructions under callgrind
        run: |
          set -euo pipefail
          # OMP_NUM_THREADS=1 plus THREAD_COUNT 1: thread count is what makes
          # these counts reproducible or not. The C engine otherwise sizes its
          # pool to the host and sets OpenMP to match, and valgrind schedules
          # threads nondeterministically — the same C module measured twice
          # disagreed by up to 10x on one query before this was pinned.
          docker run --rm -e OMP_NUM_THREADS=1 -v "$PWD:/w" -w /w \
            --entrypoint bash "$C_IMAGE" -c '
            set -e
            rm -f /etc/apt/apt.conf.d/70debconf
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends valgrind python3 >/dev/null
            valgrind --version
            python3 bench/cachegrind.py --module /w/module.so \
              --shard ${{ matrix.shard }}/4 \
              --out /w/cg-${{ matrix.side }}-${{ matrix.shard }}.csv \
              --module-args THREAD_COUNT 1
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: callgrind-${{ matrix.side }}-${{ matrix.shard }}
          path: cg-${{ matrix.side }}-${{ matrix.shard }}.csv
          retention-days: 7

  # The one job that must build from source: coverage needs an instrumented
  # module, which no published image carries. Runs alongside the measurement
  # jobs, so it costs no extra wall-clock.
  coverage:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Instrumented build + run the query set once
        run: |
          set -euo pipefail
          # `rustup default stable`: the toolchain image ships rustup without a
          # default, so a bare `cargo` fails with "could not choose a version of
          # cargo to run".
          docker run --rm -e CXX=clang++ -v "$PWD:/w" -w /w "$TOOLCHAIN" bash -c '
            set -e
            rustup default stable >/dev/null
            rustup component add llvm-tools-preview >/dev/null
            bash bench/coverage.sh
          ' 2>&1 | tee coverage.txt | tail -30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.txt
          retention-days: 7

  # Fan-in. `!cancelled()` rather than `success()`: a side that failed should
  # cost its own column and nothing else, and the report is built from whatever
  # CSVs actually arrived.
  report:
    needs: [preflight, measure, callgrind, coverage]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: art
          merge-multiple: true

      - name: Build the comment
        run: |
          set -euo pipefail
          ls -R art || true
          # Quoted: the callgrind values are globs for report.py to expand over
          # the four shards, not for the shell to expand here.
          python3 bench/report.py \
            --measure pr=art/full-pr.csv base=art/full-base.csv c=art/full-c.csv \
            --callgrind 'pr=art/cg-pr-*.csv' 'base=art/cg-base-*.csv' \
                        'c=art/cg-c-*.csv' 'c2=art/cg-c2-*.csv' \
            --coverage art/coverage.txt \
            --provenance art/provenance.json \
            > comment.md
          cat comment.md

      # Upsert, so re-running replaces the previous report instead of burying
      # the PR in near-identical comments. Paginated: a PR with more than one
      # page of comments would miss the marker and post a duplicate every run.
      - name: Post or update the PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- benchmark-cov-report -->"
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                 --jq "map(select(.body | contains(\"$MARKER\"))) | .[-1].id // empty")
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md
          fi

      # Report first, then fail. Two different things are being caught here:
      # coverage failing means the query set no longer runs clean, and a
      # measure/callgrind job failing means the comment above is missing rows.
      # Neither may be reported as success. Note this gates on jobs *crashing*,
      # never on a delta — deciding whether a ratio is acceptable belongs to
      # whoever reads the comment.
      - name: Fail if a measurement or coverage job did not run clean
        if: >-
          needs.coverage.result != 'success' ||
          needs.measure.result != 'success' ||
          needs.callgrind.result != 'success'
        run: |
          echo "::error::coverage=${{ needs.coverage.result }} measure=${{ needs.measure.result }} callgrind=${{ needs.callgrind.result }} — see the comment and the job logs."
          exit 1
