# Reusable workflow: the CI suites, parameterised by how they obtain the engine.
#
# There is ONE definition per flavour. What varies between a pull request and a
# merge-queue entry is the VEHICLE, not the tests:
#
#   artifact - build libfalkordb.so, upload it, let RLTest spawn the server
#              locally (Valkey, from the toolchain image). No registry write, no
#              `packages:` permission, so it runs on the read-only token a fork
#              gets.
#   image    - build and publish the RC images, run the cells against them in
#              service containers. This is what ships, so it is what the merge
#              queue gates on. One leg per server (_image-leg.yml): Valkey
#              always; Redis always in the merge queue, and on a pull request
#              per `redis_leg`.
#
# Coverage is always the artifact vehicle: the profiles have to land in the
# workspace, and nothing ships the coverage image. a-sanitizer is image-only
# for now - converting it needs an instrumented server alongside the module,
# which is its own change. Coverage and a-sanitizer run on Valkey only.

name: CI pipeline (reusable)

on:
  workflow_call:
    inputs:
      ci_key:
        description: "Per-run key: pr-<N> on a pull request, mg-<sha> in the merge queue. Runtime tags are rc-<ci_key>-<server>."
        required: true
        type: string
      commit_sha:
        description: "Commit SHA to build the RC images from"
        required: true
        type: string
      build_image:
        description: "Toolchain image used as the job container and the chef stage base"
        required: true
        type: string
      services_files:
        description: "JSON array of services-bucket flow test files (image vehicle)"
        required: true
        type: string
      spawn_files:
        description: "JSON array of spawn-bucket flow test files (image vehicle)"
        required: true
        type: string
      test_files:
        description: "JSON array of all flow test files (artifact vehicle)"
        required: true
        type: string
      use_image:
        description: >
          Gate the image vehicle. True in the merge queue, where the published
          images are the thing being gated on, and on a same-repo pull request.
          False on a fork pull request, which cannot push images and runs the
          artifact vehicle instead.
        required: false
        type: boolean
        default: false
      redis_leg:
        description: >
          Also run the image vehicle on Redis (_image-leg.yml with server redis),
          next to Valkey. The merge queue runs both servers; a pull request runs
          Valkey, and Redis too when labelled `ci-both-servers` (read from the
          event, so push after adding the label); a fork pull request has no
          image vehicle, so it runs neither leg. The Redis leg runs only with
          use_image, and always in the merge queue whatever this says.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Builds the engine once and runs the Rust unit tests here, where the compiled
  # tree already exists, rather than making `test` compile it a second time.
  build-engine:
    uses: ./.github/workflows/_build-engine.yml
    permissions:
      contents: read
    with:
      build_image: ${{ inputs.build_image }}
      cache_key: release
      artifact_name: release-binary
      unit_tests: true

  build-engine-coverage:
    uses: ./.github/workflows/_build-engine.yml
    permissions:
      contents: read
    with:
      build_image: ${{ inputs.build_image }}
      profile: debug
      rustflags: "-C instrument-coverage -C link-arg=-Wl,--allow-multiple-definition"
      cache_key: coverage
      artifact_name: coverage-binary

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ${{ inputs.build_image }}
    needs: [build-engine]
    if: ${{ !cancelled() && needs.build-engine.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-binary
          path: target/release
      - run: chmod +x target/release/libfalkordb.so
      - name: Run tests
        run: |
          . /data/venv/bin/activate
          RELEASE=1 pytest tests/test_e2e.py tests/test_functions.py tests/test_mvcc.py tests/test_concurrency.py -vv
      - name: Run TCK tests
        run: |
          . /data/venv/bin/activate
          RELEASE=1 TCK_DONE=tck_done.txt TCK_JUNIT_DIR=test-results/tck pytest tests/tck/test_tck.py -s
      # tests/common.py starts the server with --logfile redis-test.log.
      - name: Check the server this job ran (valkey)
        if: ${{ success() }}
        run: python3 tests/count_results.py check --server valkey redis-test.log
      # Counts for the run summary (tests/count_results.py, summed per server by
      # _ci-pipeline.yml's test-counts job). On every outcome but a cancel, so a
      # failing cell still counts, including one whose setup failed before its
      # tests ran. STATUS is the job's, so any failed step marks the cell. The
      # report never gates: both steps continue on error. The server is Valkey,
      # the default of flow.sh and tests/common.py.
      - name: Record test counts
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          RUN: artifact, amd64
          STATUS: ${{ job.status }}
          NAME: test-counts-artifact
        run: python3 tests/count_results.py record --server valkey --run "$RUN" --status "$STATUS" --junit test-results/pytest.xml --behave test-results/tck --logs redis-test.log --out "test-counts/$NAME.json"
      - name: Upload test counts
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-counts-artifact
          path: test-counts/
          retention-days: 7
  # Release flavour. The vehicle is the whole difference between the events: a
  # fork pull request tests the binary it just built; a same-repo pull request
  # and the queue test the images (image-valkey, image-redis below). Same file
  # list, same flavour config — separate thin calls, because a job cannot choose
  # its `uses:` at runtime and the two shapes cannot share a workflow run (see
  # _flow-artifact.yml's header).
  flow-release:
    needs: [build-engine]
    if: ${{ !cancelled() && !inputs.use_image && needs.build-engine.result == 'success' }}
    uses: ./.github/workflows/_flow-artifact.yml
    permissions:
      contents: read
    with:
      flavour: release
      server: valkey
      archs: '["amd64"]'
      test_files: ${{ inputs.test_files }}
      build_image: ${{ inputs.build_image }}
    secrets: inherit

  # Coverage is artifact-only, both events. The profiles have to land in the
  # workspace, and the queue run's upload is what gives main its Codecov
  # baseline - it is keyed on the commit SHA, which is the SHA that lands.
  flow-coverage:
    needs: [build-engine-coverage]
    if: ${{ !cancelled() && needs.build-engine-coverage.result == 'success' }}
    uses: ./.github/workflows/_flow-artifact.yml
    permissions:
      contents: read
    with:
      flavour: coverage
      server: valkey
      archs: '["amd64"]'
      test_files: ${{ inputs.test_files }}
      build_image: ${{ inputs.build_image }}
      artifact_name: coverage-binary
      artifact_path: target/debug
      collect_coverage: true
    secrets: inherit

  # The image vehicle, one leg per server: build the RC images, then run
  # test-image, the release flow matrix and Trivy against them. Valkey's flow
  # cells run on amd64 and arm64. Redis's run on amd64; its arm64 images are
  # built (and scanned) but not tested.
  image-valkey:
    if: ${{ inputs.use_image }}
    uses: ./.github/workflows/_image-leg.yml
    permissions:
      contents: read
      packages: write
    with:
      server: valkey
      ci_key: ${{ inputs.ci_key }}
      commit_sha: ${{ inputs.commit_sha }}
      build_image: ${{ inputs.build_image }}
      services_files: ${{ inputs.services_files }}
      spawn_files: ${{ inputs.spawn_files }}
      flow_archs: '["amd64", "arm64"]'
    secrets: inherit

  image-redis:
    if: ${{ inputs.use_image && (github.event_name == 'merge_group' || inputs.redis_leg) }}
    uses: ./.github/workflows/_image-leg.yml
    permissions:
      contents: read
      packages: write
    with:
      server: redis
      ci_key: ${{ inputs.ci_key }}
      commit_sha: ${{ inputs.commit_sha }}
      build_image: ${{ inputs.build_image }}
      services_files: ${{ inputs.services_files }}
      spawn_files: ${{ inputs.spawn_files }}
      flow_archs: '["amd64"]'
    secrets: inherit

  # Adds up, per server, the passed, failed and skipped tests every suite cell
  # recorded (tests/count_results.py, `test-counts-*` artifacts), and writes
  # them to the run summary, with the server versions the cells' logs name.
  # A report, not a gate: each cell's own result gates. continue-on-error, so
  # a failure here (an artifact download, the summary) can't fail this
  # workflow and, through ci-gate, a pull request whose tests all passed.
  test-counts:
    needs: [test, flow-release, image-valkey, image-redis, flow-coverage, flow-asan]
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tests/count_results.py
          sparse-checkout-cone-mode: false
      - name: Download the recorded counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: test-counts-*
          path: test-counts
          merge-multiple: true
      - name: Summarise per server
        run: |
          mkdir -p test-counts
          python3 tests/count_results.py summary test-counts | tee -a "$GITHUB_STEP_SUMMARY"

  # Build the asan instrumented runtime image (amd64-only). Single cell,
  # no manifest needed (push directly to the bare tag).
  build-rc-asan-image:
    if: ${{ inputs.use_image }}
    uses: ./.github/workflows/_build-flavour.yml
    permissions:
      contents: read
      packages: write
    with:
      flavour: a-sanitizer
      server: valkey
      # Note: asan image lives under the `falkordb` repo (not `falkordb-server`)
      # — historical from when the asan image bundled the browser stage.
      tag: rc-${{ inputs.ci_key }}-asan-valkey
      commit_sha: ${{ inputs.commit_sha }}
      cells: '[{"arch":"x64","platform":"linux/amd64","runner":"ubuntu-latest","target":"server","repo":"falkordb"}]'
      dockerfile: build/runtime/Dockerfile.asan
      build_image: ${{ inputs.build_image }}
      create_manifest: false

  # Per-flavour flow-test cells. Each `flow-<flavour>` block calls
  # _flow-flavour.yml, which runs the services + spawn matrices for that
  # one flavour. Calling the reusable workflow once per flavour gives each
  # call its own 256-cell GHA matrix budget — splitting the otherwise
  # over-the-limit (97 × multi-flavour × multi-arch) matrix into chunks.
  # Adding a new flavour later = one more block here + one Dockerfile.<f> +
  # one build-rc-<f>-image job.
  flow-asan:
    needs: [build-rc-asan-image]
    if: ${{ inputs.use_image && (!cancelled() && needs.build-rc-asan-image.result == 'success') }}
    uses: ./.github/workflows/_flow-flavour.yml
    permissions:
      contents: read
      packages: read
    with:
      flavour: a-sanitizer
      server: valkey
      # Note: asan image lives under the `falkordb` repo (not `falkordb-server`)
      # — historical from when the asan image bundled the browser stage.
      image: ghcr.io/falkordb/falkordb:rc-${{ inputs.ci_key }}-asan-valkey
      archs: '["amd64"]'
      services_files: ${{ inputs.services_files }}
      spawn_files: ${{ inputs.spawn_files }}
      build_image: ${{ inputs.build_image }}
      sanitizer_env: address

  # Build the engine with the native index compiled in (`index-falkordb`) and upload it, as
  # `build-engine` does for the default build. An artifact rather than an RC image: nothing ships
  # with the flag, so there is no image to gate on, and an artifact needs no `packages: write`.
  # That is what lets a fork, and a stacked pull request, run the ledger below. amd64 only: the
  # ledger asks whether the native index serves the index suites, which a second arch would not
  # change.
  build-engine-nextgen:
    uses: ./.github/workflows/_build-engine.yml
    permissions:
      contents: read
    with:
      build_image: ${{ inputs.build_image }}
      features: index-falkordb
      # The same key as `build-engine`: the feature adds no dependencies, and rust-cache keeps
      # only the dependencies, so the two builds restore the same cache.
      cache_key: release
      artifact_name: nextgen-binary

  # Reconcile the index flow suites against the xfail ledger.
  #
  # Not a pass/fail gate on the suites themselves: with no RediSearch fallback the native index
  # cannot yet serve every predicate, and those gaps are recorded in
  # tests/flow/nextgen_index_xfail.txt. The gate is that the run MATCHES the ledger — an
  # unrecorded failure or a ledgered test that started passing both fail the build. That is what
  # keeps the ledger describing reality instead of decaying into a list of stale excuses.
  #
  # Runs the suites in one job rather than through the flow matrix because the check needs the
  # combined output of all of them; a per-file matrix would need cross-cell collection to say
  # anything.
  #
  # The artifact vehicle, as `_flow-artifact.yml`: RLTest starts Valkey itself with the downloaded
  # module, so there is no service and no registry read, and every event runs it.
  nextgen-index-ledger:
    needs: [build-engine-nextgen]
    if: ${{ !cancelled() && needs.build-engine-nextgen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ${{ inputs.build_image }}
    permissions:
      contents: read
    env:
      # Where the artifact is unpacked, so flow.sh loads it (see `_flow-artifact.yml`).
      TARGET_DIR: target/release
      # The ledger parser reads per-test result lines, and parallel classes interleave them.
      PARALLELISM: "--parallelism 1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suites below are test code from the pull request. Do not leave the token in
          # .git/config.
          persist-credentials: false
      - name: Download the native-index binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextgen-binary
          path: target/release
      - run: chmod +x target/release/libfalkordb.so
      - name: Run the index flow suites against the native-index build
        # A failing suite is expected while gaps remain, so this step must not fail the job — the
        # ledger check below is the gate. But each suite's exit status is recorded: a suite that
        # dies without running its tests would otherwise let its ledger entries reconcile
        # silently, and the check cannot tell "did not run" from "passed" on its own.
        #
        # `shell: bash` is load-bearing. Without it this container job ran the step as `sh -e`, and
        # the image's `sh` (dash) has no `PIPESTATUS`: the step died with "Bad substitution" right
        # after the first suite, the other five never ran, and the reconciliation step was
        # skipped. `set +e` is then needed because an explicit `bash` runs with `-e -o pipefail`,
        # and a suite with failing tests would abort the step the same way.
        #
        # `test_constraint` is here because under the flag a unique constraint looks up duplicates
        # in the native index, and every class in that file creates or enforces constraints.
        # `test_memory_usage` is here because only this build counts the native index in
        # `indices_sz_mb`, and its test checks that size against what CREATE INDEX costs the server.
        shell: bash
        run: |
          set +e
          . /data/venv/bin/activate
          rc=0
          for t in tests/flow/test_index_create tests/flow/test_index_scans \
                   tests/flow/test_index_updates tests/flow/test_index_delete \
                   tests/flow/test_edge_index_scans tests/flow/test_edge_index_updates \
                   tests/flow/test_constraint tests/flow/test_memory_usage; do
            TEST="$t" ./flow.sh 2>&1 | tee -a /tmp/nextgen_flow.log
            status=${PIPESTATUS[0]}
            echo "SUITE_EXIT $t $status" | tee -a /tmp/nextgen_flow.log
            if [ "$status" -gt 1 ]; then rc=1; fi   # >1 = harness died, not just test failures
          done
          exit $rc
      - name: Reconcile against the xfail ledger
        # Also after the suites step failed: that failure means a suite died, and the ledger
        # check is what reports which entries it left unreconciled.
        if: ${{ !cancelled() }}
        run: |
          . /data/venv/bin/activate
          python3 tests/flow/check_xfail_ledger.py \
            --ledger tests/flow/nextgen_index_xfail.txt \
            --results /tmp/nextgen_flow.log
      - name: Upload flow log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextgen-index-flow-log
          path: /tmp/nextgen_flow.log
          retention-days: 7
