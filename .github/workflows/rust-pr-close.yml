name: Rust PR Closed

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    types: [closed]

jobs:
  delete-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Delete the toolchain PR-scoped image on PR close. The toolchain has
      # already been promoted to :latest by rust-push.yml on merge (or never
      # used past the PR if the PR closed without merging), so pr-<N> is no
      # longer referenced by anything.
      #
      # The runtime rc-pr-<N> images (regular + sanitizer) are NOT deleted
      # here: they may still be needed to retag at release time. See
      # .github/workflows/cleanup-rc-images.yml — they're swept by a 30-day
      # cron based on created_at, which is the right horizon for "long enough
      # to cut a release from this PR's content".
      - name: Delete GHCR toolchain PR image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          delete_tag() {
            local repo="$1" tag="$2"
            local vid
            vid=$(gh api -X GET \
              "/orgs/falkordb/packages/container/${repo}/versions?per_page=100" \
              --paginate \
              --jq ".[] | select(.metadata.container.tags[]? == \"${tag}\") | .id" \
              | head -1)
            if [ -n "$vid" ]; then
              echo "deleting ${repo}:${tag} (version id ${vid})"
              gh api -X DELETE \
                "/orgs/falkordb/packages/container/${repo}/versions/${vid}" || true
            else
              echo "no version found for ${repo}:${tag}"
            fi
          }
          # Toolchain image (single tag family — multi-arch manifest + per-arch tags)
          for suffix in "" -x64 -arm64v8; do
            delete_tag falkordb-build "pr-${PR}${suffix}"
          done
