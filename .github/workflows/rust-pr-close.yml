name: Rust PR Closed

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    types: [closed]

jobs:
  delete-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Delete Docker Hub build-image tag (aviavni/falkordb-build:<PR#>)
        run: |
          curl -X DELETE -H "Authorization: Bearer ${{ secrets.DOCKERHUB_TOKEN }}" \
            "https://hub.docker.com/v2/repositories/aviavni/falkordb-build/tags/${{ github.event.pull_request.number }}"

      # Delete the GHCR RC image family pushed by build-rc-image. Each repo
      # carries three tags per PR (bare manifest, -x64, -arm64v8). Versions
      # are addressed by id; we look them up via the package versions API.
      - name: Delete GHCR RC image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for repo in falkordb-next falkordb-next-server; do
            for suffix in "" -x64 -arm64v8; do
              TAG="rc-pr-${PR}${suffix}"
              echo "looking up ${repo}:${TAG}"
              VID=$(gh api -X GET \
                "/orgs/falkordb/packages/container/${repo}/versions?per_page=100" \
                --paginate \
                --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" \
                | head -1)
              if [ -n "$VID" ]; then
                echo "deleting ${repo}:${TAG} (version id ${VID})"
                gh api -X DELETE \
                  "/orgs/falkordb/packages/container/${repo}/versions/${VID}" || true
              else
                echo "no version found for ${repo}:${TAG}"
              fi
            done
          done
