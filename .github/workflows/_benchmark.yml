# Reusable workflow: run the FalkorDB-vs-FalkorDB benchmark across one or more
# dataset sizes and two or three variants, then publish to GitHub Pages.
#
#   A/B   — canonical main-branch trend (C engine `edge` vs Rust `edge-rs`).
#   A/B/C — a PR run, where C is the PR's `rc-pr-<N>` image, so B→C is exactly
#           the PR's impact and A/C compares it to the C engine.
#
# Shape: one `benchmark` job fanned out over `sizes` (a JSON array) — each leg
# runs on a size-appropriate Larger Runner (large → 16-cores, else 8-cores) and
# uploads a per-size summary. A single `merge` job then publishes the dashboard
# once and upserts one PR comment covering every size, so concurrent gh-pages
# writers and comment pile-ups can't happen.
#
# Called by:
#   - benchmark.yml   (PR `benchmark` label / `/benchmark` / manual dispatch)
#   - rust-push.yml   (canonical trend, after `edge-rs` promotion on merge)
#
# Prerequisite: `ubuntu-latest-8-cores` and (for large) `ubuntu-latest-16-cores`
# Larger Runners must be provisioned for the org.
name: A/B/C benchmark (reusable)

on:
  workflow_call:
    inputs:
      image_a:
        description: "Variant A full image ref (baseline C engine)"
        required: true
        type: string
      image_b:
        description: "Variant B full image ref (published Rust)"
        required: true
        type: string
      image_c:
        description: "Variant C full image ref (the PR image); empty for a two-variant run"
        required: false
        type: string
        default: ""
      name_a:
        description: "Label for variant A"
        required: false
        type: string
        default: "falkordb-c"
      name_b:
        description: "Label for variant B"
        required: false
        type: string
        default: "falkordb-rs"
      name_c:
        description: "Label for variant C"
        required: false
        type: string
        default: "falkordb-pr"
      view:
        description: "Slugified view name (branch slug, or 'main' for the canonical trend)"
        required: true
        type: string
      is_canonical:
        description: "true only for the main-branch trend; publishes to gh-pages root /benchmark/ (unbounded history) instead of /benchmark/branch/<view>/"
        required: false
        type: boolean
        default: false
      sizes:
        description: 'JSON array of dataset sizes, e.g. ["small","medium","large"]'
        required: false
        type: string
        default: '["small"]'
      pr_number:
        description: "PR number to comment on (empty for non-PR runs)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # FalkorDB/benchmark rarely tags; pin to a commit validated against
  # patch-ui.sh (static export + basePath). Bump deliberately and re-verify.
  BENCHMARK_REPO: FalkorDB/benchmark
  BENCHMARK_REF: 0cc0e9ee45464b9cb8d71732f419e4e0c8ebdacc

jobs:
  # One leg per dataset size, each on a size-appropriate runner. Legs are
  # independent (fail-fast off) and only produce a per-size summary artifact —
  # publishing happens once, later, in `merge`.
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(inputs.sizes) }}
    runs-on: ${{ matrix.size == 'large' && 'ubuntu-latest-16-cores' || 'ubuntu-latest-8-cores' }}
    # large loads 30.6M edges × 3 variants sequentially — give it a much higher
    # ceiling than the quick small/medium legs.
    timeout-minutes: ${{ matrix.size == 'large' && 330 || 90 }}
    permissions:
      contents: read
    steps:
      - name: Checkout this repo (scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout FalkorDB/benchmark@${{ env.BENCHMARK_REF }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark-tool
          persist-credentials: false

      - run: rustup default stable
      - name: Install protobuf-compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: benchmark-tool

      - name: Run benchmark (${{ matrix.size }})
        env:
          IMAGE_A: ${{ inputs.image_a }}
          IMAGE_B: ${{ inputs.image_b }}
          IMAGE_C: ${{ inputs.image_c }}
          NAME_A: ${{ inputs.name_a }}
          NAME_B: ${{ inputs.name_b }}
          NAME_C: ${{ inputs.name_c }}
          DATASET_SIZE: ${{ matrix.size }}
          BENCHMARK_DIR: ${{ github.workspace }}/benchmark-tool
          RESULTS_DIR: ${{ runner.temp }}/results-ab
          OUT_JSON: ${{ runner.temp }}/summary-${{ matrix.size }}.json
        run: .github/scripts/benchmark/run-ab.sh

      - name: Upload per-size summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-summary-${{ inputs.view }}-${{ matrix.size }}
          path: ${{ runner.temp }}/summary-${{ matrix.size }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-results-${{ inputs.view }}-${{ matrix.size }}
          path: ${{ runner.temp }}/results-ab
          if-no-files-found: warn
          retention-days: 30

  # Collect every size's summary, publish the dashboard once, and upsert one
  # all-sizes PR comment. Runs even if a leg failed (publishes what succeeded);
  # no-ops if nothing was produced.
  merge:
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this repo (scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout gh-pages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout FalkorDB/benchmark@${{ env.BENCHMARK_REF }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark-tool
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Download per-size summaries
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bench-summary-${{ inputs.view }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/summaries

      - name: Publish dashboard and comment
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIEW: ${{ inputs.view }}
          IS_CANONICAL: ${{ inputs.is_canonical }}
          UI_DIR: ${{ github.workspace }}/benchmark-tool/ui
          GH_PAGES_DIR: ${{ github.workspace }}/gh-pages
          PR_NUMBER: ${{ inputs.pr_number }}
          NAME_A: ${{ inputs.name_a }}
          NAME_B: ${{ inputs.name_b }}
          NAME_C: ${{ inputs.name_c }}
          DL: ${{ runner.temp }}/summaries
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Largest size present becomes the published dashboard (most
          # differentiated A/B/C); the comment still covers every size.
          primary=""
          for sz in small medium large; do
            [ -f "$DL/summary-$sz.json" ] && primary="$sz"
          done
          if [ -z "$primary" ]; then
            echo "no summaries produced by any leg — nothing to publish"
            exit 0
          fi
          echo "primary dashboard size: $primary"

          epoch=$(date +%s)
          mkdir -p "$RUNNER_TMP/pub"
          cp "$DL/summary-$primary.json" "$RUNNER_TMP/pub/falkordb_vs_falkordb_$epoch.json"

          export SUMMARY_JSON="$RUNNER_TMP/pub/falkordb_vs_falkordb_$epoch.json"
          export ABC_SUMMARIES_DIR="$DL"   # all per-size summaries → the impact page (PR views)
          .github/scripts/benchmark/publish.sh | tee "$RUNNER_TMP/publish.log"
          published_url=$(grep -o 'RESULT: published_url=.*' "$RUNNER_TMP/publish.log" | tail -n1 | sed 's/RESULT: published_url=//')

          if [ -z "$PR_NUMBER" ]; then
            echo "no PR to comment on"
            exit 0
          fi

          args=()
          for sz in small medium large; do
            f="$DL/summary-$sz.json"
            [ -f "$f" ] && args+=(--summary "$sz:$f")
          done

          BODY="$RUNNER_TMP/pr-comment.md"
          python3 .github/scripts/benchmark/format-summary.py "${args[@]}" \
            --view "$VIEW" --published-url "$published_url" \
            --name-a "$NAME_A" --name-b "$NAME_B" --name-c "$NAME_C" > "$BODY"

          # Upsert one benchmark comment per PR (marker-identified).
          MARKER="<!-- ab-benchmark-comment -->"
          { echo "$MARKER"; cat "$BODY"; } > "$BODY.marked"
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$BODY.marked"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY.marked"
          fi
