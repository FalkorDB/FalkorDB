# Reusable workflow: run the FalkorDB-vs-FalkorDB benchmark across one or more
# dataset sizes and two or three variants, then publish to GitHub Pages.
#
#   A/B   — canonical main-branch trend (C engine `edge` vs Rust `edge-rs`).
#   A/B/C — a PR run, where C is the PR's `rc-pr-<N>` image, so B→C is exactly
#           the PR's impact and A/C compares it to the C engine.
#
# Shape, fanned out over `sizes` (a JSON array), per size:
#   create-runners  → spin up an ephemeral self-hosted GCE VM runner, sized for
#                     the dataset (large gets more cores).
#   benchmark       → run A/B/C on that VM (Docker + the benchmark CLI).
#   cleanup-runners → tear the VM down (the create action also auto-deletes it
#                     after 6h as a backstop).
# A single `merge` job then publishes the dashboard once and upserts one PR
# comment covering every size, so concurrent gh-pages writers and comment
# pile-ups can't happen.
#
# Called by:
#   - benchmark.yml   (PR `benchmark` label / `/benchmark` / manual dispatch)
#   - rust-push.yml   (canonical trend, after `edge-rs` promotion on merge)
#
# Runners are self-hosted GCE VMs (no GitHub larger runners), mirroring
# FalkorDB/FalkorDB. Prerequisites, all available to this repo (org-level is
# fine — callers pass `secrets: inherit`): secrets GH_SA_TOKEN, GCP_SA_KEY,
# GCP_PROJECT_ID; var GCP_ZONES; and the `gh-runner` GCP network.
name: A/B/C benchmark (reusable)

on:
  workflow_call:
    inputs:
      image_a:
        description: "Variant A full image ref (baseline C engine)"
        required: true
        type: string
      image_b:
        description: "Variant B full image ref (published Rust)"
        required: true
        type: string
      image_c:
        description: "Variant C full image ref (the PR image); empty for a two-variant run"
        required: false
        type: string
        default: ""
      name_a:
        description: "Label for variant A"
        required: false
        type: string
        default: "falkordb-c"
      name_b:
        description: "Label for variant B"
        required: false
        type: string
        default: "falkordb-rs"
      name_c:
        description: "Label for variant C"
        required: false
        type: string
        default: "falkordb-pr"
      view:
        description: "Slugified view name (branch slug, or 'main' for the canonical trend)"
        required: true
        type: string
      is_canonical:
        description: "true only for the main-branch trend; publishes to gh-pages root /benchmark/ (unbounded history) instead of /benchmark/branch/<view>/"
        required: false
        type: boolean
        default: false
      sizes:
        description: 'JSON array of dataset sizes, e.g. ["small","medium","large"]'
        required: false
        type: string
        default: '["small"]'
      pr_number:
        description: "PR number to comment on (empty for non-PR runs)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  # FalkorDB/benchmark rarely tags; pin to a commit validated against
  # patch-ui.sh (static export + basePath). Bump deliberately and re-verify.
  BENCHMARK_REPO: FalkorDB/benchmark
  BENCHMARK_REF: 0cc0e9ee45464b9cb8d71732f419e4e0c8ebdacc

jobs:
  # One ephemeral GCE VM per dataset size, labelled uniquely for this run so the
  # matching benchmark leg lands on it and cleanup can find it. large gets more
  # cores for the 30.6M-edge load.
  create-runners:
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(inputs.sizes) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create GCE runner (${{ matrix.size }})
        uses: FalkorDB/gce-github-runner@0caf8406cd6353630fcd0b2eade420d3da124e01 # installs Docker
        with:
          token: ${{ secrets.GH_SA_TOKEN }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          machine_zones: ${{ vars.GCP_ZONES }}
          machine_type: ${{ matrix.size == 'large' && 'n4-highcpu-16' || 'n4-highcpu-8' }}
          network: gh-runner
          runner_label: bench-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.size }}

  # Each leg runs on its own VM (runs-on = the label created above). The VM has
  # Docker but not Rust/git — install those. The runner runs as root, so no sudo.
  benchmark:
    needs: create-runners
    strategy:
      fail-fast: false
      matrix:
        size: ${{ fromJSON(inputs.sizes) }}
    runs-on: bench-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.size }}
    timeout-minutes: ${{ matrix.size == 'large' && 330 || 120 }}
    permissions:
      contents: read
    steps:
      - name: Install toolchain deps
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config libssl-dev protobuf-compiler

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout this repo (scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout FalkorDB/benchmark@${{ env.BENCHMARK_REF }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark-tool
          persist-credentials: false

      - name: Run benchmark (${{ matrix.size }})
        env:
          IMAGE_A: ${{ inputs.image_a }}
          IMAGE_B: ${{ inputs.image_b }}
          IMAGE_C: ${{ inputs.image_c }}
          NAME_A: ${{ inputs.name_a }}
          NAME_B: ${{ inputs.name_b }}
          NAME_C: ${{ inputs.name_c }}
          DATASET_SIZE: ${{ matrix.size }}
          BENCHMARK_DIR: ${{ github.workspace }}/benchmark-tool
          RESULTS_DIR: ${{ runner.temp }}/results-ab
          OUT_JSON: ${{ runner.temp }}/summary-${{ matrix.size }}.json
        run: .github/scripts/benchmark/run-ab.sh

      - name: Upload per-size summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-summary-${{ inputs.view }}-${{ matrix.size }}
          path: ${{ runner.temp }}/summary-${{ matrix.size }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-results-${{ inputs.view }}-${{ matrix.size }}
          path: ${{ runner.temp }}/results-ab
          if-no-files-found: warn
          retention-days: 30

  # Tear down each size's VM once its benchmark leg ends (success, failure, or
  # cancel). The create action's 6h auto-delete is the backstop; the cleanup
  # action treats a never-created VM as a no-op.
  cleanup-runners:
    needs: benchmark
    if: always()
    strategy:
      matrix:
        size: ${{ fromJSON(inputs.sizes) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/cleanup-runner
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          instance_label: bench-${{ github.run_id }}-${{ github.run_number }}-${{ matrix.size }}

  # Collect every size's summary, publish the dashboard once, and upsert one
  # all-sizes PR comment. Runs even if a leg failed (publishes what succeeded);
  # no-ops if nothing was produced.
  merge:
    needs: benchmark
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout this repo (scripts)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout gh-pages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout FalkorDB/benchmark@${{ env.BENCHMARK_REF }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ env.BENCHMARK_REPO }}
          ref: ${{ env.BENCHMARK_REF }}
          path: benchmark-tool
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Download per-size summaries
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bench-summary-${{ inputs.view }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/summaries

      - name: Publish dashboard and comment
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIEW: ${{ inputs.view }}
          IS_CANONICAL: ${{ inputs.is_canonical }}
          UI_DIR: ${{ github.workspace }}/benchmark-tool/ui
          GH_PAGES_DIR: ${{ github.workspace }}/gh-pages
          PR_NUMBER: ${{ inputs.pr_number }}
          NAME_A: ${{ inputs.name_a }}
          NAME_B: ${{ inputs.name_b }}
          NAME_C: ${{ inputs.name_c }}
          DL: ${{ runner.temp }}/summaries
          RUNNER_TMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # Largest size present becomes the published dashboard (most
          # differentiated A/B/C); the comment still covers every size.
          primary=""
          for sz in small medium large; do
            [ -f "$DL/summary-$sz.json" ] && primary="$sz"
          done
          if [ -z "$primary" ]; then
            echo "no summaries produced by any leg — nothing to publish"
            exit 0
          fi
          echo "primary dashboard size: $primary"

          epoch=$(date +%s)
          mkdir -p "$RUNNER_TMP/pub"
          cp "$DL/summary-$primary.json" "$RUNNER_TMP/pub/falkordb_vs_falkordb_$epoch.json"

          export SUMMARY_JSON="$RUNNER_TMP/pub/falkordb_vs_falkordb_$epoch.json"
          export ABC_SUMMARIES_DIR="$DL"   # all per-size summaries → the impact page (PR views)
          .github/scripts/benchmark/publish.sh | tee "$RUNNER_TMP/publish.log"
          published_url=$(grep -o 'RESULT: published_url=.*' "$RUNNER_TMP/publish.log" | tail -n1 | sed 's/RESULT: published_url=//')

          if [ -z "$PR_NUMBER" ]; then
            echo "no PR to comment on"
            exit 0
          fi

          args=()
          for sz in small medium large; do
            f="$DL/summary-$sz.json"
            [ -f "$f" ] && args+=(--summary "$sz:$f")
          done

          BODY="$RUNNER_TMP/pr-comment.md"
          python3 .github/scripts/benchmark/format-summary.py "${args[@]}" \
            --view "$VIEW" --published-url "$published_url" \
            --name-a "$NAME_A" --name-b "$NAME_B" --name-c "$NAME_C" > "$BODY"

          # Upsert one benchmark comment per PR (marker-identified).
          MARKER="<!-- ab-benchmark-comment -->"
          { echo "$MARKER"; cat "$BODY"; } > "$BODY.marked"
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$BODY.marked"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$BODY.marked"
          fi
