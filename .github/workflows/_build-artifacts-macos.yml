# Reusable workflow: build the falkordb shared library natively on macOS arm64
# and upload it as `falkordb-<suffix>.so`. Separate from _build-artifacts.yml
# because hosted macOS runners have no Docker — this is a native cargo build,
# not a `docker build --target artifact`. The produced Mach-O dylib is renamed
# to the C-parity `.so` name (Redis loads modules by path, extension-agnostic).
#
# The build mirrors the proven native-macOS setup from #551 (brew toolchain +
# the CC/CXX-driven native-deps recipes + static Homebrew libomp), but
# only the artifact-producing steps — no test suites.

name: Build artifacts macOS (reusable)

on:
  workflow_call:
    inputs:
      revision:
        description: "Git revision (commit SHA) to check out and build"
        required: true
        type: string
      trusted_revision:
        description: >-
          Whether `revision` is already-reviewed code (release tags, the default
          branch, a maintainer dispatch). Defaults to FALSE — a caller must opt
          in — so a caller that forwards a pull-request head is untrusted by
          construction. Untrusted builds never WRITE a cache, which is what keeps
          a PR build from poisoning the native deps / Rust artefacts a later
          release build restores.
        required: false
        type: boolean
        default: false
      suffix:
        description: "Asset suffix → falkordb-<suffix>.so"
        required: false
        type: string
        default: "macos-arm64v8"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Static-link Homebrew libomp.a (keeps the .so self-contained for OpenMP,
      # matching the Linux single-.so contract). graph/build.rs links static
      # when ${LIBOMP_PREFIX}/lib/libomp.a exists.
      LIBOMP_PREFIX: /opt/homebrew/opt/libomp
      # Workspace-local native-deps cache (no sudo; cacheable). Both the
      # `ensure` step and graph/build.rs read it from here.
      FALKORDB_DEPS_CACHE: ${{ github.workspace }}/.deps/native-deps
    steps:
      # This job compiles caller-supplied code that may come from a pull request.
      # `persist-credentials: false` keeps no GITHUB_TOKEN on disk, `permissions`
      # is read-only, callers pass no secrets, and every cache WRITE below is
      # gated on `trusted_revision` so an untrusted build cannot seed artefacts
      # that a later release build restores.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # native-deps builds the submodules in-place and never clones, so
          # they must be checked out here.
          submodules: recursive
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Install Homebrew build deps
        run: brew install cmake llvm libomp openssl@3

      - name: Export Homebrew LLVM into PATH/CC/CXX
        run: |
          set -euo pipefail
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin"             >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang"    >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install Rust stable
        run: rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "macos-artifact-release"
          # Untrusted revisions restore the cache but never save it.
          save-if: ${{ inputs.trusted_revision }}

      # Hosted macOS has no Docker toolchain image, so build the three deps
      # from source and cache them.
      #
      # The key comes from native-deps itself rather than a hand-rolled
      # hashFiles(): `key --all --combined` hashes exactly what the artefacts
      # are ABI-tied to -- submodule revisions, the GB_control patch, the
      # vendored PreJIT kernels, the recipe sources, $CC/$CXX --version, the
      # target triple and the OpenMP flavour. That subsumes the old
      # hashFiles(scripts) + explicit RediSearch pin + BREW_LLVM_VERSION trio,
      # and cannot drift out of step with what actually goes into the build.
      - name: Compute the native-deps cache key
        id: deps-key
        run: echo "key=$(cargo run -q --offline --manifest-path native-deps/Cargo.toml -- key --all --combined)" >> "$GITHUB_OUTPUT"

      - name: Restore native deps
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .deps/native-deps
          key: macos-native-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.deps-key.outputs.key }}

      - name: Build GraphBLAS + LAGraph + RediSearch
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: cargo run --offline --manifest-path native-deps/Cargo.toml -- ensure --all

      - name: Save native deps
        # Only a trusted revision may WRITE this cache. The recipes come from
        # the checked-out tree, so on a PR build their output is
        # attacker-controlled and must never be published for a later release
        # build to restore.
        if: ${{ inputs.trusted_revision && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .deps/native-deps
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build libfalkordb.dylib
        run: cargo build --release

      - name: Stage + validate + checksum
        env:
          SUFFIX: ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          test -f target/release/libfalkordb.dylib || { echo "::error::target/release/libfalkordb.dylib missing"; exit 1; }
          mkdir -p dist
          cp target/release/libfalkordb.dylib "dist/falkordb-${SUFFIX}.so"
          echo "=== otool -L (the FalkorDB static deps must NOT appear as dynamic) ==="
          otool -L "dist/falkordb-${SUFFIX}.so"
          if otool -L "dist/falkordb-${SUFFIX}.so" | grep -E 'libomp|libgraphblas|liblagraph|liblagraphx|libredisearch|libVectorSimilarity'; then
            echo "::error::forbidden dynamic dependency in macOS .so (single-.so contract violated)"; exit 1
          fi
          ( cd dist && shasum -a 256 "falkordb-${SUFFIX}.so" > "falkordb-${SUFFIX}.so.sha256" )
          echo "Built falkordb-${SUFFIX}.so ($(du -h "dist/falkordb-${SUFFIX}.so" | cut -f1))"
          cat "dist/falkordb-${SUFFIX}.so.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: falkordb-${{ inputs.suffix }}.so
          path: dist/falkordb-${{ inputs.suffix }}.so*
          retention-days: 7
          compression-level: 0
