name: Flow tests (sanitizer)

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: asan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Detect a build/Dockerfile change so the rest of the workflow knows whether
  # to (a) rebuild the toolchain image at pr-<N> and (b) use that pr-<N>
  # toolchain for the runtime build + the test container. Same pattern as
  # rust-pr.yml so PR validation always runs against the same toolchain bytes.
  check-files:
    runs-on: ubuntu-latest
    outputs:
      file_changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # workflow_dispatch path: no PR diff, fall through to "false" and
          # the rest of the workflow uses :latest.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q "build/Dockerfile"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # When build/Dockerfile changed, rebuild the toolchain at pr-<N>. Shares
  # the concurrency group with rust-pr.yml's `docker` job (group key =
  # build-toolchain-pr-<N>), so the two callers serialize and the second one
  # is a no-op against the just-pushed registry cache.
  docker:
    needs: check-files
    if: needs.check-files.outputs.file_changed == 'true'
    uses: ./.github/workflows/build-toolchain.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: pr-${{ github.event.pull_request.number }}

  # Resolve the image tag once so build + tests reference the same name.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - id: derive
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_NUMBER" ]; then
            echo "tag=rc-pr-${PR_NUMBER}-asan" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=${GH_SHA:0:7}
            echo "tag=manual-${SHORT_SHA}-asan" >> "$GITHUB_OUTPUT"
          fi

  # Build the sanitizer runtime image (amd64-only). Pushes to GHCR; runtime
  # tests below pull it as a services container. Replaces the artifact-based
  # asan-build → upload → download dance. When the toolchain was rebuilt
  # this PR (build/Dockerfile changed), point Dockerfile.asan at the PR's
  # toolchain so the sanitizer .so reflects those changes too.
  build-rc-asan-image:
    needs: [check-files, docker, prepare]
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sanitizer image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: build/runtime/Dockerfile.asan
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_IMAGE=${{ needs.check-files.outputs.file_changed == 'true' && format('ghcr.io/falkordb/falkordb-build:pr-{0}', github.event.pull_request.number) || 'ghcr.io/falkordb/falkordb-build:latest' }}
          tags: ghcr.io/falkordb/falkordb:${{ needs.prepare.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/falkordb/falkordb:buildcache-asan
          cache-to:   type=registry,ref=ghcr.io/falkordb/falkordb:buildcache-asan,mode=max

  flow-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Generate test matrix
        id: set-matrix
        run: |
          echo "test_files=$(jq -Rc '[., inputs] | map(select(length > 0))' flow_tests_done.txt)" >> $GITHUB_OUTPUT

  asan-flow-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:${{ needs.check-files.outputs.file_changed == 'true' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}
    timeout-minutes: 60
    needs: [check-files, docker, prepare, build-rc-asan-image, flow-test-matrix]
    if: ${{ !cancelled() && (needs.docker.result == 'success' || needs.docker.result == 'skipped') && needs.build-rc-asan-image.result == 'success' && needs.flow-test-matrix.result == 'success' }}
    permissions:
      contents: read
      packages: read
    services:
      falkordb:
        image: ghcr.io/falkordb/falkordb:${{ needs.prepare.outputs.tag }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["6379:6379"]
        # ASAN env defaults are baked into the image; override here only the
        # log_path knob (it has to reference the runner workspace, which the
        # image can't know about at build time).
        env:
          ASAN_OPTIONS: "detect_leaks=1:detect_odr_violation=0:halt_on_error=0:abort_on_error=0:symbolize=1:print_stacktrace=1:strict_string_checks=1:detect_stack_use_after_return=1:log_path=/tmp/asan-logs/asan:log_exe_name=1"
    env:
      SANITIZER: address
      EXISTING_ENV: "1"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # ASAN flow tests serialize against the single service-container redis;
      # flow.sh's EXISTING_ENV branch already forces --parallelism 1.
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.flow-test-matrix.outputs.test_files) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run flow test - ${{ matrix.test_file }}
        env:
          TEST_FILE: ${{ matrix.test_file }}
        run: |
          . /data/venv/bin/activate
          TEST="$TEST_FILE" FAIL_FAST=1 ./flow.sh

      - name: Collect ASAN logs from service container
        if: failure()
        env:
          FALKORDB_CID: ${{ job.services.falkordb.id }}
        run: |
          # ASAN_OPTIONS.log_path inside the service container writes to
          # /tmp/asan-logs/asan.<pid>. Pull them out for the artifact step.
          # `job.services.falkordb.id` is the actual container ID GitHub
          # assigned — robust to multiple containers built from the same image
          # and to image-tag changes.
          mkdir -p tests/flow/logs/asan
          docker cp "${FALKORDB_CID}:/tmp/asan-logs/." tests/flow/logs/asan/ 2>/dev/null || true

      - name: Upload flow test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-flow-logs-${{ strategy.job-index }}
          path: tests/flow/logs/
          retention-days: 7
