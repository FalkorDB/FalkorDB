name: Flow tests (sanitizer)

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: asan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Resolve the image tag once so build + tests reference the same name.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - id: derive
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            echo "tag=rc-pr-${{ github.event.pull_request.number }}-asan" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=manual-${SHORT_SHA}-asan" >> "$GITHUB_OUTPUT"
          fi

  # Build the sanitizer runtime image (amd64-only). Pushes to GHCR; runtime
  # tests below pull it as a services container. Replaces the artifact-based
  # asan-build → upload → download dance.
  build-rc-asan-image:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sanitizer image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: build/runtime/Dockerfile.asan
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/falkordb/falkordb-next:${{ needs.prepare.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/falkordb/falkordb-next:buildcache-asan
          cache-to:   type=registry,ref=ghcr.io/falkordb/falkordb-next:buildcache-asan,mode=max

  flow-test-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Generate test matrix
        id: set-matrix
        run: |
          echo "test_files=$(jq -Rc '[., inputs] | map(select(length > 0))' flow_tests_done.txt)" >> $GITHUB_OUTPUT

  asan-flow-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/falkordb/falkordb-build:latest
    timeout-minutes: 60
    needs: [prepare, build-rc-asan-image, flow-test-matrix]
    permissions:
      contents: read
      packages: read
    services:
      falkordb:
        image: ghcr.io/falkordb/falkordb-next:${{ needs.prepare.outputs.tag }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        ports: ["6379:6379"]
        # ASAN env defaults are baked into the image; override here only the
        # log_path knob (it has to reference the runner workspace, which the
        # image can't know about at build time).
        env:
          ASAN_OPTIONS: "detect_leaks=1:detect_odr_violation=0:halt_on_error=0:abort_on_error=0:symbolize=1:print_stacktrace=1:strict_string_checks=1:detect_stack_use_after_return=1:log_path=/tmp/asan-logs/asan:log_exe_name=1"
    env:
      SANITIZER: address
      EXISTING_ENV: "1"
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      # ASAN flow tests serialize against the single service-container redis;
      # flow.sh's EXISTING_ENV branch already forces --parallelism 1.
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.flow-test-matrix.outputs.test_files) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run flow test - ${{ matrix.test_file }}
        run: |
          . /data/venv/bin/activate
          TEST="${{ matrix.test_file }}" FAIL_FAST=1 ./flow.sh

      - name: Collect ASAN logs from service container
        if: failure()
        run: |
          # ASAN_OPTIONS.log_path inside the service container writes to
          # /tmp/asan-logs/asan.<pid>. Pull them out for the artifact step.
          mkdir -p tests/flow/logs/asan
          docker cp "$(docker ps -q --filter "ancestor=ghcr.io/falkordb/falkordb-next:${{ needs.prepare.outputs.tag }}")":/tmp/asan-logs/. tests/flow/logs/asan/ 2>/dev/null || true

      - name: Upload flow test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: asan-flow-logs-${{ strategy.job-index }}
          path: tests/flow/logs/
          retention-days: 7
