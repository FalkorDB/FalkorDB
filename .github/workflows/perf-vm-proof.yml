# TEMPORARY: proves _perf-vm.yml's pmu input on real VMs (#3979, contract
# v1.6). Removed in a normal commit once the run is in.
name: perf VM proof

on:
  pull_request:
    paths:
      - .github/workflows/_perf-vm.yml
      - .github/workflows/perf-vm-proof.yml
      - tests/perf/vm/**

permissions:
  contents: read
  packages: read

concurrency:
  group: perf-vm-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # A C4 with a vPMU. perf ignores the contract flags it appends to `true`
  # and writes its counts into the artifact.
  pmu:
    uses: ./.github/workflows/_perf-vm.yml
    with:
      check: smoke-pmu
      command: perf stat -x, -o out/perf-stat.csv -e cycles,instructions -- true
      candidate_image: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
      baseline_image: falkordb/falkordb-server@sha256:44eb4a6d48ef6f2b06aeefea46c5f4c17cd2310d3832135be18fd7fc8ba30923
      timeout_minutes: 10
      pmu: true
    secrets: inherit

  # pmu false: unchanged from the earlier proof.
  smoke:
    needs: pmu
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_perf-vm.yml
    with:
      check: smoke
      command: python3 -I $PERF_VM_TOOLS/smoke.py
      candidate_image: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
      baseline_image: falkordb/falkordb-server@sha256:44eb4a6d48ef6f2b06aeefea46c5f4c17cd2310d3832135be18fd7fc8ba30923
      timeout_minutes: 10
    secrets: inherit

  assert:
    needs: [pmu, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-result-smoke*
          path: artifacts

      - name: Authenticate gcloud
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          printf '%s' "$GCP_SA_KEY" | gcloud --quiet auth activate-service-account --key-file=- >/dev/null
          gcloud --quiet config set project "$GCP_PROJECT_ID" >/dev/null

      - name: No VM from this run is left
        run: |
          set -euo pipefail
          left=$(gcloud compute instances list --filter="labels.gh_run_id=${{ github.run_id }}" --format='value(name,zone.basename())')
          if [[ -n $left ]]; then echo "::error::left running: $left"; exit 1; fi
          echo "no VM carries gh_run_id=${{ github.run_id }}"

      - name: Each leg ended as it should
        run: |
          find artifacts -type f | sort
          for f in artifacts/*/perf-vm.json artifacts/perf-result-smoke-pmu/perf-stat.csv; do echo "== $f"; cat "$f"; done
          python3 -I - <<'EOF'
          import json, pathlib, re
          root = pathlib.Path("artifacts")
          problems = []
          def expect(what, got, want):
              print(f"{'ok ' if got == want else 'BAD'} {what}: {got!r}" + ("" if got == want else f" (want {want!r})"))
              if got != want:
                  problems.append(what)

          p = json.loads((root / "perf-result-smoke-pmu" / "perf-vm.json").read_text())
          expect("pmu leg type is C4", p["machine_type"] in ("c4-standard-16", "c4-standard-8"), True)
          expect("pmu leg vPMU", (p["pmu"] or "").upper(), "STANDARD")
          expect("pmu leg probe counted", bool(re.fullmatch(r"cycles=\d+ instructions=\d+", p["pmu_probe"] or "")), True)
          expect("pmu leg exit", p["command_exit"], 0)
          counts = {}
          for line in (root / "perf-result-smoke-pmu" / "perf-stat.csv").read_text().splitlines():
              fields = line.split(",")
              if len(fields) > 2 and fields[2] in ("cycles", "instructions"):
                  counts[fields[2]] = fields[0]
          expect("perf stat counted cycles and instructions",
                 sorted(k for k, v in counts.items() if v.isdigit() and int(v) > 0), ["cycles", "instructions"])

          s = json.loads((root / "perf-result-smoke" / "perf-vm.json").read_text())
          expect("smoke leg type", (s["machine_type"], s["pmu"], s["pmu_probe"]), ("n4-standard-16", None, None))
          expect("smoke leg exit", s["command_exit"], 0)
          r = json.loads((root / "perf-result-smoke" / "result.json").read_text())
          expect("smoke verdict", r["verdict"], "pass")

          if problems:
              raise SystemExit(f"{len(problems)} problem(s): {problems}")
          EOF
