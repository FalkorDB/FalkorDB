# TEMPORARY: proves _perf-vm.yml on real VMs (#3979). Removed before the PR
# is marked ready.
#
# B4: one long leg, cancelled by hand once while the check runs and once
# (on a re-run) while the VM is being created. The VM must be gone after
# each, and the first must still upload perf-vm.json.
name: perf VM proof

on:
  pull_request:
    paths:
      - .github/workflows/_perf-vm.yml
      - .github/workflows/perf-vm-proof.yml
      - tests/perf/vm/**

permissions:
  contents: read
  packages: read

concurrency:
  group: perf-vm-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cancel-me:
    uses: ./.github/workflows/_perf-vm.yml
    with:
      check: smoke-cancel
      command: perl -e sleep(1500) --
      candidate_image: ghcr.io/falkordb/falkordb-server@sha256:95b610a600682533d854b6ece6bddbea80b49d0b89e2cd0b2cf19bd0a8142aed
      baseline_image: falkordb/falkordb-server@sha256:44eb4a6d48ef6f2b06aeefea46c5f4c17cd2310d3832135be18fd7fc8ba30923
      timeout_minutes: 25
    secrets: inherit
