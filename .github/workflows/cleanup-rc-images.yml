name: Cleanup RC images

# Sweeps GHCR `rc-pr-*` runtime image tags older than the TTL window.
#
# RC images live past PR close (rust-pr-close.yml no longer deletes them)
# because they may be retagged into a release tag by release-image.yml's
# release-event flow. 30 days is long enough to cut a release for a PR's
# content but short enough that orphan tags from un-released PRs don't
# accumulate indefinitely.
#
# Triggers: daily cron + workflow_dispatch (manual sweep, e.g. to verify
# logic after editing the filter). The dry-run input lets operators see what
# would be deleted without actually deleting.

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily — offset from the hour to avoid GHA cron lock contention
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates without deleting"
        type: boolean
        default: false
      ttl_days:
        description: "Override TTL window in days"
        type: string
        default: "30"

permissions:
  contents: read

concurrency:
  group: cleanup-rc-images
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # falkordb-build is intentionally NOT in this list — its pr-<N> tags
        # are deleted on PR close by rust-pr-close.yml, so there's nothing to
        # sweep.
        repo: [falkordb, falkordb-server]
    steps:
      - name: Sweep rc-pr-* tags older than TTL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ matrix.repo }}
          TTL_DAYS: ${{ inputs.ttl_days || '30' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          cutoff=$(date -u -d "${TTL_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Sweeping ghcr.io/falkordb/${REPO} versions created before ${cutoff} (TTL=${TTL_DAYS}d)"
          echo "DRY_RUN=${DRY_RUN}"

          # Pull every version's id, tags, and created_at. Then in jq:
          #   - filter by created_at < cutoff
          #   - keep only versions where EVERY tag matches ^rc-pr- (so we never
          #     remove a version that also carries a production tag, e.g. :edge-rs
          #     promoted from rc-pr-<N> — that retag creates a new manifest with
          #     a different created_at, but be defensive anyway)
          #   - drop untagged versions (those are layer remnants, separate concern)
          #
          # `tags|length > 0` excludes untagged versions. `all(test("^rc-pr-"))`
          # is the safety check above.
          candidates=$(gh api \
            -X GET "/orgs/falkordb/packages/container/${REPO}/versions?per_page=100" \
            --paginate \
            --jq "
              .[]
              | select(.created_at < \"${cutoff}\")
              | select(.metadata.container.tags | length > 0)
              | select(.metadata.container.tags | all(test(\"^rc-pr-\")))
              | {id: .id, tags: .metadata.container.tags, created: .created_at}
            ")

          if [ -z "$candidates" ]; then
            echo "Nothing to sweep."
            exit 0
          fi

          echo "$candidates" | jq -c '.' | while read -r row; do
            vid=$(echo "$row" | jq -r '.id')
            tags=$(echo "$row" | jq -r '.tags | join(",")')
            created=$(echo "$row" | jq -r '.created')
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] would delete ${REPO} version ${vid} created=${created} tags=[${tags}]"
            else
              echo "deleting ${REPO} version ${vid} created=${created} tags=[${tags}]"
              gh api -X DELETE "/orgs/falkordb/packages/container/${REPO}/versions/${vid}" || true
            fi
          done
