# Reusable workflow: build the falkordb shared library (.so) for every release
# platform and upload each published one as a workflow artifact. BUILD ONLY —
# it never uploads to a GitHub Release. Callers: release-tag.yml (the release,
# which then publishes what this built) and build-artifacts.yml (pre-release
# verification).
#
# The platform list below is the ONLY one: callers pick from it by suffix and
# never carry their own copy. New platforms (see #608) are added here.
#
# Each cell extracts the .so from the `artifact` target of its Dockerfile (for
# x64/arm64v8, the exact .so the runtime image ships) and, unless the cell is
# `publish: false`, uploads it as `falkordb-<suffix>.so` together with its
# `.sha256`. Cells are independent (fail-fast: false) and run on native runners
# (no QEMU) for maximum parallelism.
#
# Cells marked `image` (rhel9, amazonlinux2023, alpine) also build their
# Dockerfile's `server` target once for each server in `servers`: the
# falkordb-server images for that OS and architecture, each holding the same
# .so. Each is started to check that the module loads and answers a query.
# With `export_images` they are uploaded too, as one artifact per cell,
# `image-falkordb-server-<suffix>`, holding
# `falkordb-server-<os>-<server>-<arch>.tar` per server, for the release to
# push as multi-arch `<version>-<os>-<server>` tags. x64/arm64v8 have no such
# step: the merge queue builds the Debian images.
#
# Cells marked `publish: false` (alpine) are built and smoke-tested like any
# other, but upload nothing and are left out of the `suffixes`/`image_suffixes`
# outputs, so a release does not ship them. With the caller's
# `tolerate_unpublished_failures` (the release sets it) their failure does not
# fail this workflow either: a release still waits for them to finish, but is
# not stopped by one that fails. Otherwise (pull requests, manual runs) they
# fail it like any other cell.

name: Build artifacts (reusable)

on:
  workflow_call:
    inputs:
      platforms:
        description: >-
          Comma-separated platform suffixes to build (e.g. 'x64,arm64v8'), or
          'all'. A suffix that is not in the platform list is an error.
        required: false
        type: string
        default: all
      revision:
        description: "Git revision (commit SHA) to check out and build"
        required: true
        type: string
      trusted_revision:
        description: >-
          Whether `revision` is already-reviewed code (release tags, the default
          branch, a maintainer dispatch). Defaults to FALSE — a caller must opt
          in — so a caller that forwards a pull-request head is untrusted by
          construction. Untrusted builds never WRITE a build cache, which is what
          keeps a PR build from poisoning the layers a later release build reuses.
        required: false
        type: boolean
        default: false
      export_images:
        description: >-
          Upload the per-OS server images as workflow artifacts (the release
          pushes them, and requires every one build/publish_tags.py lists).
          Without it they are built and tested, then dropped.
        required: false
        type: boolean
        default: false
      tolerate_unpublished_failures:
        description: >-
          Do not fail the workflow when a `publish: false` cell fails (the
          release sets this so an unpublished cell cannot block what ships).
          Defaults to FALSE: pull-request and manual verification stay strict.
        required: false
        type: boolean
        default: false
    outputs:
      suffixes:
        description: >-
          JSON array of the published suffixes this run built (cells with
          `publish: false` are built but not listed). The release's publish
          step requires an artifact for every one of them.
        value: ${{ jobs.cells.outputs.suffixes }}

jobs:
  cells:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      cells: ${{ steps.select.outputs.cells }}
      suffixes: ${{ steps.select.outputs.suffixes }}
    steps:
      - name: Select platforms
        id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          # {suffix, arch, platform, runner, dockerfile, build_image, cxx, image, servers, publish}.
          # `dockerfile` provides the `artifact` target; `build_image` is the
          # chef/builder base (Debian toolchain image) or "" for self-contained
          # per-OS Dockerfiles; `cxx` is the C++ compiler passed to the builder;
          # `image` says the Dockerfile's `server` target is built here too,
          # once per server in `servers` (empty unless `image`). The per-OS
          # images a release publishes are build/publish_tags.py's PER_OS, on
          # both architectures; its tests check this list builds exactly those.
          # `publish`: publish:false cells build and smoke-test but upload
          # nothing, because release-tag.yml uploads every falkordb-*.so
          # artifact; dropping them from `suffixes` alone would not keep them
          # out of a release. Setting it back to true brings back both uploads
          # and the output. It is a boolean on every cell (checked below):
          # GitHub expressions treat a missing key as equal to false.
          ALL='[
            {"suffix":"x64","arch":"x64","platform":"linux/amd64","runner":"ubuntu-latest","dockerfile":"build/runtime/Dockerfile","build_image":"ghcr.io/falkordb/falkordb-build:latest","cxx":"clang++-23","image":false,"servers":[],"publish":true},
            {"suffix":"arm64v8","arch":"arm64v8","platform":"linux/arm64","runner":"ubuntu-24.04-arm","dockerfile":"build/runtime/Dockerfile","build_image":"ghcr.io/falkordb/falkordb-build:latest","cxx":"clang++-23","image":false,"servers":[],"publish":true},
            {"suffix":"rhel9-x64","arch":"x64","platform":"linux/amd64","runner":"ubuntu-latest","dockerfile":"build/runtime/Dockerfile.rhel9","build_image":"","cxx":"clang++","image":true,"servers":["redis"],"publish":true},
            {"suffix":"rhel9-arm64v8","arch":"arm64v8","platform":"linux/arm64","runner":"ubuntu-24.04-arm","dockerfile":"build/runtime/Dockerfile.rhel9","build_image":"","cxx":"clang++","image":true,"servers":["redis"],"publish":true},
            {"suffix":"amazonlinux2023-x64","arch":"x64","platform":"linux/amd64","runner":"ubuntu-latest","dockerfile":"build/runtime/Dockerfile.amazonlinux2023","build_image":"","cxx":"clang++-19","image":true,"servers":["redis","valkey"],"publish":true},
            {"suffix":"amazonlinux2023-arm64v8","arch":"arm64v8","platform":"linux/arm64","runner":"ubuntu-24.04-arm","dockerfile":"build/runtime/Dockerfile.amazonlinux2023","build_image":"","cxx":"clang++-19","image":true,"servers":["redis","valkey"],"publish":true},
            {"suffix":"alpine-x64","arch":"x64","platform":"linux/amd64","runner":"ubuntu-latest","dockerfile":"build/runtime/Dockerfile.alpine","build_image":"","cxx":"clang++","image":true,"servers":["valkey"],"publish":true},
            {"suffix":"alpine-arm64v8","arch":"arm64v8","platform":"linux/arm64","runner":"ubuntu-24.04-arm","dockerfile":"build/runtime/Dockerfile.alpine","build_image":"","cxx":"clang++","image":true,"servers":["valkey"],"publish":true}
          ]'
          NOT_BOOL=$(printf '%s' "$ALL" | jq -r '[ .[] | select((.publish | type) != "boolean") | .suffix ] | join(",")')
          if [ -n "$NOT_BOOL" ]; then
            echo "::error::cells without a boolean \"publish\": $NOT_BOOL"
            exit 1
          fi
          BAD_SERVERS=$(printf '%s' "$ALL" | jq -r '[ .[] | select((.servers | type) != "array" or (.servers | length > 0) != .image or any(.servers[]; . != "redis" and . != "valkey")) | .suffix ] | join(",")')
          if [ -n "$BAD_SERVERS" ]; then
            echo "::error::cells whose \"servers\" is not redis/valkey for an image cell, or empty otherwise: $BAD_SERVERS"
            exit 1
          fi
          if [ -z "${PLATFORMS// /}" ] || [ "$PLATFORMS" = "all" ]; then
            CELLS=$(printf '%s' "$ALL" | jq -c .)
          else
            WANT=$(printf '%s' "$PLATFORMS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | jq -R . | jq -s -c .)
            UNKNOWN=$(jq -rn --argjson all "$ALL" --argjson want "$WANT" '$want - [ $all[].suffix ] | join(",")')
            if [ -n "$UNKNOWN" ]; then
              echo "::error::unknown platform(s): $UNKNOWN (known: $(printf '%s' "$ALL" | jq -r '[ .[].suffix ] | join(",")'))"
              exit 1
            fi
            CELLS=$(printf '%s' "$ALL" | jq -c --argjson want "$WANT" '[ .[] | select(.suffix as $s | $want | index($s)) ]')
          fi
          SUFFIXES=$(printf '%s' "$CELLS" | jq -c '[ .[] | select(.publish) | .suffix ]')
          {
            echo "cells=$CELLS"
            echo "suffixes=$SUFFIXES"
          } >> "$GITHUB_OUTPUT"
          echo "Building: $(printf '%s' "$CELLS" | jq -c '[ .[].suffix ]') (published: $SUFFIXES; server images: $(printf '%s' "$CELLS" | jq -c '[ .[] | .suffix as $s | .servers[] | "\($s):\(.)" ]'))"

  build:
    needs: cells
    runs-on: ${{ matrix.runner }}
    # With `tolerate_unpublished_failures` (the release), a cell that is not
    # published cannot fail the workflow, so it cannot keep a release from
    # shipping the cells that are. Callers that do not opt in (pull-request and
    # manual verification) stay strict.
    continue-on-error: ${{ !matrix.publish && inputs.tolerate_unpublished_failures }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.cells.outputs.cells) }}
    steps:
      # `persist-credentials: false` + read-only `permissions` (above) keep this
      # safe even though it builds caller-supplied (potentially PR) code: no
      # GITHUB_TOKEN is left on disk and the job cannot write anything. Callers
      # do not pass `secrets: inherit`, so no custom secrets reach the build.
      # The remaining cross-run risk — an untrusted build writing a cache that a
      # later trusted build consumes — is closed by the `trusted_revision` gate
      # on `cache-to` below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # native-deps builds the submodules in-place and never clones them,
          # and the Dockerfile COPYs that source in, so the build
          # context must carry it.
          submodules: recursive
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the `artifact` stage and export just the .so to artifact-out/.
      # The Dockerfile's `builder` stage enforces the single-.so self-containment
      # contract (no dynamic libomp/graphblas/redisearch deps; OpenMP static), so
      # a successful build is also the authoritative dependency check — run in the
      # correct target-arch context, unlike a host-side ldd.
      - name: Build falkordb-${{ matrix.suffix }}.so
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          # Don't upload the buildx build-record (.dockerbuild) artifact — keep
          # the run's artifact list (and the release asset set) to just the .so.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: artifact
          platforms: ${{ matrix.platform }}
          # Outside the checkout, as is dist/ below: the checkout is the build
          # context, and anything written into it changes what `COPY . .`
          # copies, so the server image build would compile the module again.
          outputs: type=local,dest=${{ runner.temp }}/artifact-out
          provenance: false
          build-args: |
            BUILD_IMAGE=${{ matrix.build_image }}
            CXX=${{ matrix.cxx }}
          # Per-suffix GitHub Actions cache so each platform's build layers are
          # independent and sticky across runs (no packages:write needed).
          # Untrusted revisions READ the cache but never write it: a PR build
          # compiles attacker-controlled sources, so letting it publish layers
          # would let it seed the cache a later release build restores.
          cache-from: type=gha,scope=artifact-${{ matrix.suffix }}
          cache-to: ${{ inputs.trusted_revision && format('type=gha,mode=max,scope=artifact-{0}', matrix.suffix) || '' }}

      - name: Stage + checksum
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/artifact-out"
          DIST="$RUNNER_TEMP/dist"
          test -f "$OUT/falkordb.so" || { echo "::error::artifact-out/falkordb.so missing"; exit 1; }
          mkdir -p "$DIST"
          cp "$OUT/falkordb.so" "$DIST/falkordb-${SUFFIX}.so"
          ( cd "$DIST" && sha256sum "falkordb-${SUFFIX}.so" > "falkordb-${SUFFIX}.so.sha256" )
          echo "Built falkordb-${SUFFIX}.so ($(du -h "$DIST/falkordb-${SUFFIX}.so" | cut -f1))"
          cat "$DIST/falkordb-${SUFFIX}.so.sha256"

      - name: Upload artifact
        if: matrix.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: falkordb-${{ matrix.suffix }}.so
          path: ${{ runner.temp }}/dist/falkordb-${{ matrix.suffix }}.so*
          retention-days: 7
          compression-level: 0

      # The `server` target reuses the `builder` stage the step above just
      # built, from this runner's build cache, so the module is not compiled
      # again and every server's image ships the same .so as the release asset.
      # One image per server in `servers`; the Dockerfile's SERVER build arg
      # picks the server.
      - name: Build falkordb-server images (${{ matrix.suffix }})
        if: matrix.image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
          SUFFIX: ${{ matrix.suffix }}
          ARCH: ${{ matrix.arch }}
          SERVERS: ${{ toJSON(matrix.servers) }}
          BUILD_IMAGE: ${{ matrix.build_image }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          OS="${SUFFIX%-"$ARCH"}"
          mkdir -p "$RUNNER_TEMP/images"
          for SERVER in $(jq -r '.[]' <<<"$SERVERS"); do
            docker buildx build . \
              --file "$DOCKERFILE" \
              --target server \
              --platform "$PLATFORM" \
              --provenance=false \
              --build-arg "BUILD_IMAGE=${BUILD_IMAGE}" \
              --build-arg "CXX=${CXX}" \
              --build-arg "SERVER=${SERVER}" \
              --tag "falkordb-server:${OS}-${SERVER}-${ARCH}" \
              --output "type=docker,dest=${RUNNER_TEMP}/images/falkordb-server-${OS}-${SERVER}-${ARCH}.tar"
          done

      # Start each image as a user would: it runs the server its name says, the
      # module loads and answers a query, and run.sh has dropped the server to
      # the falkordb user (uid 999).
      - name: Smoke-test falkordb-server images (${{ matrix.suffix }})
        if: matrix.image
        env:
          SUFFIX: ${{ matrix.suffix }}
          ARCH: ${{ matrix.arch }}
          SERVERS: ${{ toJSON(matrix.servers) }}
        run: |
          set -euo pipefail
          OS="${SUFFIX%-"$ARCH"}"
          cleanup() { docker rm -f smoke smoke-args smoke-fallback >/dev/null 2>&1 || true; }
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then docker logs smoke || true; docker logs smoke-args || true; docker logs smoke-fallback || true; fi; cleanup' EXIT
          wait_pong() {
            for _ in $(seq 1 30); do
              if [ "$(docker exec "$1" redis-cli ping 2>/dev/null || true)" = "PONG" ]; then return 0; fi
              sleep 1
            done
            echo "::error::the server in $1 did not start"; exit 1
          }
          config() { docker exec "$1" redis-cli CONFIG GET "$2" | sed -n 2p; }
          for WANT in $(jq -r '.[]' <<<"$SERVERS"); do
            IMAGE="falkordb-server:${OS}-${WANT}-${ARCH}"
            docker load --input "$RUNNER_TEMP/images/falkordb-server-${OS}-${WANT}-${ARCH}.tar"
            SERVER=$(docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$IMAGE" | sed -n 's/^FALKORDB_SERVER=//p')
            if [ "$SERVER" != "$WANT" ]; then echo "::error::$IMAGE has FALKORDB_SERVER '$SERVER', expected $WANT"; exit 1; fi
            case "$SERVER" in
              redis) OTHER=VALKEY_ARGS ;;
              valkey) OTHER=REDIS_ARGS ;;
            esac
            docker run -d --name smoke "$IMAGE"
            # run.sh hands the server its own args variable, or the other one
            # when its own is unset, and never joins the two. smoke-args sets
            # both, to different configs: the server must show its own setting
            # and not the other's. smoke-fallback sets only the other server's
            # variable.
            docker run -d --name smoke-args -e "REDIS_ARGS=--maxclients 77" -e "VALKEY_ARGS=--hz 33" "$IMAGE"
            docker run -d --name smoke-fallback -e "${OTHER}=--hz 44" "$IMAGE"
            # Outputs are captured before matching: `docker exec ... | grep -q`
            # under pipefail reports 141 when grep exits early.
            wait_pong smoke
            MODULES=$(docker exec smoke redis-cli MODULE LIST)
            if ! grep -qx graph <<<"$MODULES"; then echo "::error::the graph module is not loaded in $IMAGE"; exit 1; fi
            GOT=$(docker exec smoke redis-cli GRAPH.QUERY smoke "UNWIND range(1, 10) AS x RETURN sum(x)" | sed -n 2p)
            if [ "$GOT" != "55" ]; then echo "::error::$IMAGE: expected 55, got '$GOT'"; exit 1; fi
            # PID 1 is the server: run.sh and gosu both exec into it.
            UIDS=$(docker exec smoke sh -c 'while read -r k v _; do if [ "$k" = Uid: ]; then echo "$v"; fi; done < /proc/1/status')
            if [ "$UIDS" != "999" ]; then echo "::error::${SERVER}-server in $IMAGE runs as uid '$UIDS', expected 999"; exit 1; fi
            wait_pong smoke-args
            MAXCLIENTS=$(config smoke-args maxclients)
            HZ=$(config smoke-args hz)
            case "$SERVER:$MAXCLIENTS:$HZ" in
              redis:77:33 | valkey:77:33) echo "::error::${SERVER} got both REDIS_ARGS and VALKEY_ARGS (maxclients $MAXCLIENTS, hz $HZ)"; exit 1 ;;
              redis:77:* | valkey:*:33) ;;
              *) echo "::error::${SERVER} did not get its own args variable (maxclients $MAXCLIENTS, hz $HZ)"; exit 1 ;;
            esac
            wait_pong smoke-fallback
            HZ=$(config smoke-fallback hz)
            if [ "$HZ" != "44" ]; then echo "::error::${SERVER} with only ${OTHER} set got hz '$HZ', expected 44"; exit 1; fi
            echo "OK: $IMAGE runs ${SERVER}, loads the module, answers, runs as falkordb, and takes ${SERVER}'s own args, else the other's, never both"
            cleanup
          done

      - name: Upload falkordb-server images (${{ matrix.suffix }})
        if: matrix.image && inputs.export_images && matrix.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-falkordb-server-${{ matrix.suffix }}
          path: ${{ runner.temp }}/images/*.tar
          if-no-files-found: error
          retention-days: 1
          # The tarballs' layers are already gzip-compressed.
          compression-level: 0

      # With tolerate_unpublished_failures (the release), continue-on-error
      # hides an unpublished cell's failure, so say so in the run summary
      # instead of staying green and silent.
      - name: Flag unpublished-cell failure
        if: failure() && !matrix.publish && inputs.tolerate_unpublished_failures
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          echo "::warning title=${SUFFIX} failed::unpublished cell ${SUFFIX} failed; not blocking because it is not published."
          echo "### :warning: ${SUFFIX} failed (not published, so not blocking)" >> "$GITHUB_STEP_SUMMARY"
