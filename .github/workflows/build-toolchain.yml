# Builds the toolchain image (build/Dockerfile) for linux/amd64 and linux/arm64
# and publishes it as a multi-arch manifest at ghcr.io/falkordb/falkordb-build:<tag>.
#
# Triggers:
#   - workflow_call from another workflow (rust-pr.yml's `docker` job)
#       → caller-supplied tag (typically pr-<N>)
#   - workflow_dispatch (UI / API)
#       → :latest, main only — manual escape hatch when apt deps drift but
#         build/Dockerfile didn't change
#
# Main-branch :latest is normally produced via PROMOTION, not rebuild:
# rust-push.yml's `promote-toolchain` job retags the merging PR's :pr-<N> to
# :latest. That gives byte-identical guarantee (what PR CI validated == what
# main publishes). Keep workflow_dispatch as the rebuild path when retag isn't
# applicable (e.g. apt repo refresh, no related PR).

name: Build toolchain image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. pr-42). Defaults to 'latest'."
        required: false
        type: string
        default: latest
  workflow_call:
    inputs:
      tag:
        description: "Image tag to push (e.g. pr-42)."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-toolchain-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Allow when called from another workflow (caller-supplied tag) or via
    # dispatch (user-supplied tag); otherwise only publish from main so a
    # feature-branch workflow doesn't accidentally overwrite :latest.
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,     platform: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64v8, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: ./build
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ghcr.io/falkordb/falkordb-build:${{ inputs.tag || 'latest' }}-${{ matrix.arch }}
          cache-from: type=registry,ref=ghcr.io/falkordb/falkordb-build:buildcache-${{ matrix.arch }}
          cache-to:   type=registry,ref=ghcr.io/falkordb/falkordb-build:buildcache-${{ matrix.arch }},mode=max

  manifest:
    needs: build
    if: ${{ github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch manifest
        env:
          TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ghcr.io/falkordb/falkordb-build:${TAG} \
            ghcr.io/falkordb/falkordb-build:${TAG}-x64 \
            ghcr.io/falkordb/falkordb-build:${TAG}-arm64v8
