# A/B/C benchmark front door: workflow_dispatch (manual), adding a per-size PR
# label `benchmark-small` | `benchmark-medium` | `benchmark-large`, or a
# `/benchmark [size]` PR comment (which just adds that label — see the
# `slash-command` job). The size run is the one named by the label. A benchmark
# runs only when the label is *added* (the `labeled` event), NOT on every push
# while it happens to be present — each run spins up GCE VMs and is expensive,
# so it must be an explicit request. To re-run a size, remove and re-add its
# label (or re-comment `/benchmark <size>` after removing it).
#
# The PR path never trusts that the RC image (rc-pr-<N>) built by rust-pr.yml
# is ready just because the label is present — `wait-for-rc-image` polls the
# registry for that image and proceeds as soon as it exists (rust-pr.yml
# publishes it early, before its slower/flaky test jobs finish). It only fails
# if the "Rust PR" run for this head SHA finishes without ever publishing the
# image, so a benchmark never runs against a nonexistent build.
#
# PR benchmarks run only for same-repo branches: a fork PR's GITHUB_TOKEN is
# read-only and couldn't push to gh-pages or comment (see the `prepare` guard).
#
# The automatic, continuously-updated canonical trend (main branch, edge vs
# edge-rs) is wired separately, from rust-push.yml after `edge-rs` promotion
# — not from this workflow.
name: A/B benchmark

on:
  workflow_dispatch:
    inputs:
      image_b_tag:
        description: "Variant B (this repo) tag on ghcr.io/falkordb/falkordb-server"
        required: true
      image_a_tag:
        description: "Variant A (production C) tag on docker.io/falkordb/falkordb-server"
        required: false
        default: "edge"
      dataset_size:
        description: "Workload dataset size"
        required: false
        default: "small"
        type: choice
        options: ["small", "medium", "large"]
      write_ratio:
        description: "Fraction of write queries (0.0-1.0). PR/slash runs default to 0.05 (5% writes); set this to override on a manual run."
        required: false
        default: "0.0"
  pull_request:
    # `labeled` runs a benchmark only when a benchmark-<size> label is *added*
    # (not on every push while it happens to be present — those are expensive);
    # `closed` drives the branch-view cleanup.
    types: [labeled, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  # `/benchmark [small|medium|large]` PR comment → add the matching
  # benchmark-<size> label (default small) and stop. Adding the label fires a
  # fresh `pull_request labeled` event the `prepare` job reacts to — one code
  # path decides "benchmark this PR", whether requested via label or slash
  # command.
  slash-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/benchmark') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add benchmark-<size> label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          # /benchmark [small|medium|large] — default small.
          # `|| true`: with pipefail, a no-match grep (bare `/benchmark`) exits
          # 1 and would abort the step before the `:-small` default applies.
          SIZE=$(printf '%s' "$BODY" | grep -oiE '(small|medium|large)' | head -1 | tr '[:upper:]' '[:lower:]' || true)
          SIZE="${SIZE:-small}"
          gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/labels" -f "labels[]=benchmark-${SIZE}"

      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api -X POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content="+1"

  # Fail fast on a manual dispatch with a typo'd tag, before spending time on
  # the dedicated runner + toolchain setup.
  validate-dispatch-images:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Verify both image tags resolve
        env:
          IMAGE_A_TAG: ${{ github.event.inputs.image_a_tag }}
          IMAGE_B_TAG: ${{ github.event.inputs.image_b_tag }}
        run: |
          set -euo pipefail
          docker manifest inspect "docker.io/falkordb/falkordb-server:${IMAGE_A_TAG}" >/dev/null
          docker manifest inspect "ghcr.io/falkordb/falkordb-server:${IMAGE_B_TAG}" >/dev/null

  prepare:
    needs: [validate-dispatch-images]
    # validate-dispatch-images only runs (and is only needed) for
    # workflow_dispatch; don't let its `skipped` result on the PR path block us.
    if: |
      !cancelled() &&
      (needs.validate-dispatch-images.result == 'success' || needs.validate-dispatch-images.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          contains(fromJSON('["benchmark-small","benchmark-medium","benchmark-large"]'), github.event.label.name) &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    outputs:
      image_a: ${{ steps.derive.outputs.image_a }}
      image_b: ${{ steps.derive.outputs.image_b }}
      image_c: ${{ steps.derive.outputs.image_c }}
      view: ${{ steps.derive.outputs.view }}
      pr_number: ${{ steps.derive.outputs.pr_number }}
      sizes: ${{ steps.derive.outputs.sizes }}
      write_ratio: ${{ steps.derive.outputs.write_ratio }}
    steps:
      - name: Checkout benchmark scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts/benchmark
          persist-credentials: false

      - name: Derive image refs, view, sizes
        id: derive
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_A_TAG: ${{ github.event.inputs.image_a_tag }}
          INPUT_IMAGE_B_TAG: ${{ github.event.inputs.image_b_tag }}
          INPUT_DATASET_SIZE: ${{ github.event.inputs.dataset_size }}
          INPUT_WRITE_RATIO: ${{ github.event.inputs.write_ratio }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              # Ad-hoc A/B of two published tags, one chosen size, no PR image.
              IMAGE_A="docker.io/falkordb/falkordb-server:${INPUT_IMAGE_A_TAG}"
              IMAGE_B="ghcr.io/falkordb/falkordb-server:${INPUT_IMAGE_B_TAG}"
              IMAGE_C=""
              # No PR here — use the (main-remapped) slugified ref for the view.
              VIEW=$(.github/scripts/benchmark/view-slug.sh "$DISPATCH_REF_NAME")
              OUT_PR_NUMBER=""
              SIZES="[\"${INPUT_DATASET_SIZE:-small}\"]"
              # Manual runs may opt into writes; default read-only.
              WRITE_RATIO="${INPUT_WRITE_RATIO:-0.0}"
              ;;
            pull_request)
              # A/B/C: C engine (A) vs published Rust (B) vs this PR (C).
              # B→C isolates the PR's impact; A/C is vs the C engine.
              IMAGE_A="docker.io/falkordb/falkordb-server:edge"
              IMAGE_B="ghcr.io/falkordb/falkordb-server:edge-rs"
              IMAGE_C="ghcr.io/falkordb/falkordb-server:rc-pr-${PR_NUMBER}"
              # Key the view off the PR number, not the branch name: two PRs can
              # share a branch name (forks, `patch-1`, …) and would otherwise
              # publish to — and overwrite — the same gh-pages dir. Must match
              # cleanup-branch-view.
              VIEW="pr-${PR_NUMBER}"
              OUT_PR_NUMBER="$PR_NUMBER"
              # One size per run, chosen by which benchmark-<size> label was
              # added (benchmark-small -> small). The prepare gate guarantees
              # LABEL_NAME is one of benchmark-small/medium/large.
              SIZE="${LABEL_NAME#benchmark-}"
              SIZES="[\"${SIZE}\"]"
              # PR/slash runs exercise the write path at 5% writes (policy: PR
              # benchmarks include writes). A manual dispatch can still override
              # via the write_ratio input.
              WRITE_RATIO="0.05"
              ;;
            *)
              echo "::error::unsupported event $EVENT_NAME"
              exit 1
              ;;
          esac

          {
            echo "image_a=${IMAGE_A}"
            echo "image_b=${IMAGE_B}"
            echo "image_c=${IMAGE_C}"
            echo "view=${VIEW}"
            echo "pr_number=${OUT_PR_NUMBER}"
            echo "sizes=${SIZES}"
            echo "write_ratio=${WRITE_RATIO}"
          } >> "$GITHUB_OUTPUT"
          echo "Derived: A=${IMAGE_A} B=${IMAGE_B} C=${IMAGE_C} view=${VIEW} pr=${OUT_PR_NUMBER} sizes=${SIZES}"

  # PR path only: don't benchmark a stale or nonexistent RC build. We only
  # need the rc-pr image itself — which rust-pr.yml's `build-rc-image` job
  # pushes early, long before the (sometimes flaky) e2e/flow/asan suites in
  # that same run finish. So wait on the *image*, not on the whole "Rust PR"
  # run concluding success; a flaky test shouldn't starve the benchmark of a
  # perfectly good image.
  wait-for-rc-image:
    needs: prepare
    # Explicit guard (not a bare `if`): in a chain where an ancestor was skipped
    # (validate-dispatch-images), a bare condition inherits the skip. Mirror
    # run-benchmark's pattern so this actually runs on the PR path.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Wait for the RC image to be published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_IMAGE: ${{ needs.prepare.outputs.image_c }}
        run: |
          set -euo pipefail
          # Wait on the PR image (variant C, rc-pr-<N>) — A (edge) and B
          # (edge-rs) always exist. Poll the registry directly; fail fast only
          # if the Rust PR run for this SHA has *finished* and the image still
          # isn't there (the build failed — it's never coming; a run that
          # failed only in a later test job already pushed the image).
          deadline=$(( $(date +%s) + 85 * 60 ))
          while true; do
            if docker manifest inspect "$PR_IMAGE" >/dev/null 2>&1; then
              echo "RC image ${PR_IMAGE} is available."
              exit 0
            fi

            run_status=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "Rust PR")] | sort_by(.run_started_at) | last | .status // empty')

            if [ "$run_status" = "completed" ]; then
              # Race guard: the image may have landed between the check above
              # and the run reporting completed.
              if docker manifest inspect "$PR_IMAGE" >/dev/null 2>&1; then
                echo "RC image ${PR_IMAGE} is available."
                exit 0
              fi
              echo "::error::the Rust PR run for ${HEAD_SHA} finished but ${PR_IMAGE} was never published — the RC image build must have failed"
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::timed out waiting for the RC image ${PR_IMAGE} (Rust PR run status=${run_status:-none})"
              exit 1
            fi
            echo "RC image not yet available (Rust PR run status=${run_status:-none}); waiting..."
            sleep 20
          done

  run-benchmark:
    needs: [prepare, wait-for-rc-image]
    if: |
      !cancelled() &&
      needs.prepare.result == 'success' &&
      (needs.wait-for-rc-image.result == 'success' || needs.wait-for-rc-image.result == 'skipped')
    uses: ./.github/workflows/_benchmark.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      image_a: ${{ needs.prepare.outputs.image_a }}
      image_b: ${{ needs.prepare.outputs.image_b }}
      image_c: ${{ needs.prepare.outputs.image_c }}
      view: ${{ needs.prepare.outputs.view }}
      is_canonical: false
      sizes: ${{ needs.prepare.outputs.sizes }}
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      write_ratio: ${{ needs.prepare.outputs.write_ratio }}
    secrets: inherit

  # Remove a PR's /benchmark/branch/pr-<N>/ preview once it closes — no
  # point keeping a dead branch's dashboard around forever. Runs regardless
  # of whether the `benchmark` label was ever added (cheap no-op if there's
  # nothing to remove).
  cleanup-branch-view:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Scripts come from the PR's base branch (stable, always has
      # gh-pages-push.sh once this lands) rather than the PR merge ref, which
      # can be gone by the time a closed PR is cleaned up.
      - name: Checkout benchmark scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: .github/scripts/benchmark
          persist-credentials: false

      - name: Checkout gh-pages
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
          persist-credentials: false

      - name: Remove branch view (if any) and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SCRIPTS="$GITHUB_WORKSPACE/.github/scripts/benchmark"
          # Same view the PR published under (pr-<N>, keyed off the PR number,
          # not the branch — see prepare) so we remove the exact dir and never
          # orphan a view or clobber another PR's.
          if [ -z "$PR_NUMBER" ]; then
            echo "no PR number — nothing to clean up"
            exit 0
          fi
          VIEW="pr-${PR_NUMBER}"

          cd gh-pages
          TARGET="benchmark/branch/${VIEW}"
          if [ ! -d "$TARGET" ]; then
            echo "no published view at $TARGET — nothing to clean up"
            exit 0
          fi

          git rm -rq "$TARGET"
          # Shared identity + token-remote + rebase-retry push (see publish.sh).
          "$SCRIPTS/gh-pages-push.sh" "benchmark: remove closed-PR view ${VIEW}"
