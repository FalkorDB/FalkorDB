name: "FalkorDB CodeQL config"

# Matches what default setup ran before the migration to advanced setup:
# the "extended" query suite (`security-extended`) on top of the default one.
queries:
  - uses: security-extended

paths-ignore:
  # Autogenerated by `gen_prejit.sh`, which harvests whatever SuiteSparse's
  # runtime JIT emitted inside the Linux toolchain image. CLAUDE.md forbids
  # hand-editing these files: a local edit desynchronises the kernel from the
  # `_query` hash GraphBLAS checks at load time, which makes GraphBLAS
  # silently drop the PreJIT kernel and fall back to a generic one.
  #
  # So an alert here is not actionable — it can be neither fixed in place nor
  # sensibly triaged against code nobody in this repo wrote. The pattern that
  # trips `cpp/overflow-buffer` (a 16-byte `memcpy` into what CodeQL reads as
  # an 8-byte destination) is the generator's own idiom for the 2-word
  # user-defined types used by the LAGraph MaxFlow/MSF operators, and it
  # recurs in every new kernel of those shapes.
  - build/graphblas/PreJIT/**
