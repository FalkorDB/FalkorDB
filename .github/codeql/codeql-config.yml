name: "FalkorDB CodeQL config"

paths-ignore:
  # Autogenerated by SuiteSparse:GraphBLAS's runtime JIT and committed as a
  # prebuilt cache (see cmake_modules/GraphBLAS_PreJIT.cmake). Nobody in this
  # repo authors these files, so an alert here is not actionable — it can be
  # neither fixed in place nor sensibly triaged. Scanning without a build
  # (build-mode: none, see ../workflows/codeql-analysis.yml) makes these
  # generated kernels visible to CodeQL the same way a full build already did,
  # so they still need excluding.
  - deps/GraphBLAS/PreJIT/**
  - deps/GraphBLAS/Tcov/PreJIT/**
