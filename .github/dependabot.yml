updates:
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
- directory: /
  package-ecosystem: cargo
  schedule:
    interval: weekly
# Keep the C engine's GitHub Actions bumps alive on `master`.
#
# Dependabot reads .github/dependabot.yml from the DEFAULT branch ONLY. Once this
# tree is the default branch, master's own copy of the file is never read again
# and C silently stops receiving dependency PRs — so the entry has to live here,
# with target-branch pointing at master. Mirrors master's config verbatim
# (github-actions at /, weekly, 7-day cooldown); C has no other ecosystem,
# because its native dependencies are git submodules, bumped by
# submodule-update.yml rather than by Dependabot.
#
# Two entries may share package-ecosystem + directory as long as target-branch
# differs — that is the supported way to cover several branches.
#
# See issue #2255.
- directory: /
  package-ecosystem: github-actions
  target-branch: master
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
# Python test dependencies for the e2e / TCK / flow suites.
#
# `redis` is ignored here deliberately. tests/requirements.txt pins `redis<8.1`
# because redis-py 8.1.0 adds `himport_registry` to
# ConnectionPool.connection_kwargs, which falkordb-py 1.6.2 forwards to the
# sync Redis() constructor; every flow test that builds its own pool fails with
# a TypeError. The identical pin is duplicated in build/Dockerfile and the two
# are documented as having to move together.
#
# An earlier revision of this comment claimed Dependabot would not widen the
# constraint. That is wrong: the pip ecosystem defaults to
# `versioning-strategy: auto`, which raises a `<` ceiling rather than treating
# it as a hard bound. It opened #2476 to move the ceiling to `<8.2`, which
# would have re-admitted the broken redis-py release and desynced
# tests/requirements.txt from build/Dockerfile. CI would not have caught it:
# no workflow installs tests/requirements.txt -- the flow suites run inside
# the ghcr.io/falkordb/falkordb-build image, which bakes its own copy of the
# pin -- so the change is invisible to CI and only breaks local/non-container
# runs.
#
# Remove this ignore when falkordb-py ships a fix and both pins are dropped
# together.
- directory: /tests
  package-ecosystem: pip
  schedule:
    interval: weekly
  ignore:
  - dependency-name: "redis"
  groups:
    python-test-deps:
      patterns:
        - "*"

# The benchmark harness is a separate uv project (bench/pyproject.toml +
# bench/uv.lock) rather than part of the tests/ virtualenv, so it needs its
# own entry; `pip` would not read the lockfile.
- directory: /bench
  package-ecosystem: uv
  schedule:
    interval: weekly
  groups:
    bench-deps:
      patterns:
        - "*"

# Base images for the build, runtime and devcontainer images.
#
# /bench is deliberately absent: bench/Dockerfile is `FROM ${C_IMAGE}`, an
# entirely ARG-driven base that Dependabot cannot resolve to a registry tag.
# build/runtime/Dockerfile is included for its pinned stages (debian, node);
# its $BUILD_IMAGE and $BROWSER_TAG stages are skipped for the same reason.
- package-ecosystem: docker
  directories:
    - /build
    - /build/runtime
    - /.devcontainer
  schedule:
    interval: weekly
  groups:
    docker-base-images:
      patterns:
        - "*"

version: 2
