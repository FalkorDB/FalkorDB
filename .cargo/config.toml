# RediSearch 8.6 is linked in as `libredisearch_rs.a`, itself a Rust staticlib
# that bundles its own copy of `std`. Linking that into our cdylib / test
# binaries / fuzz targets on Linux (GNU ld / rust-lld) collides on std symbols
# such as `rust_eh_personality`. The colliding definitions are identical, so we
# tell the linker to accept the duplicate. Scoped to Linux only — macOS ld64
# tolerates it already, and we don't want to relax the local dev link.
#
# NOTE: `RUSTFLAGS` / `CARGO_TARGET_*_RUSTFLAGS` env vars REPLACE (not merge)
# these config flags, so build steps that set them must repeat this flag:
# the coverage steps (`-C instrument-coverage`), the `cargo fuzz` steps, and
# build/runtime/Dockerfile.asan all set `-Clink-arg=-Wl,--allow-multiple-definition`
# explicitly for the same reason.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,--allow-multiple-definition"]
# NOTE: doctests are linked by rustdoc, which needs the same allowance via
# `rustdocflags`/`RUSTDOCFLAGS` — but cargo ignores `rustdocflags` under a
# `[target.<cfg>]` table (unused-key warning), and `[build].rustdocflags` is
# global, where the GNU-ld `--allow-multiple-definition` would break macOS's
# ld64. So the CI jobs that run doctests (`cargo test -p graph` in the `test`
# and `coverage` jobs) set RUSTDOCFLAGS explicitly; a local Linux doctest run
# (`cargo test -p graph`) needs the same env.
