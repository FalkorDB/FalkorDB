[pytest]
markers =
    extra: mark a test as extra for the new rust database

# Flow test classes are named `testFoo` / `test_foo`, which pytest's default
# `Test*` pattern does not match — without the lowercase pattern the entire
# flow suite collects zero tests and the run still exits 0. Keep `Test*` too
# for the root suites.
python_classes = test* Test*
