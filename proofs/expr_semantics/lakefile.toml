name = "falkor-expr-semantics"
defaultTargets = ["FalkorExprSemantics"]

[[lean_lib]]
name = "FalkorExprSemantics"
# NegFold imports the root module (checkedNeg lives there), so it is listed in `globs`, not imported by it.
globs = ["FalkorExprSemantics", "FalkorExprSemantics.NegFold"]

# Shared foundations (i64 helpers, compare Flag): proofs/core.
[[require]]
name = "falkor-core"
path = "../core"
