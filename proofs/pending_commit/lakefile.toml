name = "falkor-pending-commit"
defaultTargets = ["PendingCommit"]

[[lean_lib]]
name = "PendingCommit"

# graph_queries' IdSpace model (`GQ.IdS`, `GQ.rCancel`) is imported, not copied.
[[require]]
name = "falkor-graph-queries"
path = "../graph_queries"

# runtime_core owns the borrow-word model (`RuntimeCore.Cell`) that `Hold` runs on.
[[require]]
name = "falkor-runtime-core"
path = "../runtime_core"
