name = "pr3436-review"
defaultTargets = ["Pr3436Review"]

[[lean_lib]]
name = "Pr3436Review"

# runtime_core owns runtime.rs: its accessor model is re-used to show the rewrite
# changes no modelled accessor result.
[[require]]
name = "falkor-runtime-core"
path = "../runtime_core"

# redis_layer owns graph_core.rs / query_session.rs: its parser+planner write
# classification (`RedisLayer.Ro`) discharges "a read plan has no mutating op".
[[require]]
name = "redis-layer"
path = "../redis_layer"
