name = "falkor-ops-traverse"
defaultTargets = ["OpsTraverse"]

[[lean_lib]]
name = "OpsTraverse"

# `delta_lmxm_into` is the per-layer `Matrix::delta_lmxm` (graphblas_wrappers), stated
# over a versioned matrix's layers and the iterators' order (versioned_matrix).
[[require]]
name = "falkor-graphblas-wrappers"
path = "../graphblas_wrappers"

[[require]]
name = "falkor-versioned-matrix"
path = "../versioned_matrix"

# `edgeVerdict` is stated against ops_aggregate's `StreamOps.filterEval` (FilterOp), not a copy.
[[require]]
name = "falkor-ops-aggregate"
path = "../ops_aggregate"

# `BfsGraph` instantiates `bfs_single_path`'s two relationship lists with graph_queries'
# `GQ.nodeRelsByType` (`get_node_relationships_by_type`), so the backward side's correspondence to the
# forward one is proved, not assumed (graph_queries requires nothing: no cycle).
[[require]]
name = "falkor-graph-queries"
path = "../graph_queries"
