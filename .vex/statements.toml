# Source of FalkorDB's VEX documents for its container images,
# .vex/<image>.openvex.json. Edit this file, then run
# `python3 build/vex/vex.py generate`; CI fails when they disagree.
# See .vex/README.md.

[document]
id_prefix = "https://github.com/FalkorDB/FalkorDB/blob/main/.vex/"
author = "FalkorDB"
# Bump both whenever a statement changes.
version = 1
timestamp = "2026-10-29T00:00:00Z"

# One document per image; a statement goes into the documents of the images
# it lists.
[images.falkordb]
description = "falkordb/falkordb and ghcr.io/falkordb/falkordb: the Debian server image plus the FalkorDB Browser"

[images.falkordb-server]
description = "falkordb/falkordb-server and ghcr.io/falkordb/falkordb-server: Debian (the default tags), RHEL 9 (-rhel9-*) and Amazon Linux 2023 (-amazonlinux2023-*)"

# How a package is named in each image's OS. falkordb-server has a Debian
# image (the default tags) and RHEL 9 / Amazon Linux 2023 images (tags ending
# in -rhel9-<arch> and -amazonlinux2023-<arch>).
[os.debian]
purl = "pkg:deb/debian/{name}"

[os.rhel]
purl = "pkg:rpm/redhat/{name}"

[os.amazon]
purl = "pkg:rpm/amazon/{name}"

# What the containers run: build/runtime/run.sh and what it calls. `not-run`
# evidence is checked against these files plus every library they load
# (PT_INTERP and DT_NEEDED). A program that run.sh, gen-certs.sh or the
# browser's entrypoint starts has to be listed here. `dlopen` lists the
# libraries they can load by name at run time (NSS modules for user and host
# lookups, iconv's gconv modules, OpenSSL providers and engines, PKCS#11
# modules); every file that matches counts as loaded.
[runtime.os.debian]
programs = [
  "/var/lib/falkordb/bin/run.sh", "/bin/sh", "/usr/bin/find", "/usr/bin/chown",
  "/usr/bin/mkdir", "/usr/bin/id", "/usr/sbin/gosu",
  "/usr/local/bin/redis-server", "/var/lib/falkordb/bin/falkordb.so",
  # gen-certs.sh, with TLS=1
  "/var/lib/falkordb/bin/gen-certs.sh", "/usr/bin/env", "/usr/bin/bash",
  "/usr/bin/openssl", "/usr/bin/cat",
]
dlopen = [
  "/usr/lib/*/libnss_*.so*", "/usr/lib/*/gconv/*.so", "/usr/lib/*/ossl-modules/*.so",
  "/usr/lib/*/engines-3/*.so", "/usr/lib/*/pkcs11/*.so",
]

[runtime.os.rhel]
programs = [
  "/var/lib/falkordb/bin/run.sh", "/bin/sh", "/usr/bin/find", "/usr/bin/chown",
  "/usr/bin/mkdir", "/usr/bin/id",
  # build/runtime/gosu-setpriv.sh
  "/usr/local/bin/gosu", "/usr/bin/setpriv",
  "/usr/local/bin/redis-server", "/var/lib/falkordb/bin/falkordb.so",
  "/var/lib/falkordb/bin/gen-certs.sh", "/usr/bin/env", "/usr/bin/bash",
  "/usr/bin/openssl", "/usr/bin/cat",
]
dlopen = [
  "/usr/lib64/libnss_*.so*", "/usr/lib64/gconv/*.so", "/usr/lib64/ossl-modules/*.so",
  "/usr/lib64/engines-3/*.so", "/usr/lib64/pkcs11/*.so",
]

[runtime.os.amazon]
programs = [
  "/var/lib/falkordb/bin/run.sh", "/bin/sh", "/usr/bin/find", "/usr/bin/chown",
  "/usr/bin/mkdir", "/usr/bin/id",
  "/usr/local/bin/gosu", "/usr/bin/setpriv",
  "/usr/local/bin/redis-server", "/var/lib/falkordb/bin/falkordb.so",
  "/var/lib/falkordb/bin/gen-certs.sh", "/usr/bin/env", "/usr/bin/bash",
  "/usr/bin/openssl", "/usr/bin/cat",
]
dlopen = [
  "/usr/lib64/libnss_*.so*", "/usr/lib64/gconv/*.so", "/usr/lib64/ossl-modules/*.so",
  "/usr/lib64/engines-3/*.so", "/usr/lib64/pkcs11/*.so",
]

# The browser, in the falkordb image: its docker-entrypoint.sh, then node.
[runtime.image.falkordb]
programs = [
  "/var/lib/falkordb/browser/docker-entrypoint.sh", "/usr/local/bin/su-exec",
  "/usr/bin/head", "/usr/bin/od", "/usr/bin/tr", "/usr/bin/touch", "/usr/bin/rm",
  "/usr/local/bin/node",
]
# Every ELF file under these is counted as loaded (node's native addons).
trees = ["/var/lib/falkordb/browser"]

# ===========================================================================
# Debian: falkordb and falkordb-server
#
# Assessed 2026-10-20 on images built from this branch (Trivy 0.69.2), on all
# four Debian images (falkordb and falkordb-server, arm64 and amd64). "Not
# run" means the package is outside [runtime] and everything it loads; that
# was also confirmed on running containers (/proc/<pid>/maps), plain and with
# TLS=1. The first group is the libraries the server loads (glibc, libstdc++,
# zlib); the second, everything else.


[[statement]]
cve = "CVE-2010-4756"
os = "debian"
images = ["falkordb", "falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = "The flaw makes glob() use a lot of CPU and memory on a crafted wildcard pattern. Of the programs this image runs, only redis-server calls glob(), to expand wildcard include paths in its own configuration, which whoever runs the container writes; network clients cannot supply a pattern."
evidence = [
  { check = "not-run", packages = ["tar", "libapt-pkg7.0"] },
  { check = "no-import", symbols = ["wordexp"] },
]
notes = "[confidence: high] Arches/images: all four Debian images (falkordb + falkordb-server, arm64 + amd64; I exported the missing server-amd64 rootfs with export-image.sh). Imports: readelf --dyn-syms over every ELF file, and every predicate re-run with the CI checker's own evaluate() (copy of build/vex/vex.py + .vex/statements.toml incl. the dlopen patterns) on `docker export` tarballs of the four images: all OK. glibc-internal calls: objdump -d of libc.so.6 on aarch64 and x86-64 (byte-identical between full and server per arch), listing every direct call/jump to the function. Importers of glob/glob64 (same on all four): /usr/local/bin/redis-server (glob64), /usr/bin/tar, libapt-pkg.so.7.0; tar and apt are never run (not-run). Inside libc the only direct caller of glob is wordexp (aarch64 and x86-64), and nothing imports wordexp. redis-server source at tag 8.10.2 (commit 498ecd0d, matching `redis-server --version` sha=498ecd0d): the only glob() call is src/config.c:763 in loadServerConfig(), taken only when the config file path or an `include` line contains *, ? or [; it runs at startup on the operator's config file (server.c:8280, config.c:590), not from any network command. bash, dash and find do their own pattern matching (fnmatch), not glob(). node does not import glob. Sources: https://security-tracker.debian.org/tracker/CVE-2010-4756 ; https://github.com/redis/redis/blob/8.10.2/src/config.c#L763"

[[statement]]
cve = "CVE-2018-20796"
os = "debian"
images = ["falkordb", "falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = "The flaw is unbounded recursion when glibc's regular-expression matcher runs a crafted pattern that uses back-references. No program this image runs passes a pattern from outside to glibc's regular-expression functions, and FalkorDB's Cypher =~ operator uses a separate regex engine that rejects back-references."
evidence = [
  { check = "not-run", packages = ["grep", "sed", "diffutils", "tar", "apt", "libapt-pkg7.0", "debianutils", "libc-bin"] },
]
notes = "[confidence: high] Arches/images: all four Debian images (falkordb + falkordb-server, arm64 + amd64; I exported the missing server-amd64 rootfs with export-image.sh). Imports: readelf --dyn-syms over every ELF file, and every predicate re-run with the CI checker's own evaluate() (copy of build/vex/vex.py + .vex/statements.toml incl. the dlopen patterns) on `docker export` tarballs of the four images: all OK. glibc-internal calls: objdump -d of libc.so.6 on aarch64 and x86-64 (byte-identical between full and server per arch), listing every direct call/jump to the function. Importers of glibc regex (regcomp/regexec/re_search/re_match/re_compile_pattern), same on all four: run-parts (debianutils), du/expr/ptx/csplit/tac/nl (coreutils), diff (diffutils), grep, sed, tar, localedef (libc-bin), libapt-pkg/libapt-private (apt), bash, find. The not-run predicate covers the packages never run; of the rest, bash runs only gen-certs.sh (TLS=1), which has no [[ =~ ]] (read from the image; identical to build/runtime/gen-certs.sh), and find runs only run.sh's fixed -name/-type/-user expressions (no -regex). rpmatch() (imported by find, rm and others) compiles the locale's fixed yes/no pattern and runs only for interactive prompts, which rm -f and run.sh's find never show. Inside libc the only direct callers of regcomp/regexec are rpmatch and the legacy re_exec/step/advance, which nothing imports. redis-server, falkordb.so and node do not import glibc regex. FalkorDB's Cypher =~ uses the Rust regex engine: on both arches `GRAPH.QUERY g \"MATCH (n) WHERE n.name =~ '(a|)(\\\\1\\\\1)*' RETURN count(n)\"` returns 'backreferences are not supported'. Source: https://security-tracker.debian.org/tracker/CVE-2018-20796"

[[statement]]
cve = "CVE-2019-1010022"
os = "debian"
images = ["falkordb", "falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = "This is a limit of a hardening feature, not a flaw that can be exploited on its own: it only helps an attacker who has already found a separate stack buffer overflow in a thread of a program, to get past glibc's stack-overflow check. Such an overflow would be a vulnerability of its own, fixed as such."
notes = "[confidence: medium] These three are hardening limits that upstream does not treat as vulnerabilities: sourceware bugs 22850/22852/22853 (fetched as XML): 'it is a post-attack mitigation' (Carlos O'Donell, 22850); 'ASLR bypass itself is not a vulnerability. It may simplify exploitation of another, unrelated vulnerability.' (Florian Weimer, 22853); Red Hat: 'does not consider this to be a vulnerability'. Debian: 'Not treated as a security issue by upstream', unfixed in all releases. Our own evidence: the technique overwrites the reference canary that x86-64 glibc keeps in the thread control block at the top of each thread's stack (bug 22850). On aarch64 glibc keeps it in the global __stack_chk_guard exported by ld-linux-aarch64.so.1 (confirmed: ld.so exports it on arm64, not on amd64; arm64 node imports it), so the technique does not apply to the arm64 images at all. On both arches redis-server and falkordb.so import no __stack_chk_fail, i.e. they are built without stack-protector canaries, so there is no check in them to bypass (this is a build-hardening gap worth fixing separately, not a VEX matter); node (browser, falkordb image only) does use canaries. Nothing in the image can be checked by a predicate for this; it rests on the CVE's own precondition (a separate stack buffer overflow). Sources: https://sourceware.org/bugzilla/show_bug.cgi?id=22850 ; https://access.redhat.com/security/cve/cve-2019-1010022 ; https://security-tracker.debian.org/tracker/CVE-2019-1010022"

[[statement]]
cve = "CVE-2019-1010023"
os = "debian"
images = ["falkordb", "falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "The flaw needs someone to run ldd on, or otherwise load, an ELF file prepared by an attacker. Nothing in this image runs ldd, and network clients cannot make the server load a file of their choosing."
evidence = [
  { check = "not-run", packages = ["libc-bin"] },
]
notes = "[confidence: high] Arches/images: all four Debian images (falkordb + falkordb-server, arm64 + amd64; I exported the missing server-amd64 rootfs with export-image.sh). Imports: readelf --dyn-syms over every ELF file, and every predicate re-run with the CI checker's own evaluate() (copy of build/vex/vex.py + .vex/statements.toml incl. the dlopen patterns) on `docker export` tarballs of the four images: all OK. /usr/bin/ldd is a libc-bin script (package db); nothing in the runtime set is a libc-bin file. redis-server loads only the operator's --loadmodule falkordb.so; Redis 8.10.2's MODULE LOAD command is off by default (config.c:3498 enable-module-command default PROTECTED_ACTION_ALLOWED_NO, immutable at runtime) and run.sh does not enable it. node loads only the addons in its own node_modules. Sources: https://sourceware.org/bugzilla/show_bug.cgi?id=22851 ; https://security-tracker.debian.org/tracker/CVE-2019-1010023"

[[statement]]
cve = "CVE-2019-1010024"
os = "debian"
images = ["falkordb", "falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = "This is a limit of a hardening feature, not a flaw that can be exploited on its own: glibc reuses the memory of finished threads, which makes some addresses easier to predict, and that only helps an attacker who already has a separate memory-corruption bug and a way to learn addresses from the process."
notes = "[confidence: medium] These three are hardening limits that upstream does not treat as vulnerabilities: sourceware bugs 22850/22852/22853 (fetched as XML): 'it is a post-attack mitigation' (Carlos O'Donell, 22850); 'ASLR bypass itself is not a vulnerability. It may simplify exploitation of another, unrelated vulnerability.' (Florian Weimer, 22853); Red Hat: 'does not consider this to be a vulnerability'. Debian: 'Not treated as a security issue by upstream', unfixed in all releases. Our own evidence: the bug-22852 PoC is a local program that prints addresses of its own threads; in these containers no untrusted party runs code. redis-server is built with jemalloc (`redis-server --version`: malloc=jemalloc-5.3.0), so Redis's own data does not live in glibc's per-thread heaps. An operator who wants it anyway can disable thread-stack reuse with GLIBC_TUNABLES=glibc.pthread.stack_cache_size=0 (suggested by glibc maintainers in bug 22852). No predicate fits. Sources: https://sourceware.org/bugzilla/show_bug.cgi?id=22852 ; https://security-tracker.debian.org/tracker/CVE-2019-1010024"

[[statement]]
cve = "CVE-2019-1010025"
os = "debian"
images = ["falkordb", "falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_cannot_be_controlled_by_adversary"
impact = "This is a limit of a hardening feature, not a flaw that can be exploited on its own: the heap of each new thread starts at an address aligned to 64 MB, which leaves less randomness, and that only helps an attacker who already has a separate memory-corruption bug."
notes = "[confidence: medium] These three are hardening limits that upstream does not treat as vulnerabilities: sourceware bugs 22850/22852/22853 (fetched as XML): 'it is a post-attack mitigation' (Carlos O'Donell, 22850); 'ASLR bypass itself is not a vulnerability. It may simplify exploitation of another, unrelated vulnerability.' (Florian Weimer, 22853); Red Hat: 'does not consider this to be a vulnerability'. Debian: 'Not treated as a security issue by upstream', unfixed in all releases. Our own evidence: bug 22853 is about malloc's per-thread arena alignment (HEAP_MAX_SIZE); redis-server allocates with jemalloc-5.3.0 (`redis-server --version`), not glibc malloc arenas, for Redis's own data; the PoC is a local program. No predicate fits. Sources: https://sourceware.org/bugzilla/show_bug.cgi?id=22853 ; https://access.redhat.com/security/cve/cve-2019-1010025 ('The bug related to this CVE is not exploitable')"

