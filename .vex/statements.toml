[[statement]]
cve = "CVE-2026-102010"
os = "debian"
images = ["falkordb"]
packages = ["gcc-14-base", "libatomic1", "libgcc-s1", "libstdc++6"]
status = "not_affected"
justification = "vulnerable_code_not_present"
impact = "The flaw is in the pb_ds binary-heap template, which exists only as C++ header code compiled into the programs that use it; it is not part of the libstdc++ runtime library in this image. No program in this image is built with it."
evidence = [
  { check = "absent", paths = ["/usr/include/c++/14/ext/pb_ds"] },
]
notes = "[confidence: high] Arches/images: all four Debian images (falkordb + falkordb-server, arm64 + amd64; I exported the missing server-amd64 rootfs with export-image.sh). Imports: readelf --dyn-syms over every ELF file, and every predicate re-run with the CI checker's own evaluate() (copy of build/vex/vex.py + .vex/statements.toml incl. the dlopen patterns) on `docker export` tarballs of the four images: all OK. Upstream fix aaa8351f (PR127656) changes only libstdc++-v3/include/ext/pb_ds/detail/binary_heap_/erase_fn_imps.hpp plus a test (https://github.com/gcc-mirror/gcc/commit/aaa8351f4d2e636f9680a1f0a8ebc2f0a60611e6). The four flagged packages ship no headers (package db) and libstdc++.so.6.0.33 exports no pb_ds symbol. No ELF file in any of the four images contains the strings 'pb_ds', 'pbds' or '__gnu_pbds' (which pb_ds code leaves in typeinfo names); the only 'binary_heap' hits are Rust's alloc::collections::binary_heap in falkordb.so (graph::runtime::ops::sort). The absent predicate only shows the headers are not installed; the strings scan is not CI-checked. Source: https://security-tracker.debian.org/tracker/CVE-2026-102010"

