evidence = [
  { check = "no-setid" },
]
notes = "[confidence: high] GLIBC-SA-2026-0022: needs 'an installed setuid or setgid binary whose DT_RPATH uses $ORIGIN followed by \"..\"', plus fs.protected_hardlinks disabled (it is 1 in the test VM; it is a host sysctl). Fix ed0c137b (2.45) only touches elf/dl-load.c and dl-path-normalize.h. Set-id programs: the image rebuilt with commit 18c0e0677 (the image built from this branch sha256:b4ff3b29..., created 2026-10-20T17:21:43Z) has no setuid or setgid file (`find / -xdev -type f -perm /6000` inside the container: 0; vex.py's no-setid passes on its docker export). The image before that commit had 10 (su, mount, umount, write, gpasswd, chage, newgrp, unix_chkpwd, pam_timestamp_check, utempter); all ELF files are otherwise byte-identical between the two. The same commit strips the file capabilities too: newuidmap (cap_setuid=ep) and newgidmap (cap_setgid=ep) had them, and getcap -r / now finds none. no-setid checks them as well (the SCHILY.xattr.security.capability header in the docker export), so no program here runs AT_SECURE. The claim rests on RPATH: llvm-readelf -d over all 447 ELF files finds not one DT_RPATH or DT_RUNPATH entry, and none of the formerly set-id or capability programs contains the string $ORIGIN (only glib/gio, gpg, p11-kit and modulemd tools do, none privileged). For AT_SECURE processes glibc ignores LD_LIBRARY_PATH. Inside the container the only unprivileged process is redis-server (uid 999). No CI predicate expresses 'no RPATH/RUNPATH'. Red Hat CSAF: 'Affected', Moderate."

