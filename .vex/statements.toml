status = "affected"
action = "TLS is off by default. If you turn it on (TLS=1, or a tls-port in REDIS_ARGS), require a password or ACL (for example REDIS_ARGS=\"--requirepass <secret>\") so that untrusted clients cannot run CONFIG SET, REPLICAOF, MIGRATE or CLUSTER commands; keep tls-auth-clients at no; and do not replicate or cluster over TLS with peers you do not trust. Move to an image with OpenSSL 3.5.9 or a Red Hat fix when one is published."
notes = "[confidence: high] The flaw is in X.509 extension caching (CRL distribution points) for certificates received from a peer: TLS clients, and TLS servers that request client certificates. The fix (3842516c) is not in openssl-3.5.8 (gh compare: the tag is behind it by 104 commits); upstream fixed 3.5 in 3.5.9. Tested a TLS=1 container: `openssl s_client -state` showed no 'read server certificate request' in TLS 1.3 or 1.2, so by default redis-server parses no client certificate. But with no password (the image default) an unauthenticated client's `CONFIG SET tls-auth-clients optional` returned OK and the next handshake included 'read server certificate request'; `CONFIG SET tls-replication yes` also returned OK, after which REPLICAOF makes redis-server a TLS client that verifies the peer's chain (createSSLContext sets SSL_VERIFY_PEER). Such a client could already stop the server (SHUTDOWN), so the added risk is small, but the code is reachable. With TLS=0 TLS cannot be switched on by a client: the image ships no private key (/etc/pki/tls/private and /var/lib/falkordb/tls are empty; no PEM key files found) and tlsConfigure fails without tls-cert-file/tls-key-file. falkordb.so imports only SSL_*/TLS_client_method/ERR_* from OpenSSL. A call graph built from llvm-objdump of falkordb.so (not stripped) shows every one of those imports is referenced only from hiredis ssl.c (redisSSLConnect/redisSSLRead/redisSSLWrite/redisCreateSSLContextWithOptions) and the RediSearch coordinator's MRConn_ConnectCallback (src/coord/rmr/conn.c, RediSearch rev ea1a6f40), which is only reached through the coordinator's I/O runtimes; those are created by MR_Init, which nothing in falkordb.so references (no code reference, no relocation): FalkorDB links RediSearch as a library (REDISEARCH_BUILD_AS_LIBRARY=ON drops module_main.c, the only caller) and calls RediSearch_Init(ctx, REDISEARCH_INIT_LIBRARY). LOAD CSV FROM https:// uses ureq 3.4.2 + rustls 0.23.45 + ring 0.17.14 (graph/Cargo.toml