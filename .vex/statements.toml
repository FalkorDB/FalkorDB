notes = "[confidence: high] Was `affected` before the image dropped setuid/setgid bits: as uid 999, setuid-root `mount -l` probed a caller-chosen, unreadable ./overlay file as root (mkswap -L label printed; crafted MBR/EBR reached parse_dos_extended). Dockerfile.rhel9/.amazonlinux2023 now strip the bits; the same test prints no label. The flaw is a use-after-free read in libblkid's nested partition probers (BSD, Minix, Solaris x86, UnixWare). Runtime set traced on the image built from this branch (amd64): DT_NEEDED closure (readelf -dW via vex-tools) of /usr/bin/bash (= /bin/sh), /usr/bin/coreutils (chown, mkdir, id, cat and env are '#!/usr/bin/coreutils --coreutils-prog-shebang=X' wrappers), /usr/bin/find, /usr/bin/setpriv, /usr/bin/openssl, /usr/local/bin/redis-server and falkordb.so; plus a live trace: container started with LD_DEBUG=files LD_DEBUG_OUTPUT=/ldout/ld, once with TLS=0 and once with TLS=1, until 'Ready to accept connections'. Libraries loaded: bash->libtinfo; coreutils/find->libselinux, libpcre2-8, libacl, libattr, libcap; setpriv->libcap-ng and, through NSS initgroups (/etc/nsswitch.conf 'group: sss files systemd'), a dlopen of libnss_systemd.so.2 (systemd-libs) which pulls libcap, libm, libcrypt, libcrypto, libp11-kit, libffi, libselinux, libpcre2-8, libz, libgcc_s; libnss_sss.so.2 is tried but not installed; redis-server->libssl, libcrypto, libz, libm; falkordb.so->libstdc++, libgcc_s (and a failed dlopen of libarcher.so); openssl (TLS=1)->libssl, libcrypto, libz. CI's widened not-run set (every /usr/lib64/libnss_*.so*, gconv module, OpenSSL provider/engine and /usr/lib64/pkcs11/*.so, plus DT_NEEDED closure) was also computed: it adds libnss_{compat,dns,files,myhostname,resolve,systemd}, ossl-modules/{fips,legacy}.so, engines-3/*.so, p11-kit-trust.so, libp11-kit, libtasn1, libffi, libcrypt (libxcrypt), libresolv; none of gawk, sed, pam, xz-libs, bzip2-libs, libgcrypt, libblkid, libfdisk, libmount, libsmartcols or libuuid is in it. None of libblkid/libfdisk/libmount/libsmartcols/libuuid is in the runtime closure or the LD_DEBUG trace. util-linux and util-linux-core cannot be 'not-run': setpriv (util-linux) runs on every start, but it links only libcap-ng and libc, imports no blkid_/mnt_ symbols and contains no blkid/libmount strings. Setuid/setgid files found inside the image (find / -xdev -perm -4000 -o -perm -2000): /usr/bin/mount, /usr/bin/umount, /usr/bin/su (util-linux/util-linux-core), /usr/bin/gpasswd, /usr/bin/chage, /usr/bin/newgrp (shadow-utils), /usr/sbin/unix_chkpwd, /usr/sbin/pam_timestamp_check (pam), setgid /usr/bin/write (tty) and /usr/libexec/utempter/utempter (utmp). Of these only mount and umount link libmount -> libblkid. Who can run them: by design the only non-root code in the container is redis-server as falkordb (uid 999); there are no logins, root's password is locked ('*' in /etc/shadow; 'su root' as uid 999 fails), falkordb's is '!!'. So a local user means someone who has already gained code execution as uid 999 through a separate flaw, or an operator's own docker exec. Reachability through setuid mount, checked against util-linux 2.37.4 source (kernel.org tarball; RHEL carries patches on top) and then in the image: 'mount -l' is allowed for non-root (option 'l' is in the \"hlLUVvrist\" list in sys-utils/mount.c, so suid_drop() is not called), and print_all() calls mnt_cache_find_tag_value() for every source in /proc/self/mountinfo; libmount/src/cache.c mnt_cache_read_tags() then runs blkid_do_safeprobe() with superblocks and partitions enabled, as root. Pseudo-filesystem sources such as 'overlay' and 'tmpfs' are relative names, opened relative to the caller's working directory. Test 1: docker run --user 999 ... ; cd /tmp; dd 4 MiB to ./overlay; mkswap -L PWNED overlay; chmod 000 overlay (uid 999 can no longer read it); 'mount -l' printed '... type overlay (...) [PWNED]', so the probe ran as root on a file the user chose. Test 2: a crafted 4 MiB ./overlay traced with LIBBLKID_DEBUG=lowprobe mount -l (as root so the debug variable is honoured): the linux_raid prober calls blkid_probe_is_covered_by_pt(), which parses the partition table in full: 'parse EBR [start=1, size=100]', 'parts: add partition (start=0, size=1)', 'checking for subtypes'. The nested probers run from probe_dos_pt() at the 'checking for subtypes' step for primary partitions of those types (seen in the trace; the use-after-free itself was not triggered). Impact here is a memory-unsafe read inside a root process on attacker data; Red Hat rates it as limited information disclosure or denial of service. Other non-root mount paths stop early: no /etc/fstab (mount <dir> -> \"can't find in /etc/fstab\"), -T/-o/-t drop privileges, and the container has no block devices or /dev/loop-control by default. Mitigation checked: with --security-opt no-new-privileges, Test 1 no longer printed [PWNED] (NoNewPrivs: 1), and the container started, ran redis-server as uid 999 and answered GRAPH.QUERY. The evidence predicate only re-checks the first sentence of the action statement (nothing the image runs loads these libraries). If FalkorDB strips setuid/setgid bits in Dockerfile.rhel9 (e.g. find / -xdev -perm /6000 -type f -exec chmod ug-s {} +), the no-setid predicate would hold and this could become not_affected / vulnerable_code_not_in_execute_path. Red Hat CSAF (https://security.access.redhat.com/data/csaf/v2/vex/2026/cve-2026-13595.json): RHEL 9 libblkid/libfdisk/libmount/libsmartcols/libuuid/util-linux/util-linux-core known_affected, remediation 'Fix deferred', impact Moderate. Upstream fix https://github.com/util-linux/util-linux/commit/c0186f14fbdb02f64c8e0ba701ce727ea764ff4c. Trivy Status: affected."

