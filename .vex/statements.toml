[[statement]]
cve = "CVE-2026-77117"
os = "debian"
images = ["falkordb-server"]
packages = ["libc-bin", "libc6"]
status = "not_affected"
justification = "vulnerable_code_not_in_execute_path"
impact = "The flaw is in glibc's converter for the SHIFT_JISX0213 character set, which runs only when a program converts text from that character set. Redis and FalkorDB never ask for that conversion, and no program this image runs takes a character-set name from its input."
notes = "[confidence: high] Arches/images: all four Debian images (falkordb + falkordb-server, arm64 + amd64; I exported the missing server-amd64 rootfs with export-image.sh). Imports: readelf --dyn-syms over every ELF file, and every predicate re-run with the CI checker's own evaluate() (copy of build/vex/vex.py + .vex/statements.toml incl. the dlopen patterns) on `docker export` tarballs of the four images: all OK. glibc-internal calls: objdump -d of libc.so.6 on aarch64 and x86-64 (byte-identical between full and server per arch), listing every direct call/jump to the function. The fix (68d94bbe; 2.41 branch e43e46f9) changes only iconvdata/shift_jisx0213.c, which is built into the gconv module /usr/lib/<triplet>/gconv/SHIFT_JISX0213.so, not into libc.so.6 (libc.so.6 contains no 'JISX0213' string). That module is present in all four images (libc6, declared in gconv-modules.d/gconv-modules-extra.conf), so an absent predicate cannot settle it. It is dlopen'ed only when a conversion from that charset is requested. Inside libc the converter lookup is reached from three places only (objdump, both arches): iconv_open(), gettext's catalog conversion, and the wide-char/locale layer (locale codeset and fopen ',ccs='). Who can request it: redis-server, falkordb.so, node, the sharp/text-to-cypher addons, dash, find, gosu and the coreutils in the runtime set do not import iconv_open; bash (TLS=1 only) converts from UTF-8 for $'\\u' escapes and gen-certs.sh has none; libstdc++ (loaded via falkordb.so and node) calls iconv_open only in numpunct setup for a named locale, from that locale's own codeset (gcc-14.2.0 libstdc++-v3/config/locale/gnu/numeric_members.cc:58,70). The only locale data is /usr/lib/locale/C.utf8 (plus built-in C/POSIX) and /usr/share/locale is empty, so no codeset is ever JISX0213 and gettext never converts catalogs; no binary but glibc's own contains ',ccs='. LOCPATH/LANG are operator-set env. Dynamic check, both arches: after startup and a workload (Cypher with Japanese text, LOAD CSV of a Shift-JIS file (rejected as invalid UTF-8 by the Rust csv reader), a LOAD CSV URL lookup), /proc/1/maps of redis-server shows no gconv module. Advisory GLIBC-SA-2026-0019 (needs attacker-controlled input converted from SHIFT_JISX0213 with an output buffer small enough to split a character pair). Source: https://security-tracker.debian.org/tracker/CVE-2026-77117"

