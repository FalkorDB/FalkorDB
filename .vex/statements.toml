notes = "[confidence: medium] glibc 2.34-283.el9_8 is in the affected range (2.26-2.44; fix 506ea570, glibc 2.45; GLIBC-SA-2026-0021). The resolver is used: redis-server and bash import getaddrinfo, falkordb.so imports getaddrinfo and __res_init (LOAD CSV host lookups via Rust's to_socket_addrs), libcrypto imports getaddrinfo/gethostbyname. The trigger is only the search list from resolv.conf or LOCALDOMAIN, not DNS responses. Both are operator/runtime-controlled per the brief. Residual: Red Hat and the advisory note search domains can come from DHCP or VPN servers; Docker and Kubernetes copy the host's search list into the container, so an attacker who controls the host network's DHCP could reach every process on that host, not just this image. Red Hat CSAF: 'Fix deferred', Moderate. No CI predicate fits."

[[statement]]
cve = "CVE-2026-86805"
os = "rhel"
images = ["falkordb-server"]
