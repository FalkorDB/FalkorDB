notes = "[confidence: high] Runtime set traced on the image built from this branch (amd64): DT_NEEDED closure (readelf -dW via vex-tools) of /usr/bin/bash (= /bin/sh), /usr/bin/coreutils (chown, mkdir, id, cat and env are '#!/usr/bin/coreutils --coreutils-prog-shebang=X' wrappers), /usr/bin/find, /usr/bin/setpriv, /usr/bin/openssl, /usr/local/bin/redis-server and falkordb.so; plus a live trace: container started with LD_DEBUG=files LD_DEBUG_OUTPUT=/ldout/ld, once with TLS=0 and once with TLS=1, until 'Ready to accept connections'. Libraries loaded: bash->libtinfo; coreutils/find->libselinux, libpcre2-8, libacl, libattr, libcap; setpriv->libcap-ng and, through NSS initgroups (/etc/nsswitch.conf 'group: sss files systemd'), a dlopen of libnss_systemd.so.2 (systemd-libs) which pulls libcap, libm, libcrypt, libcrypto, libp11-kit, libffi, libselinux, libpcre2-8, libz, libgcc_s; libnss_sss.so.2 is tried but not installed; redis-server->libssl, libcrypto, libz, libm; falkordb.so->libstdc++, libgcc_s (and a failed dlopen of libarcher.so); openssl (TLS=1)->libssl, libcrypto, libz. CI's widened not-run set (every /usr/lib64/libnss_*.so*, gconv module, OpenSSL provider/engine and /usr/lib64/pkcs11/*.so, plus DT_NEEDED closure) was also computed: it adds libnss_{compat,dns,files,myhostname,resolve,systemd}, ossl-modules/{fips,legacy}.so, engines-3/*.so, p11-kit-trust.so, libp11-kit, libtasn1, libffi, libcrypt (libxcrypt), libresolv; none of gawk, sed, pam, xz-libs, bzip2-libs, libgcrypt, libblkid, libfdisk, libmount, libsmartcols or libuuid is in it. Nothing in the runtime set loads libmount/libblkid; setpriv (util-linux, runs on every start) links only libcap-ng and libc. Setuid/setgid files found inside the image (find / -xdev -perm -4000 -o -perm -2000): /usr/bin/mount, /usr/bin/umount, /usr/bin/su (util-linux/util-linux-core), /usr/bin/gpasswd, /usr/bin/chage, /usr/bin/newgrp (shadow-utils), /usr/sbin/unix_chkpwd, /usr/sbin/pam_timestamp_check (pam), setgid /usr/bin/write (tty) and /usr/libexec/utempter/utempter (utmp). Of these only mount and umount link libmount -> libblkid. Who can run them: by design the only non-root code in the container is redis-server as falkordb (uid 999); there are no logins, root's password is locked ('*' in /etc/shadow; 'su root' as uid 999 fails), falkordb's is '!!'. So a local user means someone who has already gained code execution as uid 999 through a separate flaw, or an operator's own docker exec. The flawed code is the restricted (non-root) user-mount path in setuid /usr/bin/mount (util-linux-core) + libmount, which only runs after an /etc/fstab entry with user/users (or user,loop) matches the request. /etc/fstab does not exist in the image (checked in a live container and in the exported rootfs; the setup package lists it but UBI ships without it), and /etc is root:root 0755, so uid 999 cannot create it. Tested as --user 999: 'mount /tmp/m' -> \"can't find in /etc/fstab\"; LIBMOUNT_FSTAB=/tmp/fstab (a file with bind,user and user,loop entries) is ignored for the setuid program, same error; 'mount -T /tmp/fstab /tmp/m' -> 'must be superuser' (-T makes mount drop root, sys-utils/mount.c suid_drop); 'mount -o loop ...' -> 'Operation not permitted'. Defence in depth: Docker's default capability set has no CAP_SYS_ADMIN, so mount(2) fails even for root in a default container. Caveat for the customer-facing text: an operator who bind-mounts their own /etc/fstab with user/users entries would re-enable the path (their configuration). Red Hat CSAF (https://security.access.redhat.com/data/csaf/v2/vex/2026/cve-2026-27456.json): RHEL 9 all seven packages known_affected, 'Fix deferred', Moderate; Red Hat statement: 'only exploitable when an /etc/fstab entry exists with user,loop options'. Upstream fix 5e390467 (2.41.4), GHSA-qq4x-vfq4-9h9g. Trivy Status: affected."

