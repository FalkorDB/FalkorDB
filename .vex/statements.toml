[[statement]]
cve = "CVE-2024-41996"
os = "rhel"
images = ["falkordb-server"]
packages = ["openssl", "openssl-libs"]
status = "not_affected"
justification = "inline_mitigations_already_exist"
impact = "The flaw makes a TLS server check a client's finite-field Diffie-Hellman key more slowly than it needs to, which OpenSSL's FIPS provider still does on hosts in FIPS mode. This image's system crypto policy turns off finite-field Diffie-Hellman key exchange, in TLS 1.2 and TLS 1.3, so no connection reaches that check."
evidence = [
  { check = "lacks", path = "/etc/crypto-policies/back-ends/opensslcnf.config", text = "ffdhe" },
  { check = "lacks", path = "/etc/crypto-policies/back-ends/opensslcnf.config", text = "kEDH" },
]
notes = "Mitigated in the image: Dockerfile.rhel9 sets the crypto policy to DEFAULT:NO-FFDHE, a subpolicy that drops the ffdhe groups and DHE-PSK, then removes kEDH from the generated OpenSSL file (a subpolicy cannot drop DHE-RSA without -aRSA). Tested with TLS=1 (client config bypassed): before, TLS 1.3 with only ffdhe2048 and TLS 1.2 with only DHE-RSA-AES256-GCM-SHA384 were accepted; after, both are refused, while TLS 1.3 by default and TLS 1.2 ECDHE-RSA still work. Before the change: on a FIPS-mode host the separate openssl-fips-provider-so (3.0.7, not reported by Trivy) still runs the full check (measured about 114 ms per check on an ffdhe8192 key vs about 4 ms with the default provider); with TLS=1 a client can force DHE. OpenSSL commit e70e34d857d4 'dh_kmgmt.c: Avoid expensive public key validation for known safe-prime groups' (2024-08-07, PR #25088, credited to Szilard Pfeiffer, the DHEat reporter) is contained in tag openssl-3.5.8 (gh compare: ahead); at 3.5.8 dh_validate_public() returns the partial check for ossl_dh_is_named_safe_prime_group(). openssl-libs 1:3.5.8-2.el9_8 is Red Hat's rebase onto upstream OpenSSL 3.5.8 (rpm -q --changelog openssl-libs: '1:3.5.8-1 - Rebase to OpenSSL 3.5.8', 2026-08-25; 3.5.8-2 adds one DTLS fix). Measured in the image (ffdhe8192 key, 5 runs each): `openssl pkey -pubin -pubcheck` 0.150 s vs 0.110 s just reading the key (default provider: no 8192-bit modexp); with `-provider fips -provider base -propquery fips=yes` 0.891 s vs 0.320 s (about 114 ms extra per check: the FIPS provider still does the full order check). With TLS=1 a client can force DHE (s_client -cipher DHE-RSA-AES256-GCM-SHA384 and TLS 1.3 -groups ffdhe2048 both negotiated); redis tls.c calls SSL_CTX_set_dh_auto(ctx,1) when no tls-dh-params-file is set, which picks RFC 3526 / RFC 7919 named groups. Red Hat CSAF: known_affected, 'Will not fix', Low; OpenSSL does not list it as a vulnerability. NEEDS HUMAN REVIEW: on a FIPS-mode host (/proc/sys/crypto/fips_enabled=1, which the container inherits) with TLS=1, the check runs in openssl-fips-provider-so 3.0.7 (a package Trivy does not report for this CVE), so the CPU asymmetry exists there."

