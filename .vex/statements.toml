notes = "[confidence: high] Arches/images: all four Debian images (falkordb + falkordb-server, arm64 + amd64; I exported the missing server-amd64 rootfs with export-image.sh). Imports: readelf --dyn-syms over every ELF file, and every predicate re-run with the CI checker's own evaluate() (copy of build/vex/vex.py + .vex/statements.toml incl. the dlopen patterns) on `docker export` tarballs of the four images: all OK. Aligned new is used: falkordb.so imports _ZnwmSt11align_val_t, node and the browser's libvips import _ZnamSt11align_val_t, so a no-import claim would be false. Disassembly of _ZnwmSt11align_val_t in libstdc++.so.6.0.33 (aarch64 at 0xaa1c0 and x86-64 at 0xb3c20): power-of-two check, size 0 -> 1, alignment raised to 8, then posix_memalign(&p, align, size) with the size unchanged; no add/round of the size. libstdc++ relocates posix_memalign and has no aligned_alloc relocation. The fix commit message (gcc r17-4611, https://gcc.gnu.org/pipermail/libstdc++-cvs/2026q3/045372.html): 'This doesn't affect most modern targets because they use the posix_memalign implementation. On targets without posix_memalign we use C11 aligned_alloc and round before calling it.' gcc-14-base, libgcc-s1 and libatomic1 contain no operator new. The version predicate pins the build whose code was read. Sources: https://access.redhat.com/security/cve/CVE-2026-95619 ; https://security-tracker.debian.org/tracker/CVE-2026-95619"

