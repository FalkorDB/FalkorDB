notes = "[confidence: high] Checked on all four Debian images (the image built from this branch{server,full}-{arm64,amd64}); server-amd64 was exported with docker export since no prepared rootfs existed. Every ELF in each rootfs was read with readelf -d/--dyn-syms (vex-tools). Runtime set used: dash (run.sh, browser docker-entrypoint.sh, its sh -c write test), find, chown, mkdir, id, env, bash+openssl+cat (gen-certs.sh, TLS=1), /usr/sbin/gosu, redis-server, falkordb.so; falkordb image adds head, od, tr, touch, rm and node, plus every glibc native addon/shared object under /var/lib/falkordb/browser. Possible dlopen targets were added as roots too (all gconv modules, libnss_files/libnss_dns per nsswitch.conf, OpenSSL ossl-modules and engines-3). The DT_NEEDED closure of that set contains libtinfo.so.6 (from bash) and none of libtic, libacl, libattr, libsystemd, libudev, libbz2 or libapt-pkg. strings over every closure ELF found no dlopen of those names (redis-server only prints that it was built without libsystemd). Running each image and reading /proc/*/maps of redis-server and next-server showed none of them mapped. Debian builds dash 0.5.12-12 with --disable-fnmatch --disable-glob (debian/rules at sources.debian.org/src/dash/0.5.12-12), and /usr/bin/dash imports neither fnmatch nor glob, so the internal pmatch() is used for case, ${var#pat}/${var%pat} and pathname expansion. run.sh and docker-entrypoint.sh contain no case statement and no #/% pattern expansion; the only unquoted expansions are REDIS_ARGS, FALKORDB_ARGS, FALKORDB_BIN_PATH, FALKORDB_TLS_PATH (operator environment), arithmetic results and ${#VAR} lengths. Other shells started at runtime run fixed command strings: the browser entrypoint's sh -c write test, Next.js start-server's 'lsof -ti:<port>' probe on a port clash (port from config), and libc-detection fallbacks in detect-libc/napi-rs (not taken: /usr/bin/ldd is readable). redis-server never execs a shell; falkordb.so calls system() only from GB_jitifyer_cmake_compile/direct_compile, which GB_jitifyer_load_worker skips when control < GxB_JIT_ON (shipped value GxB_JIT_RUN, graph/src/graph/graphblas/matrix.rs). A node child_process logging hook (--require) logged no calls at start-up or on page loads. Debian: unimportant, 'Negligible security impact'."

