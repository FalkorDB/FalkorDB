services:
  falkordb-server:
    image: falkordb/falkordb-server:latest
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - falkordb-data:/data

  falkordb-browser:
    image: falkordb/falkordb-browser:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - falkordb-server

volumes:
  falkordb-data:
