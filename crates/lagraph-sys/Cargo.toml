[package]
name = "lagraph-sys"
version = "0.1.0"
edition = "2024"
description = "Raw bindings to LAGraph, as built by native-deps"
license = "SSPL-1.0"
repository = "https://github.com/FalkorDB/FalkorDB"
publish = false
# Exactly one crate may link liblagraph; cargo enforces it through this key.
links = "lagraph"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
# LAGraph's API is written in GraphBLAS handles; they come from here, so the
# two sets of bindings cannot disagree about what a `GrB_Matrix` is.
graphblas-sys = { path = "../graphblas-sys" }

[build-dependencies]
native-deps = { path = "../../native-deps" }
