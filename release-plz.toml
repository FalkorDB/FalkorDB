# release-plz configuration
# https://release-plz.dev/docs/config

[workspace]
# Only open a release PR when there are unreleased commits to ship.
release_always = false
# Do not publish to crates.io — we ship via Docker (falkordb/falkordb-next).
publish = false
# Create a GitHub Release (with autogenerated changelog body) when the release PR merges.
git_release_enable = true
# Create the annotated git tag (e.g. v0.2.0) when the release PR merges.
git_tag_enable = true

[[package]]
name = "falkordb-rs"
# Top-level crate is the source of truth for the image tag; produce a GitHub Release for it.
git_release_enable = true

[[package]]
name = "graph"
# Inner workspace member: version bumps in lockstep, but no separate release/tag.
publish = false
git_release_enable = false
git_tag_enable = false
