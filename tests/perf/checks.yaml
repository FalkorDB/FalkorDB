# The perf checks the nightly run (.github/workflows/perf-nightly.yml) measures,
# besides the micro tier, which it always calls through _perf-micro.yml.
#
# The list starts empty: this file holds only comments, which parses as no
# checks. Each check's PR appends exactly one entry at the end and touches
# nothing else here (an explicit `[]` would turn the first append into invalid
# YAML):
#
#   - name: size-probe                 # = result.json "check"; ^[a-z][a-z0-9-]{0,42}$, no "--"
#     runner: vm                       # vm (_perf-vm.yml on a GCE VM) | hosted (ubuntu-latest)
#     command: uv run --project bench bench probe
#     timeout_minutes: 45              # 1-330
#     machine_type: n4-standard-16     # vm only; optional
#
# The workflow appends --candidate, --baseline (both image@sha256), the four
# optional --candidate-/--baseline-label/-commit flags, --out and --mode to the
# command. tests/perf/merge.py reads this file, and tests/perf/test_merge.py
# fails on an entry it cannot use. At night, such an entry (or a file that does
# not parse) is reported as an error rather than skipped.
# TEMPORARY (proof run on the PR, reverted before ready): a check that writes
# no result.json, which the night must report as an error.
- name: writes-nothing
  runner: hosted
  command: "true"
  timeout_minutes: 5
