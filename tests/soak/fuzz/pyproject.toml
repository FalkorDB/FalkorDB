# The fuzz check (tests/perf/checks.yaml: `uv run --project tests/soak/fuzz soak-fuzz`) is its own
# uv project: it runs on a bare VM that ships Docker, python3 and uv, and `uv run` gives it a
# locked redis-py there. Its tests need none of it (stdlib + pytest; see test_fuzz.py).
[project]
name = "soakfuzz"
version = "0.1.0"
description = "Seeded soak of long reads, writes and cheap reads against FalkorDB images"
requires-python = ">=3.11"
dependencies = [
    # 5.x: retries are set off per connection (Retry(NoBackoff(), 0)); 6+ changes the defaults
    "redis==5.2.1",
    # the full scan returns ~100k rows; the pure-Python parser would add seconds to each
    "hiredis==3.1.0",
]

[project.scripts]
soak-fuzz = "soakfuzz.check:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soakfuzz"]
