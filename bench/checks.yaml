# The perf checks the nightly run (.github/workflows/perf-nightly.yml) measures,
# besides micro-hw, which it runs through _perf-micro.yml.
#
# The list starts empty: this file holds only comments, which parses as no
# checks. Each check's PR appends exactly one entry at the end and touches
# nothing else here (an explicit `[]` would turn the first append into invalid
# YAML):
#
#   - name: pokec                      # = result.json "check"; ^[a-z][a-z0-9-]{0,42}$, no "--"
#     runner: vm                       # vm (_perf-vm.yml on a GCE VM) | hosted (ubuntu-latest)
#     command: uv run --project bench --frozen bench pokec   # a group goes before `bench`: --group <name>
#     timeout_minutes: 75              # vm 1-300, hosted 1-330
#     machine_type: n4-standard-16     # vm only; optional
#
# Both runners run the command through tests/perf/vm/run-check.sh from the
# repository root: it is split on spaces (no shell syntax), and --candidate,
# --baseline (both image@sha256), the optional --candidate-/--baseline-label and
# -commit flags, --out and --mode are appended. `bench nightly merge plan` reads
# this file, and bench/tests/test_nightly_merge.py fails on an entry it cannot
# use. At night, such an entry (or a file that does not parse) is reported as an
# error rather than skipped.
