      judge: >-
        The regression comes from the control epoch: reads time out behind
        a waiting writer.

  ldbc:
    - id: ldbc-a-a
      candidate: *main-4c1088949
      baseline: *main-4c1088949
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
    - id: ldbc-c-v4.22.4-a-a
      candidate: *c-v4-22-4
      baseline: *c-v4-22-4
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
      judge: >-
        The C engine against itself. Its 4 known gaps, IC1, IC10, IC13 and
        IC14 (errors on every attempt on both sides in run 45390117925), are
        info findings, never regressions.
    - id: ldbc-6.0.4-vs-6.2.0
      candidate: *v6-0-4
      baseline: *v6-2-0
      mode: nightly
      expect:
        verdict: regression
        findings:
          - {name_regex: '\bic1\b', metric: [p50_ms, p95_ms, p99_ms], status: regression}
          - {name_regex: '\bic2\b', metric: [p50_ms, p95_ms, p99_ms], status: regression}
          - {name_regex: '\bic12\b', status: regression}
      judge: >-
        Latency regressions on IC1 and IC2, confirmed by a re-run, and a
        regression of any kind on IC12: its slow rows can exhaust the run's
        deadline, and a re-run that does not re-time every row is
        inconclusive for latency, while its `completed` regression stands
        (perf-coord, 2026-11-24). Run 45390117925: IC1 p95 170x, IC2 p50 90x,
        IC12 p95 288x on 18 re-run rows. IC3 is not part of the expectation:
        it does not finish on either side. v6.0.4
        (6ca3adc9d) lacks #3593 (98e05a415, the #2558 fix) and v6.2.0
        contains it. The patterns are word-bounded so IC1 does not match
        IC10-IC14. (Was "to verify"; amended 2026-11-24, DECISIONS.)
