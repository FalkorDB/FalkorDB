checks:
  micro-hw:
    - id: micro-hw-a-a
      candidate: *main-4c1088949
      baseline: *main-4c1088949
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
    - id: micro-hw-a-a-6.2.0
      candidate: *v6-2-0
      baseline: *v6-2-0
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
    - id: micro-hw-6.2.0-vs-main
      candidate: *v6-2-0
      baseline: *main-4c1088949
      mode: nightly
      expect:
        verdict: regression
        findings:
          - {name_regex: '^UNWIND index MATCH edge 1 row( \[(reads|writes)\])?$', metric: cycles, status: regression}
          - {name_regex: '^UNWIND id MATCH edge 1 row( \[(reads|writes)\])?$', metric: cycles, status: regression}
          - {name_regex: '^UNWIND id MATCH edge 100 rows( \[(reads|writes)\])?$', metric: cycles, status: regression}
          - {name_regex: '^correlated hash join( \[(reads|writes)\])?$', metric: alloc_bytes, status: regression}
      judge: >-
        Three of the four rows #3963 added (bench/src/falkorbench/queries.py)
        regress on cycles, and correlated hash join on allocated bytes, each
        confirmed by a re-run. The fourth #3963 row, UNWIND index MATCH edge
        100 rows, is at parity at bench sizes (one hash join over the scan
        costs about as much as 100 seeks): report its ratio, it is not
        required. Report
        the other allocation rows (the replay of run 45403484820 also flagged
        id eq join and the three #3963 rows) and the branch/L2 miss rows as
        measured. micro-hw names a finding "<row> [<class>]"; the patterns are
        anchored so no other row matches.
    - id: micro-hw-c-v4.22.4-a-a
      candidate: *c-v4-22-4
      baseline: *c-v4-22-4
      mode: nightly
      expect: {}
      judge: >-
        Hardware counters can measure the C engine (callgrind cannot). Only
        a valid result.json is required; record its verdict and findings as
        measured.

  pokec:
    - id: pokec-a-a
      candidate: *main-4c1088949
      baseline: *main-4c1088949
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
    - id: pokec-c-v4.22.4-a-a
      candidate: *c-v4-22-4
      baseline: *c-v4-22-4
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
      judge: The C engine against itself.
    - id: pokec-6.0.4-vs-6.0.1
      candidate: *v6-0-4
      baseline: *v6-0-1
      mode: nightly
      expect:
        verdict: regression
        findings:
          - {name_regex: 3-hop, status: regression}
      judge: >-
        The regression is the 3-hop read MATCH (s:User {id:$id})-->()-->()-->(n:User)
        WHERE n.age >= 18 RETURN DISTINCT n.id: it does not finish (metric
        completed, candidate 0) or the server stops answering PING (seconds,
        not milliseconds) under 5% writes; confirmed: true.

