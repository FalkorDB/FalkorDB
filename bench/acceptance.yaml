      judge: >-
        The regression is in graph-build time (the edge phase: 7.9 s on
        6.2.0 vs 1.3 s on 6.0.4 in the Nov 23 re-check).
    - id: fuzz-control-a-a
      candidate: *c-v4-22-2
      baseline: *c-v4-22-2
      mode: nightly
      expect:
        verdict: pass
        no_regression_findings: true
      judge: The control epoch on C compared with itself flags nothing.
    - id: fuzz-control-c-v4.22.3-vs-c-v4.22.2
      candidate: *c-v4-22-3
      baseline: *c-v4-22-2
      mode: nightly
      expect:
        verdict: regression
        findings:
