    - {id: soak-s09-a-a, candidate: *main-4c1088949, baseline: *main-4c1088949, mode: nightly,
       expect: {regressions_only_known_breaks: true}}
  soak-s10:
    - id: soak-s10-a-a
      candidate: *main-4c1088949
      baseline: *main-4c1088949
      mode: nightly
      expect: {regressions_only_known_breaks: true}
      judge: >-
        s10's known flaky checks (#3095, #3512) can break on main against itself:
        red under contract v1.14, named with its issue and `introduced: false`
        (the release gate leaves it out). The flake fired; the pair holds.
  soak-s11:
    - {id: soak-s11-a-a, candidate: *main-4c1088949, baseline: *main-4c1088949, mode: nightly,
       expect: {regressions_only_known_breaks: true}}
  soak-s12:
    - {id: soak-s12-a-a, candidate: *main-4c1088949, baseline: *main-4c1088949, mode: nightly,
       expect: {regressions_only_known_breaks: true}}
    - id: soak-s12-6.2.0-vs-6.0.4
      candidate: *v6-2-0
      baseline: *v6-0-4
      mode: nightly
      expect:
        findings:
          - {name_regex: s12, status: improvement}
        no_regression_findings_matching: s12
      judge: >-
        Gated improvements on scenario s12 (IoT ingest); 6.0.4 lacks #2981
        (Cartesian plan, inline-read break). perf-soak-port's dev-VM data
        under the final gates: ingest_batch p50 0.093x (38.7 vs 417.1 ms) and
        throughput 2.76x, ingest_single p50 0.23x, the 2m/30s queries p50
        0.018-0.091x, retention_delete p50 0.028x, and the inline-read
        invariant held on 6.2.0 and broke on 6.0.4. Amended 2026-11-24 from
        "regression" (DECISIONS); the check was not changed to fit. p99 rows
        are info. Any other finding is reported as measured.
    - id: soak-s12-6.2.0-vs-6.2.1
      candidate: *v6-2-0
      baseline: *v6-2-1
      mode: nightly
      expect:
        verdict: regression
        findings:
          - {name_regex: s12, status: regression}
      judge: >-
        6.2.1 adds main@4c1088949's five fixes to 6.2.0 (#3889, #3963 among
        them), so 6.2.0's s12 ingest is the slower side. perf-soak-port's
        dev-VM data under the final gates: exactly one regression,
        s12 ingest_batch p50_ms 37.2 vs 7.8 ms (4.78x, +29.4 ms), crossing on
        the first pass and on the swapped re-run (a throughput row with the
        same name is ok: match on status). p99 rows are info.

  fuzz:
    - id: fuzz-a-a
      candidate: *main-4c1088949
