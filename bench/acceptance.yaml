# Acceptance pairs: for each nightly perf check, image pairs whose right answer
# is known, and the answer the check must give. The same image compared with
# itself must pass; 6.2.0 against main@4c1088949 must flag the rows #3963 fixed;
# and so on. A check is accepted when an independent run of every pair (the
# acceptance run) comes out as expected; the owner's own run is evidence only.
#
# Every pair runs in mode nightly, on GCE (micro-hw: a C4 VM with counters),
# with both images and their labels/commits passed to the check:
#
#   <command> --candidate <image> --baseline <image> --out <dir> --mode nightly \
#     --candidate-label <label> --baseline-label <label> \
#     [--candidate-commit <commit>] [--baseline-commit <commit>]
#
# Images were pinned on 2026-11-24 with `docker buildx imagetools inspect`.
# Commits are the release tags' commits (git tags v6.0.1, v6.0.4, v6.2.0,
# v6.2.1, v4.22.2, v4.22.3, v4.22.4) and main's merge commit for #3963. cleanup-rc-images.yml
# deletes old rc-* images, so the main@4c1088949 digest can disappear; if it
# does, re-pin it here rather than substitute a tag.
#
# expect.verdict      pass | regression. Absent: the verdict is not part of the
#                     expectation. An empty expect ({}):
#                     only a valid result.json is required.
# expect.findings     each entry must match at least one finding in the
#                     result with that `status` (and, when given, that
#                     `metric`, or one of a list of metrics), and a name that
#                     is `name` exactly or contains `name_regex` (Python
#                     re.search, case-insensitive).
#                     Contract v1.4 fixes these patterns: checks name their
#                     findings so that they match.
# expect.no_regression_findings
#                     true: no finding may have status regression
# expect.no_regression_findings_matching
#                     no finding with status regression has a name matching
#                     this pattern (same matching as name_regex)
# expect.regressions_only_known_breaks
#                     true: every regression finding is a known break, a
#                     correctness row that soak's ISSUES map names (its
#                     KNOWN_FLAKY rows among them) and that the result's
#                     `broken` list names with that issue; a performance row,
#                     a crash or any other break fails the pair. The verdict
#                     may be regression (contract v1.14: a break on the
#                     candidate is red). falkorbench.soak.check.unknown_breaks
#                     lists the findings that fail it. Soak's A/A pairs only.
# judge               what a person checks by hand in the findings and
#                     artifacts, beyond the fields above

